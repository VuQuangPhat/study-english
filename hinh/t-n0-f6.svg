<svg aria-label="Cây hình thành từ từ một gốc" role="img" style="min-width:680px" viewbox="0 0 780 296"><rect class="fa" height="44" rx="10" width="180" x="300" y="4"></rect><text class="tw" style="font-size:15px" text-anchor="middle" x="390" y="26"><tspan x="390">Gốc từ:  decide</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="77" y1="48" y2="92"></line><rect class="na" height="40" rx="10" width="146" x="4" y="94"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="77" y="114"><tspan x="77">DANH TỪ</tspan></text><rect class="nb" height="64" rx="10" width="146" x="4" y="138"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="77" y="170"><tspan dy="-0.62em" x="77">-tion -sion -ment</tspan><tspan dy="1.25em" x="77">-ness -ity -ance</tspan></text><rect class="nb" height="40" rx="10" width="146" x="4" y="206"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="77" y="226"><tspan x="77">decision</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="231" y1="48" y2="92"></line><rect class="na" height="40" rx="10" width="146" x="158" y="94"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="231" y="114"><tspan x="231">DANH TỪ (người)</tspan></text><rect class="nb" height="64" rx="10" width="146" x="158" y="138"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="231" y="170"><tspan x="231">-er -or -ist -ee</tspan></text><rect class="nb" height="40" rx="10" width="146" x="158" y="206"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="231" y="226"><tspan x="231">decider / assignee</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="385" y1="48" y2="92"></line><rect class="ng" height="40" rx="10" width="146" x="312" y="94"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="385" y="114"><tspan x="385">TÍNH TỪ</tspan></text><rect class="nb" height="64" rx="10" width="146" x="312" y="138"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="385" y="170"><tspan dy="-0.62em" x="385">-al -ive -able</tspan><tspan dy="1.25em" x="385">-ous -ful -less</tspan></text><rect class="nb" height="40" rx="10" width="146" x="312" y="206"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="385" y="226"><tspan x="385">decisive</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="539" y1="48" y2="92"></line><rect class="no" height="40" rx="10" width="146" x="466" y="94"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="539" y="114"><tspan x="539">ĐỘNG TỪ</tspan></text><rect class="nb" height="64" rx="10" width="146" x="466" y="138"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="539" y="170"><tspan x="539">-ate -ize -ify -en</tspan></text><rect class="nb" height="40" rx="10" width="146" x="466" y="206"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="539" y="226"><tspan x="539">legalize, shorten</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="693" y1="48" y2="92"></line><rect class="nr" height="40" rx="10" width="146" x="620" y="94"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="693" y="114"><tspan x="693">TRẠNG TỪ</tspan></text><rect class="nb" height="64" rx="10" width="146" x="620" y="138"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="693" y="170"><tspan x="693">-ly</tspan></text><rect class="nb" height="40" rx="10" width="146" x="620" y="206"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="693" y="226"><tspan x="693">decisively</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="276"><tspan x="390">Bước 1: nhìn chỗ trống cần LOẠI TỪ gì.   Bước 2: chọn đuôi đúng loại từ.   Bước 3: kiểm tra nghĩa (khẳng định / phủ định).</tspan></text></svg>