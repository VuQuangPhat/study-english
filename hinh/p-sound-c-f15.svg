<svg aria-label="Nhịp câu và ngữ điệu" role="img" style="min-width:680px" viewbox="0 0 780 336"><text class="tb" text-anchor="middle" x="390" y="22"><tspan x="390">Nhịp câu: từ mang nghĩa được NHẤN, từ chức năng đọc nhẹ và nhanh</tspan></text><rect class="nb" height="34" rx="10" width="60" x="30" y="136"></rect><text class="tm" style="font-size:12px" text-anchor="middle" x="60" y="153"><tspan x="60">Please</tspan></text><circle class="nb" cx="60" cy="196" r="4" style="stroke:var(--ink3)"></circle><rect class="na" height="70" rx="10" width="104" x="100" y="100"></rect><text class="tb" style="font-size:15px" text-anchor="middle" x="152" y="135"><tspan x="152">SEND</tspan></text><circle class="fa" cx="152" cy="196" r="9"></circle><rect class="nb" height="34" rx="10" width="60" x="214" y="136"></rect><text class="tm" style="font-size:12px" text-anchor="middle" x="244" y="153"><tspan x="244">me</tspan></text><circle class="nb" cx="244" cy="196" r="4" style="stroke:var(--ink3)"></circle><rect class="nb" height="34" rx="10" width="60" x="284" y="136"></rect><text class="tm" style="font-size:12px" text-anchor="middle" x="314" y="153"><tspan x="314">the</tspan></text><circle class="nb" cx="314" cy="196" r="4" style="stroke:var(--ink3)"></circle><rect class="na" height="70" rx="10" width="104" x="354" y="100"></rect><text class="tb" style="font-size:15px" text-anchor="middle" x="406" y="135"><tspan x="406">CONtract</tspan></text><circle class="fa" cx="406" cy="196" r="9"></circle><rect class="nb" height="34" rx="10" width="60" x="468" y="136"></rect><text class="tm" style="font-size:12px" text-anchor="middle" x="498" y="153"><tspan x="498">by</tspan></text><circle class="nb" cx="498" cy="196" r="4" style="stroke:var(--ink3)"></circle><rect class="na" height="70" rx="10" width="104" x="538" y="100"></rect><text class="tb" style="font-size:15px" text-anchor="middle" x="590" y="135"><tspan x="590">FRIday</tspan></text><circle class="fa" cx="590" cy="196" r="9"></circle><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="226"><tspan x="390">● = nhấn  ·  ○ = nhẹ.   Các nhịp nhấn cách nhau gần đều nhau, từ nhẹ giữa chúng được “nén” lại.</tspan></text><rect class="nb" height="78" rx="10" width="370" x="10" y="244"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="195" y="283"><tspan dy="-1.24em" x="195">Hạ giọng ↘</tspan><tspan dy="1.25em" x="195">Câu khẳng định · Wh-question · mệnh lệnh</tspan><tspan dy="1.25em" x="195">When is the deadline? ↘</tspan></text><rect class="nb" height="78" rx="10" width="370" x="400" y="244"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="585" y="283"><tspan dy="-1.24em" x="585">Lên giọng ↗</tspan><tspan dy="1.25em" x="585">Câu hỏi Yes/No · hỏi lại lịch sự</tspan><tspan dy="1.25em" x="585">Could you send it today? ↗</tspan></text></svg>