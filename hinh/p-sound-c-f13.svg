<svg aria-label="Cách đọc đuôi -ed và -s" role="img" style="min-width:680px" viewbox="0 0 780 350"><rect class="fa" height="36" rx="10" width="360" x="10" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="190" y="22"><tspan x="190">Đuôi -ed: nhìn ÂM CUỐI của động từ gốc</tspan></text><rect class="fa" height="36" rx="10" width="360" x="410" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="590" y="22"><tspan x="590">Đuôi -s / -es: nhìn ÂM CUỐI của từ gốc</tspan></text><rect class="nr" height="78" rx="10" width="86" x="10" y="56"></rect><text class="tb" style="font-size:19px" text-anchor="middle" x="53" y="95"><tspan x="53">/ɪd/</tspan></text><rect class="nb" height="78" rx="10" width="268" x="102" y="56"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="236" y="95"><tspan dy="-1.24em" x="236">âm cuối là /t/ hoặc /d/</tspan><tspan dy="1.25em" x="236">want → wanted</tspan><tspan dy="1.25em" x="236">need → needed</tspan></text><rect class="na" height="78" rx="10" width="86" x="10" y="144"></rect><text class="tb" style="font-size:19px" text-anchor="middle" x="53" y="183"><tspan x="53">/t/</tspan></text><rect class="nb" height="78" rx="10" width="268" x="102" y="144"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="236" y="183"><tspan dy="-1.86em" x="236">âm VÔ THANH:</tspan><tspan dy="1.25em" x="236">p, k, f, s, ʃ, tʃ, θ</tspan><tspan dy="1.25em" x="236">work → worked</tspan><tspan dy="1.25em" x="236">stop → stopped</tspan></text><rect class="ng" height="78" rx="10" width="86" x="10" y="232"></rect><text class="tb" style="font-size:19px" text-anchor="middle" x="53" y="271"><tspan x="53">/d/</tspan></text><rect class="nb" height="78" rx="10" width="268" x="102" y="232"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="236" y="271"><tspan dy="-1.24em" x="236">còn lại (âm hữu thanh, nguyên âm)</tspan><tspan dy="1.25em" x="236">play → played</tspan><tspan dy="1.25em" x="236">open → opened</tspan></text><rect class="nr" height="78" rx="10" width="86" x="410" y="56"></rect><text class="tb" style="font-size:19px" text-anchor="middle" x="453" y="95"><tspan x="453">/ɪz/</tspan></text><rect class="nb" height="78" rx="10" width="268" x="502" y="56"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="636" y="95"><tspan dy="-1.24em" x="636">âm xì: s, z, ʃ, ʒ, tʃ, dʒ</tspan><tspan dy="1.25em" x="636">pass → passes</tspan><tspan dy="1.25em" x="636">watch → watches</tspan></text><rect class="na" height="78" rx="10" width="86" x="410" y="144"></rect><text class="tb" style="font-size:19px" text-anchor="middle" x="453" y="183"><tspan x="453">/s/</tspan></text><rect class="nb" height="78" rx="10" width="268" x="502" y="144"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="636" y="183"><tspan dy="-1.86em" x="636">âm VÔ THANH:</tspan><tspan dy="1.25em" x="636">p, t, k, f, θ</tspan><tspan dy="1.25em" x="636">stop → stops</tspan><tspan dy="1.25em" x="636">work → works</tspan></text><rect class="ng" height="78" rx="10" width="86" x="410" y="232"></rect><text class="tb" style="font-size:19px" text-anchor="middle" x="453" y="271"><tspan x="453">/z/</tspan></text><rect class="nb" height="78" rx="10" width="268" x="502" y="232"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="636" y="271"><tspan dy="-1.24em" x="636">còn lại (hữu thanh, nguyên âm)</tspan><tspan dy="1.25em" x="636">plan → plans</tspan><tspan dy="1.25em" x="636">see → sees</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="332"><tspan x="390">Mẹo: đặt ngón tay lên cổ họng. Rung = hữu thanh, không rung = vô thanh (/p t k f s ʃ tʃ θ/).</tspan></text></svg>