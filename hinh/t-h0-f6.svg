<svg aria-label="Chọn V-ing hay to-V sau động từ" role="img" style="min-width:680px" viewbox="0 0 780 302"><rect class="fa" height="40" rx="10" width="240" x="270" y="4"></rect><text class="tw" style="font-size:14px" text-anchor="middle" x="390" y="24"><tspan x="390">Động từ đứng TRƯỚC là gì?</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="74" y1="44" y2="80"></line><rect class="na" height="50" rx="10" width="144" x="4" y="82"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="76" y="107"><tspan x="76">V-ing</tspan></text><rect class="nb" height="120" rx="10" width="144" x="4" y="136"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="76" y="196"><tspan dy="-3.10em" x="76">enjoy, avoid,</tspan><tspan dy="1.25em" x="76">finish,</tspan><tspan dy="1.25em" x="76">mind, keep,</tspan><tspan dy="1.25em" x="76">suggest,</tspan><tspan dy="1.25em" x="76">consider, practise,</tspan><tspan dy="1.25em" x="76">admit, deny, risk</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="228" y1="44" y2="80"></line><rect class="ng" height="50" rx="10" width="144" x="158" y="82"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="230" y="107"><tspan x="230">to-V</tspan></text><rect class="nb" height="120" rx="10" width="144" x="158" y="136"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="230" y="196"><tspan dy="-3.10em" x="230">want, hope, decide,</tspan><tspan dy="1.25em" x="230">plan, agree,</tspan><tspan dy="1.25em" x="230">refuse,</tspan><tspan dy="1.25em" x="230">afford, manage,</tspan><tspan dy="1.25em" x="230">offer,</tspan><tspan dy="1.25em" x="230">promise, learn</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="382" y1="44" y2="80"></line><rect class="no" height="50" rx="10" width="144" x="312" y="82"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="384" y="107"><tspan x="384">V nguyên (không to)</tspan></text><rect class="nb" height="120" rx="10" width="144" x="312" y="136"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="384" y="196"><tspan dy="-1.86em" x="384">modal: can, must…</tspan><tspan dy="1.25em" x="384">let / make + O</tspan><tspan dy="1.25em" x="384">had better</tspan><tspan dy="1.25em" x="384">would rather</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="536" y1="44" y2="80"></line><rect class="nr" height="50" rx="10" width="144" x="466" y="82"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="538" y="107"><tspan dy="-0.62em" x="538">V-ing HOẶC to-V</tspan><tspan dy="1.25em" x="538">(KHÁC NGHĨA)</tspan></text><rect class="nb" height="120" rx="10" width="144" x="466" y="136"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="538" y="196"><tspan dy="-1.86em" x="538">stop, remember,</tspan><tspan dy="1.25em" x="538">forget, try,</tspan><tspan dy="1.25em" x="538">regret,</tspan><tspan dy="1.25em" x="538">go on</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="690" y1="44" y2="80"></line><rect class="nb" height="50" rx="10" width="144" x="620" y="82"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="692" y="107"><tspan x="692">GIỚI TỪ + V-ing</tspan></text><rect class="nb" height="120" rx="10" width="144" x="620" y="136"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="692" y="196"><tspan dy="-1.86em" x="692">look forward to</tspan><tspan dy="1.25em" x="692">be used to</tspan><tspan dy="1.25em" x="692">in / by / without</tspan><tspan dy="1.25em" x="692">+ V-ing</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="282"><tspan x="390">Mẹo: V-ing = việc ĐANG / ĐÃ làm, thực tế.   to-V = việc CHƯA làm, mục đích, tương lai.</tspan></text></svg>