<svg aria-label="Chọn a, an, the hay không mạo từ" role="img" style="min-width:680px" viewbox="0 0 780 360"><rect class="fa" height="40" rx="10" width="260" x="260" y="4"></rect><text class="tw" style="font-size:14px" text-anchor="middle" x="390" y="24"><tspan x="390">Danh từ cần mạo từ</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="390" y1="44" y2="70"></line><rect class="nq" height="52" rx="10" width="340" x="220" y="72"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="390" y="98"><tspan dy="-0.62em" x="390">Người nghe có BIẾT ĐÓ LÀ CÁI NÀO không?</tspan><tspan dy="1.25em" x="390">(đã nhắc, duy nhất, chỉ có một)</tspan></text><line class="ln" x1="220" x2="130" y1="98" y2="98"></line><text class="tg" style="font-size:12px" text-anchor="middle" x="180" y="88"><tspan x="180">Có</tspan></text><polyline class="ln" fill="none" marker-end="url(#ah)" points="130,98 130,140"></polyline><rect class="ng" height="50" rx="10" width="220" x="20" y="142"></rect><text class="tb" style="font-size:14px" text-anchor="middle" x="130" y="167"><tspan dy="-0.62em" x="130">THE</tspan><tspan dy="1.25em" x="130">the contract, the sun</tspan></text><line class="ln" x1="560" x2="650" y1="98" y2="98"></line><text class="tr" style="font-size:11px" text-anchor="start" x="612" y="88"><tspan x="612">Chưa / lần đầu</tspan></text><polyline class="ln" fill="none" marker-end="url(#ah)" points="650,98 650,140"></polyline><rect class="nq" height="52" rx="10" width="260" x="500" y="142"></rect><text class="tx" style="font-size:13px" text-anchor="middle" x="630" y="168"><tspan x="630">Đếm được SỐ ÍT?</tspan></text><polyline class="ln" fill="none" marker-end="url(#ah)" points="560,194 560,230"></polyline><text class="tg" style="font-size:12px" text-anchor="middle" x="590" y="216"><tspan x="590">Có</tspan></text><rect class="ng" height="50" rx="10" width="200" x="450" y="232"></rect><text class="tb" style="font-size:14px" text-anchor="middle" x="550" y="257"><tspan dy="-0.62em" x="550">A / AN</tspan><tspan dy="1.25em" x="550">a deal, an hour</tspan></text><polyline class="ln" fill="none" marker-end="url(#ah)" points="700,194 700,230"></polyline><text class="tr" style="font-size:11px" text-anchor="start" x="718" y="216"><tspan x="718">Không</tspan></text><rect class="ng" height="50" rx="10" width="110" x="660" y="232"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="715" y="257"><tspan dy="-0.62em" x="715">Ø hoặc</tspan><tspan dy="1.25em" x="715">some</tspan></text><rect class="nb" height="118" rx="12" width="420" x="20" y="230"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="230" y="289"><tspan dy="-3.10em" x="230">Dùng THE luôn luôn:</tspan><tspan dy="1.25em" x="230">• so sánh nhất (the best)   • duy nhất (the sun, the</tspan><tspan dy="1.25em" x="230">Constitution)</tspan><tspan dy="1.25em" x="230">• sông, biển, dãy núi, nhóm đảo (the Mekong, the Alps)</tspan><tspan dy="1.25em" x="230">• nhóm người (the rich)   • the + tên tổ chức có “of” (the</tspan><tspan dy="1.25em" x="230">Court of Appeal)</tspan></text></svg>