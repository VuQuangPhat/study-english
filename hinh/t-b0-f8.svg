<svg aria-label="Sáu đường thời gian minh hoạ các thì" role="img" style="min-width:680px" viewbox="0 0 784 424"><rect class="nb" height="200" rx="14" width="250" x="10" y="8"></rect><text class="tb" text-anchor="middle" x="135" y="32"><tspan x="135">Past simple</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="135" y="52"><tspan x="135">đã xong, gắn với mốc quá khứ</tspan></text><line class="ln" marker-end="url(#ah)" x1="24" x2="246" y1="120" y2="120"></line><line class="ln nowl" x1="160" x2="160" y1="94" y2="132"></line><text class="tm" style="font-size:11px" text-anchor="middle" x="160" y="148"><tspan x="160">NOW</tspan></text><circle class="fa" cx="80" cy="120" r="8"></circle><text class="ta" style="font-size:12px" text-anchor="middle" x="135" y="182"><tspan x="135">I met him in 2019.</tspan></text><rect class="nb" height="200" rx="14" width="250" x="268" y="8"></rect><text class="tb" text-anchor="middle" x="393" y="32"><tspan x="393">Past continuous</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="393" y="52"><tspan x="393">đang diễn ra tại mốc quá khứ</tspan></text><line class="ln" marker-end="url(#ah)" x1="282" x2="504" y1="120" y2="120"></line><line class="ln nowl" x1="418" x2="418" y1="94" y2="132"></line><text class="tm" style="font-size:11px" text-anchor="middle" x="418" y="148"><tspan x="418">NOW</tspan></text><rect class="fa" height="14" rx="7" width="60" x="313" y="113"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="393" y="182"><tspan x="393">I was working at 8 p.m.</tspan></text><rect class="nb" height="200" rx="14" width="250" x="526" y="8"></rect><text class="tb" text-anchor="middle" x="651" y="32"><tspan x="651">Present perfect</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="651" y="52"><tspan x="651">từ quá khứ → kéo tới / liên quan hiện tại</tspan></text><line class="ln" marker-end="url(#ah)" x1="540" x2="762" y1="120" y2="120"></line><line class="ln nowl" x1="696" x2="696" y1="94" y2="132"></line><text class="tm" style="font-size:11px" text-anchor="middle" x="696" y="148"><tspan x="696">NOW</tspan></text><rect class="fg" height="14" rx="7" width="130" x="566" y="113"></rect><text class="ta" style="font-size:12px" text-anchor="middle" x="651" y="182"><tspan x="651">I have lived here for 5 years.</tspan></text><rect class="nb" height="200" rx="14" width="250" x="10" y="216"></rect><text class="tb" text-anchor="middle" x="135" y="240"><tspan x="135">Present perfect continuous</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="135" y="260"><tspan x="135">nhấn mạnh quá trình, vừa dừng hoặc còn tiếp</tspan></text><line class="ln" marker-end="url(#ah)" x1="24" x2="246" y1="328" y2="328"></line><line class="ln nowl" x1="180" x2="180" y1="302" y2="340"></line><text class="tm" style="font-size:11px" text-anchor="middle" x="180" y="356"><tspan x="180">NOW</tspan></text><rect class="fg" height="14" rx="7" width="120" x="60" y="321"></rect><circle class="fo" cx="180" cy="328" r="6"></circle><text class="ta" style="font-size:12px" text-anchor="middle" x="135" y="390"><tspan x="135">I have been waiting for an hour.</tspan></text><rect class="nb" height="200" rx="14" width="250" x="268" y="216"></rect><text class="tb" text-anchor="middle" x="393" y="240"><tspan x="393">Past perfect</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="393" y="260"><tspan x="393">xảy ra TRƯỚC một mốc quá khứ khác</tspan></text><line class="ln" marker-end="url(#ah)" x1="282" x2="504" y1="328" y2="328"></line><line class="ln nowl" x1="438" x2="438" y1="302" y2="340"></line><text class="tm" style="font-size:11px" text-anchor="middle" x="438" y="356"><tspan x="438">NOW</tspan></text><circle class="fo" cx="323" cy="328" r="8"></circle><text class="tm" style="font-size:11px" text-anchor="middle" x="323" y="308"><tspan x="323">A (trước)</tspan></text><circle class="fa" cx="383" cy="328" r="8"></circle><text class="tm" style="font-size:11px" text-anchor="middle" x="383" y="308"><tspan x="383">B (mốc)</tspan></text><text class="ta" style="font-size:12px" text-anchor="middle" x="393" y="390"><tspan x="393">When I arrived, he had left.</tspan></text><rect class="nb" height="200" rx="14" width="250" x="526" y="216"></rect><text class="tb" text-anchor="middle" x="651" y="240"><tspan x="651">Future perfect</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="651" y="260"><tspan x="651">sẽ xong TRƯỚC một mốc tương lai</tspan></text><line class="ln" marker-end="url(#ah)" x1="540" x2="762" y1="328" y2="328"></line><line class="ln nowl" x1="581" x2="581" y1="302" y2="340"></line><text class="tm" style="font-size:11px" text-anchor="middle" x="581" y="356"><tspan x="581">NOW</tspan></text><circle class="fo" cx="641" cy="328" r="8"></circle><text class="tm" style="font-size:11px" text-anchor="middle" x="641" y="308"><tspan x="641">xong</tspan></text><circle class="fa" cx="711" cy="328" r="8"></circle><text class="tm" style="font-size:11px" text-anchor="middle" x="711" y="308"><tspan x="711">mốc</tspan></text><text class="ta" style="font-size:12px" text-anchor="middle" x="651" y="390"><tspan x="651">By May I will have finished.</tspan></text></svg>