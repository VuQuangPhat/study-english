<svg aria-label="Chuyển câu chủ động sang bị động" role="img" style="min-width:680px" viewbox="0 0 760 292"><text class="tm" style="font-size:12px" text-anchor="middle" x="380" y="18"><tspan x="380">CHỦ ĐỘNG</tspan></text><rect class="fa" height="50" rx="10" width="180" x="40" y="30"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="130" y="55"><tspan dy="-0.62em" x="130">Chủ ngữ</tspan><tspan dy="1.25em" x="130">The manager</tspan></text><rect class="fo" height="50" rx="10" width="180" x="250" y="30"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="340" y="55"><tspan dy="-0.62em" x="340">Động từ</tspan><tspan dy="1.25em" x="340">signed</tspan></text><rect class="fg" height="50" rx="10" width="220" x="460" y="30"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="570" y="55"><tspan dy="-0.62em" x="570">Tân ngữ</tspan><tspan dy="1.25em" x="570">the contract</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="380" y="150"><tspan x="380">BỊ ĐỘNG</tspan></text><rect class="fg" height="60" rx="10" width="200" x="40" y="160"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="140" y="190"><tspan dy="-0.62em" x="140">Tân ngữ thành chủ ngữ</tspan><tspan dy="1.25em" x="140">The contract</tspan></text><rect class="fo" height="60" rx="10" width="200" x="260" y="160"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="360" y="190"><tspan dy="-0.62em" x="360">be + V3</tspan><tspan dy="1.25em" x="360">was signed</tspan></text><rect class="fa" height="60" rx="10" width="230" x="480" y="160"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="595" y="190"><tspan dy="-0.62em" x="595">by + chủ ngữ cũ</tspan><tspan dy="1.25em" x="595">(by the manager)</tspan></text><polyline class="ln" fill="none" marker-end="url(#ah)" points="550,82 550,120 150,120 150,158"></polyline><polyline class="ln" fill="none" marker-end="url(#ah)" points="130,82 130,100 600,100 600,158"></polyline><text class="ta" style="font-size:12px" text-anchor="middle" x="380" y="252"><tspan x="380">be chia theo THÌ của câu chủ động:  signs → is signed   |   signed → was signed   |   will sign → will be signed</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="380" y="276"><tspan x="380">Bỏ “by …” khi không biết / không quan trọng ai làm:  The contract was signed yesterday.</tspan></text></svg>