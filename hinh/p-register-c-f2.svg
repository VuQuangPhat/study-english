<svg aria-label="Bậc thang mức độ trang trọng" role="img" style="min-width:680px" viewbox="0 0 780 376"><rect class="nr" height="70" rx="10" width="300" x="4" y="8"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="154" y="43"><tspan dy="-0.62em" x="154">Rất trang trọng</tspan><tspan dy="1.25em" x="154">hợp đồng, văn bản pháp lý, thư chính thức</tspan></text><text class="ta" style="font-size:13px" text-anchor="start" x="316" y="44"><tspan x="316">I should be grateful if you would confirm…</tspan></text><rect class="no" height="70" rx="10" width="300" x="58" y="92"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="208" y="127"><tspan dy="-0.62em" x="208">Trang trọng</tspan><tspan dy="1.25em" x="208">email khách hàng, đối tác, cấp trên</tspan></text><text class="ta" style="font-size:13px" text-anchor="start" x="370" y="128"><tspan x="370">Could you please confirm by Friday?</tspan></text><rect class="ng" height="70" rx="10" width="300" x="112" y="176"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="262" y="211"><tspan dy="-0.62em" x="262">Trung tính</tspan><tspan dy="1.25em" x="262">đồng nghiệp, họp thường ngày</tspan></text><text class="ta" style="font-size:13px" text-anchor="start" x="424" y="212"><tspan x="424">Can you confirm by Friday?</tspan></text><rect class="na" height="70" rx="10" width="300" x="166" y="260"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="316" y="295"><tspan dy="-0.62em" x="316">Thân mật</tspan><tspan dy="1.25em" x="316">bạn bè, chat nhanh</tspan></text><text class="ta" style="font-size:13px" text-anchor="start" x="478" y="296"><tspan x="478">Let me know by Friday, ok?</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="358"><tspan x="390">Càng LÊN trên: câu dài hơn, từ gốc Latin / Pháp, thể bị động, ít rút gọn, ít cụm động từ.</tspan></text></svg>