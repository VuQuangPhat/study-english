<svg aria-label="Hai thang đo của động từ khuyết thiếu" role="img" style="min-width:680px" viewbox="0 0 760 384"><text class="tb" text-anchor="middle" x="380" y="22"><tspan x="380">Mức độ CHẮC CHẮN khi suy đoán</tspan></text><defs><lineargradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="var(--red)"></stop><stop offset=".5" stop-color="var(--orange)"></stop><stop offset="1" stop-color="var(--green)"></stop></lineargradient></defs><rect fill="url(#gs)" height="16" rx="8" width="700" x="30" y="40"></rect><line class="ln" x1="30" x2="30" y1="60" y2="74"></line><text class="tb" style="font-size:12px" text-anchor="start" x="30" y="92"><tspan dy="-0.62em" x="30">0%</tspan><tspan dy="1.25em" x="30">can't be</tspan></text><text class="tm" style="font-size:11px" text-anchor="start" x="30" y="128"><tspan x="30">Chắc chắn KHÔNG</tspan></text><line class="ln" x1="215" x2="215" y1="60" y2="74"></line><text class="tb" style="font-size:12px" text-anchor="middle" x="215" y="92"><tspan dy="-0.62em" x="215">25%</tspan><tspan dy="1.25em" x="215">may not</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="215" y="128"><tspan x="215">Có lẽ không</tspan></text><line class="ln" x1="380" x2="380" y1="60" y2="74"></line><text class="tb" style="font-size:12px" text-anchor="middle" x="380" y="92"><tspan dy="-0.62em" x="380">50%</tspan><tspan dy="1.25em" x="380">may / might / could</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="380" y="128"><tspan x="380">Có thể</tspan></text><line class="ln" x1="560" x2="560" y1="60" y2="74"></line><text class="tb" style="font-size:12px" text-anchor="middle" x="560" y="92"><tspan dy="-0.62em" x="560">80%</tspan><tspan dy="1.25em" x="560">should / ought to</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="560" y="128"><tspan x="560">Nhiều khả năng</tspan></text><line class="ln" x1="730" x2="730" y1="60" y2="74"></line><text class="tb" style="font-size:12px" text-anchor="end" x="730" y="92"><tspan dy="-0.62em" x="730">100%</tspan><tspan dy="1.25em" x="730">must be</tspan></text><text class="tm" style="font-size:11px" text-anchor="end" x="730" y="128"><tspan x="730">Chắc chắn CÓ</tspan></text><text class="ta" style="font-size:12px" text-anchor="middle" x="380" y="170"><tspan x="380">Quá khứ: must/may/might/can't + HAVE + V3   →   He must have left. / She can't have known.</tspan></text><text class="tb" text-anchor="middle" x="380" y="214"><tspan x="380">Bắt buộc / cho phép / cấm</tspan></text><rect class="nr" height="64" rx="10" width="128" x="30" y="232"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="94" y="264"><tspan dy="-0.62em" x="94">must</tspan><tspan dy="1.25em" x="94">have to</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="94" y="322"><tspan x="94">BẮT BUỘC</tspan></text><rect class="no" height="64" rx="10" width="128" x="173" y="232"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="237" y="264"><tspan dy="-0.62em" x="237">should</tspan><tspan dy="1.25em" x="237">ought to</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="237" y="322"><tspan x="237">NÊN</tspan></text><rect class="ng" height="64" rx="10" width="128" x="316" y="232"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="380" y="264"><tspan dy="-0.62em" x="380">can</tspan><tspan dy="1.25em" x="380">may</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="380" y="322"><tspan x="380">ĐƯỢC PHÉP</tspan></text><rect class="na" height="64" rx="10" width="128" x="459" y="232"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="523" y="264"><tspan dy="-0.62em" x="523">needn't</tspan><tspan dy="1.25em" x="523">don't have to</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="523" y="322"><tspan dy="-0.62em" x="523">KHÔNG CẦN</tspan><tspan dy="1.25em" x="523">(tuỳ bạn)</tspan></text><rect class="nr" height="64" rx="10" width="128" x="602" y="232"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="666" y="264"><tspan dy="-0.62em" x="666">mustn't</tspan><tspan dy="1.25em" x="666">can't</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="666" y="322"><tspan x="666">CẤM</tspan></text><text class="tr" style="font-size:13px" text-anchor="middle" x="380" y="364"><tspan x="380">⚠ mustn't = CẤM    ≠    don't have to = KHÔNG BẮT BUỘC</tspan></text></svg>