<svg aria-label="Phân tích một câu hợp đồng dài" role="img" style="min-width:680px" viewbox="0 0 780 270"><text class="tm" style="font-size:11.5px" text-anchor="middle" x="390" y="18"><tspan dy="-0.62em" x="390">“The Seller shall indemnify the Buyer against any loss arising from a breach of this Agreement,</tspan><tspan dy="1.25em" x="390">provided that notice is given within 30 days.”</tspan></text><rect class="fa" height="56" rx="10" width="130" x="10" y="50"></rect><text class="tw" style="font-size:12px" text-anchor="middle" x="75" y="78"><tspan x="75">The Seller</tspan></text><text class="tm" style="font-size:10.5px" text-anchor="middle" x="75" y="126"><tspan x="75">Chủ ngữ (ai)</tspan></text><rect class="fo" height="56" rx="10" width="150" x="150" y="50"></rect><text class="tw" style="font-size:12px" text-anchor="middle" x="225" y="78"><tspan x="225">shall indemnify</tspan></text><text class="tm" style="font-size:10.5px" text-anchor="middle" x="225" y="126"><tspan x="225">Động từ + nghĩa vụ</tspan></text><rect class="fg" height="56" rx="10" width="100" x="310" y="50"></rect><text class="tw" style="font-size:12px" text-anchor="middle" x="360" y="78"><tspan x="360">the Buyer</tspan></text><text class="tm" style="font-size:10.5px" text-anchor="middle" x="360" y="126"><tspan x="360">Tân ngữ (cho ai)</tspan></text><rect class="na" height="56" rx="10" width="160" x="420" y="50"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="500" y="78"><tspan x="500">against any loss</tspan></text><text class="tm" style="font-size:10.5px" text-anchor="middle" x="500" y="126"><tspan x="500">Phạm vi bồi thường</tspan></text><rect class="nb" height="56" rx="10" width="180" x="590" y="50"></rect><text class="tb" style="font-size:12px" text-anchor="middle" x="680" y="78"><tspan dy="-0.62em" x="680">arising from a breach</tspan><tspan dy="1.25em" x="680">of this Agreement</tspan></text><text class="tm" style="font-size:10.5px" text-anchor="middle" x="680" y="126"><tspan x="680">Nguyên nhân (V-ing rút gọn)</tspan></text><rect class="nr" height="48" rx="10" width="760" x="10" y="160"></rect><text class="tb" style="font-size:12.5px" text-anchor="middle" x="390" y="184"><tspan x="390">provided that notice is given within 30 days  =  ĐIỀU KIỆN (chỉ bồi thường nếu thông báo trong 30 ngày)</tspan></text><text class="ta" style="font-size:12px" text-anchor="middle" x="390" y="236"><tspan dy="-0.62em" x="390">Cách đọc: 1) tìm Chủ ngữ + Động từ chính  2) gạch phần bổ sung (against…, arising from…)</tspan><tspan dy="1.25em" x="390">3) tìm điều kiện (provided that / subject to / unless)</tspan></text></svg>