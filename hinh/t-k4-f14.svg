<svg aria-label="Bản đồ từ nối theo quan hệ ý" role="img" style="min-width:680px" viewbox="0 0 780 340"><line class="ln" marker-end="url(#ah)" x1="320" x2="110" y1="130" y2="104"></line><line class="ln" marker-end="url(#ah)" x1="390" x2="390" y1="130" y2="104"></line><line class="ln" marker-end="url(#ah)" x1="460" x2="670" y1="130" y2="104"></line><line class="ln" marker-end="url(#ah)" x1="320" x2="110" y1="188" y2="230"></line><line class="ln" marker-end="url(#ah)" x1="390" x2="390" y1="188" y2="230"></line><line class="ln" marker-end="url(#ah)" x1="460" x2="670" y1="188" y2="230"></line><rect class="fa" height="50" rx="10" width="180" x="300" y="134"></rect><text class="tw" style="font-size:14px" text-anchor="middle" x="390" y="159"><tspan x="390">Quan hệ giữa hai ý</tspan></text><rect class="na" height="96" rx="10" width="200" x="10" y="6"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="110" y="54"><tspan dy="-1.24em" x="110">THÊM</tspan><tspan dy="1.25em" x="110">and, also, moreover,</tspan><tspan dy="1.25em" x="110">in addition, furthermore</tspan></text><rect class="nr" height="96" rx="10" width="200" x="290" y="6"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="390" y="54"><tspan dy="-1.24em" x="390">TƯƠNG PHẢN</tspan><tspan dy="1.25em" x="390">but, however, although,</tspan><tspan dy="1.25em" x="390">whereas, despite</tspan></text><rect class="no" height="96" rx="10" width="200" x="570" y="6"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="670" y="54"><tspan dy="-1.24em" x="670">NGUYÊN NHÂN</tspan><tspan dy="1.25em" x="670">because, since, as,</tspan><tspan dy="1.25em" x="670">due to, owing to</tspan></text><rect class="ng" height="96" rx="10" width="200" x="10" y="232"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="110" y="280"><tspan dy="-1.24em" x="110">KẾT QUẢ</tspan><tspan dy="1.25em" x="110">so, therefore, thus,</tspan><tspan dy="1.25em" x="110">consequently, a