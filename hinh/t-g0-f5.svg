<svg aria-label="Chọn đại từ quan hệ" role="img" style="min-width:680px" viewbox="0 0 780 356"><rect class="fa" height="40" rx="10" width="260" x="260" y="4"></rect><text class="tw" style="font-size:14px" text-anchor="middle" x="390" y="24"><tspan x="390">Danh từ đứng trước là…?</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="124" y1="44" y2="70"></line><rect class="na" height="40" rx="10" width="246" x="4" y="70"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="127" y="90"><tspan x="127">NGƯỜI</tspan></text><rect class="nb" height="46" rx="10" width="246" x="4" y="112"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="127" y="135"><tspan dy="-0.62em" x="127">who / whom / that</tspan><tspan dy="1.25em" x="127">the lawyer who won</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="382" y1="44" y2="70"></line><rect class="ng" height="40" rx="10" width="246" x="262" y="70"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="385" y="90"><tspan x="385">VẬT</tspan></text><rect class="nb" height="46" rx="10" width="246" x="262" y="112"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="385" y="135"><tspan dy="-0.62em" x="385">which / that</tspan><tspan dy="1.25em" x="385">the case which failed</tspan></text><line class="ln" marker-end="url(#ah)" x1="390" x2="640" y1="44" y2="70"></line><rect class="no" height="40" rx="10" width="246" x="520" y="70"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="643" y="90"><tspan x="643">SỞ HỮU</tspan></text><rect class="nb" height="46" rx="10" width="246" x="520" y="112"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="643" y="135"><tspan dy="-0.62em" x="643">whose + N</tspan><tspan dy="1.25em" x="643">the client whose case…</tspan></text><rect class="nr" height="40" rx="10" width="246" x="4" y="170"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="127" y="190"><tspan x="127">NƠI</tspan></text><rect class="nb" height="46" rx="10" width="246" x="4" y="212"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="127" y="235"><tspan dy="-0.62em" x="127">where</tspan><tspan dy="1.25em" x="127">the court where I work</tspan></text><rect class="na" height="40" rx="10" width="246" x="262" y="170"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="385" y="190"><tspan x="385">THỜI GIAN</tspan></text><rect class="nb" height="46" rx="10" width="246" x="262" y="212"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="385" y="235"><tspan dy="-0.62em" x="385">when</tspan><tspan dy="1.25em" x="385">the day when we met</tspan></text><rect class="ng" height="40" rx="10" width="246" x="520" y="170"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="643" y="190"><tspan x="643">LÝ DO</tspan></text><rect class="nb" height="46" rx="10" width="246" x="520" y="212"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="643" y="235"><tspan dy="-0.62em" x="643">why</tspan><tspan dy="1.25em" x="643">the reason why he left</tspan></text><rect class="nb" height="64" rx="10" width="376" x="4" y="280"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="192" y="312"><tspan dy="-1.24em" x="192">XÁC ĐỊNH (không phẩy)</tspan><tspan dy="1.25em" x="192">Thông tin cần thiết; dùng that được; bỏ được đại từ</tspan><tspan dy="1.25em" x="192">làm tân ngữ.</tspan></text><rect class="nb" height="64" rx="10" width="376" x="394" y="280"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="582" y="312"><tspan dy="-0.62em" x="582">KHÔNG XÁC ĐỊNH (có phẩy)</tspan><tspan dy="1.25em" x="582">Thông tin thêm; KHÔNG dùng that; không bỏ đại từ.</tspan></text></svg>