<svg aria-label="Bậc thang lùi thì trong câu tường thuật" role="img" style="min-width:680px" viewbox="0 0 780 426"><rect class="fa" height="30" rx="10" width="320" x="40" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="200" y="19"><tspan x="200">Lời nói TRỰC TIẾP</tspan></text><rect class="fa" height="30" rx="10" width="320" x="420" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="580" y="19"><tspan x="580">Lời nói GIÁN TIẾP (lùi một bậc)</tspan></text><rect class="nb" height="36" rx="10" width="320" x="40" y="44"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="200" y="62"><tspan x="200">am / is / are + V-ing  (hiện tại tiếp diễn)</tspan></text><line class="ln" marker-end="url(#ah)" x1="364" x2="416" y1="62" y2="62"></line><rect class="ng" height="36" rx="10" width="320" x="420" y="44"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="580" y="62"><tspan x="580">was / were + V-ing</tspan></text><rect class="nb" height="36" rx="10" width="320" x="40" y="88"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="200" y="106"><tspan x="200">V / Vs  (hiện tại đơn)</tspan></text><line class="ln" marker-end="url(#ah)" x1="364" x2="416" y1="106" y2="106"></line><rect class="ng" height="36" rx="10" width="320" x="420" y="88"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="580" y="106"><tspan x="580">V2  (quá khứ đơn)</tspan></text><rect class="nb" height="36" rx="10" width="320" x="40" y="132"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="200" y="150"><tspan x="200">have / has + V3  (hiện tại hoàn thành)</tspan></text><line class="ln" marker-end="url(#ah)" x1="364" x2="416" y1="150" y2="150"></line><rect class="ng" height="36" rx="10" width="320" x="420" y="132"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="580" y="150"><tspan x="580">had + V3</tspan></text><rect class="nb" height="36" rx