<svg aria-label="Phễu in, on, at cho thời gian và nơi chốn" role="img" style="min-width:680px" viewbox="0 0 780 262"><text class="tb" style="font-size:14px" text-anchor="middle" x="100" y="18"><tspan x="100">THỜI GIAN (rộng → hẹp)</tspan></text><polygon class="na" points="10,34 190,34 171.66666666666669,100 28.33333333333333,100"></polygon><text class="tb" style="font-size:18px" text-anchor="middle" x="100" y="67"><tspan x="100">IN</tspan></text><text class="tm" style="font-size:12px" text-anchor="start" x="210" y="67"><tspan dy="-1.24em" x="210">thế kỷ, năm, tháng,</tspan><tspan dy="1.25em" x="210">mùa, buổi</tspan><tspan dy="1.25em" x="210">in 2025, in May, in the morning</tspan></text><polygon class="no" points="28.33333333333333,104 171.66666666666669,104 153.33333333333334,170 46.666666666666664,170"></polygon><text class="tb" style="font-size:18px" text-anchor="middle" x="100" y="137"><tspan x="100">ON</tspan></text><text class="tm" style="font-size:12px" text-anchor="start" x="210" y="137"><tspan dy="-0.62em" x="210">thứ, ngày cụ thể</tspan><tspan dy="1.25em" x="210">on Monday, on 5 May</tspan></text><polygon class="nr" points="46.666666666666664,174 153.33333333333334,174 135,240 65,240"></polygon><text class="tb" style="font-size:18px" text-anchor="middle" x="100" y="207"><tspan x="100">AT</tspan></text><text class="tm" style="font-size:12px" text-anchor="start" x="210" y="207"><tspan dy="-0.62em" x="210">giờ, mốc chính xác</tspan><tspan dy="1.25em" x="210">at 7 p.m., at noon, at night</tspan></text><text class="tb" style="font-size:14px" text-anchor="middle" x="490" y="18"><tspan x="490">NƠI CHỐN (rộng → hẹp)</tspan></text><polygon class="na" points="400,34 580,34 561.6666666666666,100 418.3333333333333,100"></polygon><text class="tb" style="font-size:18px" text-anchor="middle" x="490" y="67"><tspan x="490">IN</tspan></text><text class="tm" style="font-size:12px" text-anchor="start" x="600" y="67"><tspan dy="-1.24em" x="600">không gian bao quanh</tspan><tspan dy="1.25em" x="600">in Vietnam, in the room,</tspan><tspan dy="1.25em" x="600">in a car</tspan></text><polygon class="no" points="418.3333333333333,104 561.6666666666666,104 543.3333333333334,170 436.6666666666667,170"></polygon><text class="tb" style="font-size:18px" text-anchor="middle" x="490" y="137"><tspan x="490">ON</tspan></text><text class="tm" style="font-size:12px" text-anchor="start" x="600" y="137"><tspan dy="-1.24em" x="600">bề mặt, đường, tầng</tspan><tspan dy="1.25em" x="600">on the table, on Le Loi St.,</tspan><tspan dy="1.25em" x="600">on the 3rd floor</tspan></text><polygon class="nr" points="436.6666666666667,174 543.3333333333334,174 525,240 455,240"></polygon><text class="tb" style="font-size:18px" text-anchor="middle" x="490" y="207"><tspan x="490">AT</tspan></text><text class="tm" style="font-size:12px" text-anchor="start" x="600" y="207"><tspan dy="-1.24em" x="600">điểm cụ thể</tspan><tspan dy="1.25em" x="600">at the door, at 12 Le Loi,</tspan><tspan dy="1.25em" x="600">at the airport</tspan></text></svg>