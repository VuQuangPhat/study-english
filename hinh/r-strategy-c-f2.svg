<svg aria-label="Bốn cách đọc theo mục đích" role="img" style="min-width:680px" viewbox="0 0 780 296"><rect class="fa" height="44" rx="10" width="184" x="6" y="6"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="98" y="28"><tspan dy="-0.62em" x="98">SKIMMING</tspan><tspan dy="1.25em" x="98">Đọc lướt</tspan></text><rect class="na" height="168" rx="10" width="184" x="6" y="56"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="98" y="140"><tspan dy="-3.72em" x="98">Mục đích: nắm ý chính</tspan><tspan dy="1.25em" x="98">Đọc: tiêu đề, câu đầu mỗi</tspan><tspan dy="1.25em" x="98">đoạn,</tspan><tspan dy="1.25em" x="98">kết luận</tspan><tspan dy="1.25em" x="98">Tốc độ: rất nhanh</tspan><tspan dy="1.25em" x="98">Dùng cho: email, báo cáo,</tspan><tspan dy="1.25em" x="98">tin</tspan></text><rect class="nb" height="44" rx="10" width="184" x="200" y="6"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="292" y="28"><tspan dy="-0.62em" x="292">SCANNING</tspan><tspan dy="1.25em" x="292">Quét tìm</tspan></text><rect class="ng" height="168" rx="10" width="184" x="200" y="56"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="292" y="140"><tspan dy="-4.34em" x="292">Mục đích: tìm thông tin cụ</tspan><tspan dy="1.25em" x="292">thể</tspan><tspan dy="1.25em" x="292">Tìm: tên, số, ngày, từ</tspan><tspan dy="1.25em" x="292">khoá</tspan><tspan dy="1.25em" x="292">Tốc độ: nhanh, mắt quét</tspan><tspan dy="1.25em" x="292">Dùng cho: hợp đồng (tìm</tspan><tspan dy="1.25em" x="292">điều khoản),</tspan><tspan dy="1.25em" x="292">lịch, bảng</tspan></text><rect class="nb" height="44" rx="10" width="184" x="394" y="6"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="486" y="28"><tspan dy="-0.62em" x="486">INTENSIVE</tspan><tspan dy="1.25em" x="486">Đọc kỹ</tspan></text><rect class="no" height="168" rx="10" width="184" x="394" y="56"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="486" y="140"><tspan dy="-3.72em" x="486">Mục đích: hiểu chính xác</tspan><tspan dy="1.25em" x="486">Đọc: từng câu, phân tích</tspan><tspan dy="1.25em" x="486">cấu trúc</tspan><tspan dy="1.25em" x="486">Tốc độ: chậm</tspan><tspan dy="1.25em" x="486">Dùng cho: điều khoản, định</tspan><tspan dy="1.25em" x="486">nghĩa,</tspan><tspan dy="1.25em" x="486">điều kiện, số tiền</tspan></text><rect class="nb" height="44" rx="10" width="184" x="588" y="6"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="680" y="28"><tspan dy="-0.62em" x="680">EXTENSIVE</tspan><tspan dy="1.25em" x="680">Đọc rộng</tspan></text><rect class="nb" height="168" rx="10" width="184" x="588" y="56"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="680" y="140"><tspan dy="-3.10em" x="680">Mục đích: tăng vốn từ,</tspan><tspan dy="1.25em" x="680">quen văn phong</tspan><tspan dy="1.25em" x="680">Đọc: sách, bài dài</tspan><tspan dy="1.25em" x="680">Tốc độ: vừa, không tra từ</tspan><tspan dy="1.25em" x="680">liên tục</tspan><tspan dy="1.25em" x="680">Dùng cho: học dài hạn</tspan></text><rect class="nq" height="50" rx="10" width="764" x="6" y="236"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="388" y="261"><tspan x="388">Thói quen tốt: SKIM trước (nắm khung) → SCAN (tìm chỗ cần) → INTENSIVE (chỉ chỗ quan trọng).</tspan></text></svg>