<svg aria-label="Cây quyết định chọn cách nói về tương lai" role="img" style="min-width:680px" viewbox="0 0 780 460"><rect class="fa" height="40" rx="10" width="220" x="250" y="6"></rect><text class="tw" text-anchor="middle" x="360" y="26"><tspan x="360">Bạn muốn nói về TƯƠNG LAI</tspan></text><line class="ln" x1="360" x2="360" y1="46" y2="68"></line><rect class="nq" height="44" rx="10" width="420" x="150" y="70"></rect><text class="tx" text-anchor="middle" x="360" y="92"><tspan x="360">Lịch trình / thời gian biểu cố định?</tspan></text><line class="ln" marker-end="url(#ah)" x1="570" x2="610" y1="92" y2="92"></line><text class="tg" style="font-size:12px" text-anchor="middle" x="590" y="84"><tspan x="590">Có</tspan></text><rect class="ng" height="44" rx="10" width="150" x="612" y="70"></rect><text class="tb" text-anchor="middle" x="687" y="92"><tspan x="687">Present simple</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="687" y="130"><tspan x="687">The train leaves at 7.</tspan></text><line class="ln" marker-end="url(#ah)" x1="360" x2="360" y1="114" y2="158"></line><text class="tr" style="font-size:12px" text-anchor="start" x="382" y="140"><tspan x="382">Không</tspan></text><rect class="nq" height="44" rx="10" width="420" x="150" y="170"></rect><text class="tx" text-anchor="middle" x="360" y="192"><tspan x="360">Đã SẮP XẾP cụ thể (giờ, người, nơi)?</tspan></text><line class="ln" marker-end="url(#ah)" x1="570" x2="610" y1="192" y2="192"></line><text class="tg" style="font-size:12px" text-anchor="middle" x="590" y="184"><tspan x="590">Có</tspan></text><rect class="ng" height="44" rx="10" width="150" x="612" y="170"></rect><text class="tb" text-anchor="middle" x="687" y="192"><tspan x="687">Present continuous</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="687" y="230"><tspan x="687">I'm meeting Lan at 3.</tspan></text><line class="ln" marker-end="url(#ah)" x1="360" x2="360" y1="214" y2="258"></line><text class="tr" style="font-size:12px" text-anchor="start" x="382" y="240"><tspan x="382">Không</tspan></text><rect class="nq" height="44" rx="10" width="420" x="150" y="270"></rect><text class="tx" text-anchor="middle" x="360" y="292"><tspan x="360">Có KẾ HOẠCH có sẵn, hoặc DẤU HIỆU rõ ràng?</tspan></text><line class="ln" marker-end="url(#ah)" x1="570" x2="610" y1="292" y2="292"></line><text class="tg" style="font-size:12px" text-anchor="middle" x="590" y="284"><tspan x="590">Có</tspan></text><rect class="ng" height="44" rx="10" width="150" x="612" y="270"></rect><text class="tb" text-anchor="middle" x="687" y="292"><tspan x="687">be going to</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="687" y="330"><tspan x="687">Look! It's going to rain.</tspan></text><line class="ln" marker-end="url(#ah)" x1="360" x2="360" y1="314" y2="358"></line><text class="tr" style="font-size:12px" text-anchor="start" x="382" y="340"><tspan x="382">Không</tspan></text><rect class="nq" height="44" rx="10" width="420" x="150" y="370"></rect><text class="tx" text-anchor="middle" x="360" y="392"><tspan x="360">Quyết định lúc nói, lời hứa, đề nghị, dự đoán chủ quan?</tspan></text><line class="ln" marker-end="url(#ah)" x1="570" x2="610" y1="392" y2="392"></line><text class="tg" style="font-size:12px" text-anchor="middle" x="590" y="384"><tspan x="590">Có</tspan></text><rect class="ng" height="44" rx="10" width="150" x="612" y="370"></rect><text class="tb" text-anchor="middle" x="687" y="392"><tspan x="687">will</tspan></text><text class="tm" style="font-size:11px" text-anchor="middle" x="687" y="430"><tspan x="687">I'll help you.</tspan></text></svg>