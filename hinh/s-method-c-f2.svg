<svg aria-label="Khung trả lời PREP" role="img" style="min-width:680px" viewbox="0 0 780 272"><text class="tb" text-anchor="middle" x="390" y="20"><tspan x="390">Khung trả lời PREP (30–60 giây)</tspan></text><rect class="fa" height="60" rx="10" width="184" x="8" y="40"></rect><text class="tw" style="font-size:16px" text-anchor="middle" x="100" y="70"><tspan x="100">P  Point</tspan></text><rect class="nb" height="118" rx="10" width="184" x="8" y="106"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="100" y="165"><tspan dy="-1.86em" x="100">Nêu ý chính ngay</tspan><tspan dy="1.25em" x="100"></tspan><tspan dy="1.25em" x="100">“I think we should extend</tspan><tspan dy="1.25em" x="100">the deadline.”</tspan></text><line class="ln" marker-end="url(#ah)" x1="194" x2="202" y1="70" y2="70"></line><rect class="fg" height="60" rx="10" width="184" x="202" y="40"></rect><text class="tw" style="font-size:16px" text-anchor="middle" x="294" y="70"><tspan x="294">R  Reason</tspan></text><rect class="nb" height="118" rx="10" width="184" x="202" y="106"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="294" y="165"><tspan dy="-1.86em" x="294">Nêu lý do</tspan><tspan dy="1.25em" x="294"></tspan><tspan dy="1.25em" x="294">“The client needs more</tspan><tspan dy="1.25em" x="294">time to review.”</tspan></text><line class="ln" marker-end="url(#ah)" x1="388" x2="396" y1="70" y2="70"></line><rect class="fo" height="60" rx="10" width="184" x="396" y="40"></rect><text class="tw" style="font-size:16px" text-anchor="middle" x="488" y="70"><tspan x="488">E  Example</tspan></text><rect class="nb" height="118" rx="10" width="184" x="396" y="106"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="488" y="165"><tspan dy="-1.86em" x="488">Ví dụ / số liệu</tspan><tspan dy="1.25em" x="488"></tspan><tspan dy="1.25em" x="488">“Last time, a rush led to</tspan><tspan dy="1.25em" x="488">three errors.”</tspan></text><line class="ln" marker-end="url(#ah)" x1="582" x2="590" y1="70" y2="70"></line><rect class="fa" height="60" rx="10" width="184" x="590" y="40"></rect><text class="tw" style="font-size:16px" text-anchor="middle" x="682" y="70"><tspan x="682">P  Point</tspan></text><rect class="nb" height="118" rx="10" width="184" x="590" y="106"></rect><text class="tx" style="font-size:11.5px" text-anchor="middle" x="682" y="165"><tspan dy="-1.86em" x="682">Nhắc lại / đề nghị</tspan><tspan dy="1.25em" x="682"></tspan><tspan dy="1.25em" x="682">“So I suggest we extend by</tspan><tspan dy="1.25em" x="682">a week.”</tspan></text><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="254"><tspan x="390">Dùng khi: được hỏi ý kiến trong họp, trả lời phỏng vấn, giải thích với khách hàng.</tspan></text></svg>