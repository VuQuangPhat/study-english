<svg aria-label="Cấu trúc một email công việc" role="img" style="min-width:680px" viewbox="0 0 780 444"><rect class="nb" height="430" rx="14" width="360" x="4" y="4"></rect><rect class="na" height="34" rx="8" width="340" x="14" y="14"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="31"><tspan x="184">Subject: …</tspan></text><line class="ln" x1="358" x2="396" y1="31" y2="31"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="25"><tspan x="404">Subject</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="41"><tspan x="404">Cụ thể, có hành động: “Action needed: NDA review by Fri 18 Oct”</tspan></text><rect class="nb" height="30" rx="8" width="340" x="14" y="56"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="71"><tspan x="184">Dear Ms Tran,</tspan></text><line class="ln" x1="358" x2="396" y1="71" y2="71"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="65"><tspan x="404">Greeting</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="81"><tspan x="404">Dear Ms Tran, / Hi Lan,  (khớp mức trang trọng)</tspan></text><rect class="na" height="40" rx="8" width="340" x="14" y="94"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="114"><tspan x="184">I am writing to…</tspan></text><line class="ln" x1="358" x2="396" y1="114" y2="114"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="108"><tspan x="404">Mục đích</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="124"><tspan x="404">Câu đầu nói ngay lý do viết: “I am writing to confirm…”</tspan></text><rect class="nb" height="70" rx="8" width="340" x="14" y="142"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="177"><tspan x="184">…đoạn nội dung…</tspan></text><line class="ln" x1="358" x2="396" y1="177" y2="177"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="171"><tspan x="404">Nội dung</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="187"><tspan x="404">1 đoạn = 1 ý. Dùng gạch đầu dòng cho danh sách.</tspan></text><rect class="na" height="40" rx="8" width="340" x="14" y="220"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="240"><tspan x="184">Could you … by Friday?</tspan></text><line class="ln" x1="358" x2="396" y1="240" y2="240"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="234"><tspan x="404">Hành động</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="250"><tspan x="404">Ai làm gì, trước khi nào: “Could you send… by Friday?”</tspan></text><rect class="nb" height="50" rx="8" width="340" x="14" y="268"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="293"><tspan x="184">Please let me know…</tspan></text><line class="ln" x1="358" x2="396" y1="293" y2="293"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="287"><tspan x="404">Kết thư</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="303"><tspan x="404">Thiện chí + bước tiếp: “Please let me know if you have questions.”</tspan></text><rect class="nb" height="30" rx="8" width="340" x="14" y="326"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="341"><tspan x="184">Kind regards,</tspan></text><line class="ln" x1="358" x2="396" y1="341" y2="341"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="335"><tspan x="404">Sign-off</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="351"><tspan x="404">Best regards, / Kind regards, / Sincerely,</tspan></text><rect class="nb" height="40" rx="8" width="340" x="14" y="364"></rect><text class="tx" style="font-size:12px" text-anchor="middle" x="184" y="384"><tspan x="184">Phat | Legal Counsel</tspan></text><line class="ln" x1="358" x2="396" y1="384" y2="384"></line><text class="tb" style="font-size:12px" text-anchor="start" x="404" y="378"><tspan x="404">Chữ ký</tspan></text><text class="tm" style="font-size:10px" text-anchor="start" x="404" y="394"><tspan x="404">Tên, chức danh, công ty, liên hệ</tspan></text></svg>