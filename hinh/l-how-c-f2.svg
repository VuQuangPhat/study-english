<svg aria-label="Hai luồng xử lý khi nghe hiểu" role="img" style="min-width:680px" viewbox="0 0 780 436"><text class="tb" text-anchor="middle" x="390" y="20"><tspan x="390">Nghe hiểu = hai luồng gặp nhau</tspan></text><rect class="fa" height="36" rx="10" width="360" x="10" y="40"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="190" y="58"><tspan x="190">TỪ DƯỚI LÊN (bottom-up): tai nghe gì?</tspan></text><rect class="fg" height="36" rx="10" width="360" x="410" y="40"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="590" y="58"><tspan x="590">TỪ TRÊN XUỐNG (top-down): đầu óc đoán gì?</tspan></text><rect class="na" height="48" rx="10" width="360" x="10" y="92"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="190" y="116"><tspan x="190">Âm thanh</tspan></text><rect class="ng" height="48" rx="10" width="360" x="410" y="92"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="590" y="116"><tspan x="590">Chủ đề, người nói, mục đích</tspan></text><line class="ln" marker-end="url(#ah)" x1="190" x2="190" y1="140" y2="156"></line><line class="ln" marker-end="url(#ah)" x1="590" x2="590" y1="140" y2="156"></line><rect class="na" height="48" rx="10" width="360" x="10" y="156"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="190" y="180"><tspan x="190">Âm tiết, trọng âm</tspan></text><rect class="ng" height="48" rx="10" width="360" x="410" y="156"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="590" y="180"><tspan x="590">Kiến thức nền của bạn</tspan></text><line class="ln" marker-end="url(#ah)" x1="190" x2="190" y1="204" y2="220"></line><line class="ln" marker-end="url(#ah)" x1="590" x2="590" y1="204" y2="220"></line><rect class="na" height="48" rx="10" width="360" x="10" y="220"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="190" y="244"><tspan x="190">Từ</tspan></text><rect class="ng" height="48" rx="10" width="360" x="410" y="220"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="590" y="244"><tspan x="590">Dự đoán điều sắp nghe</tspan></text><line class="ln" marker-end="url(#ah)" x1="190" x2="190" y1="268" y2="284"></line><line class="ln" marker-end="url(#ah)" x1="590" x2="590" y1="268" y2="284"></line><rect class="na" height="48" rx="10" width="360" x="10" y="284"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="190" y="308"><tspan x="190">Cụm / câu</tspan></text><rect class="ng" height="48" rx="10" width="360" x="410" y="284"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="590" y="308"><tspan x="590">Kiểm tra: có hợp lý không?</tspan></text><rect class="fo" height="44" rx="10" width="280" x="250" y="350"></rect><text class="tw" style="font-size:15px" text-anchor="middle" x="390" y="372"><tspan x="390">HIỂU NGHĨA</tspan></text><polyline class="ln" fill="none" marker-end="url(#ah)" points="190,340 190,372 248,372"></polyline><polyline class="ln" fill="none" marker-end="url(#ah)" points="590,340 590,372 532,372"></polyline><text class="tm" style="font-size:12px" text-anchor="middle" x="390" y="420"><tspan x="390">Nghe kém: chỉ dùng luồng trái, bị lạc khi nói nhanh. Nghe tốt: dùng cả hai, nên LUÔN biết chủ đề trước khi nghe.</tspan></text></svg>