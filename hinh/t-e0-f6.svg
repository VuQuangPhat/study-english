<svg aria-label="Phổ câu điều kiện từ loại 0 đến hỗn hợp" role="img" style="min-width:680px" viewbox="0 0 780 394"><rect class="fa" height="30" rx="10" width="230" x="110" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="225" y="19"><tspan x="225">Mệnh đề IF</tspan></text><rect class="fa" height="30" rx="10" width="150" x="370" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="445" y="19"><tspan x="445">Mệnh đề chính</tspan></text><rect class="fa" height="30" rx="10" width="230" x="540" y="4"></rect><text class="tw" style="font-size:13px" text-anchor="middle" x="655" y="19"><tspan x="655">Nghĩa</tspan></text><rect class="nb" height="62" rx="10" width="98" x="4" y="44"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="53" y="75"><tspan x="53">Loại 0</tspan></text><rect class="nb" height="62" rx="10" width="230" x="110" y="44"></rect><text class="tx" style="font-size:13px" text-anchor="middle" x="225" y="75"><tspan x="225">If + hiện tại đơn</tspan></text><line class="ln" marker-end="url(#ah)" x1="342" x2="368" y1="75" y2="75"></line><rect class="nb" height="62" rx="10" width="150" x="370" y="44"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="445" y="75"><tspan x="445">hiện tại đơn</tspan></text><rect class="nb" height="62" rx="10" width="230" x="540" y="44"></rect><text class="tx" style="font-size:11px" text-anchor="middle" x="655" y="75"><tspan dy="-0.62em" x="655">Sự thật, quy luật</tspan><tspan dy="1.25em" x="655">If you heat ice, it melts.</tspan></text><rect class="ng" height="62" rx="10" width="98" x="4" y="114"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="53" y="145"><tspan x="53">Loại 1</tspan></text><rect class="nb" height="62" rx="10" width="230" x="110" y="114"></rect><text class="tx" style="font-size:13px" text-anchor="middle" x="225" y="145"><tspan x="225">If + hiện tại đơn</tspan></text><line class="ln" marker-end="url(#ah)" x1="342" x2="368" y1="145" y2="145"></line><rect class="nb" height="62" rx="10" width="150" x="370" y="114"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="445" y="145"><tspan x="445">will + V</tspan></text><rect class="nb" height="62" rx="10" width="230" x="540" y="114"></rect><text class="tx" style="font-size:11px" text-anchor="middle" x="655" y="145"><tspan dy="-0.62em" x="655">Khả năng THẬT ở tương lai</tspan><tspan dy="1.25em" x="655">If it rains, I will stay home.</tspan></text><rect class="na" height="62" rx="10" width="98" x="4" y="184"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="53" y="215"><tspan x="53">Loại 2</tspan></text><rect class="nb" height="62" rx="10" width="230" x="110" y="184"></rect><text class="tx" style="font-size:13px" text-anchor="middle" x="225" y="215"><tspan x="225">If + quá khứ đơn</tspan></text><line class="ln" marker-end="url(#ah)" x1="342" x2="368" y1="215" y2="215"></line><rect class="nb" height="62" rx="10" width="150" x="370" y="184"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="445" y="215"><tspan x="445">would + V</tspan></text><rect class="nb" height="62" rx="10" width="230" x="540" y="184"></rect><text class="tx" style="font-size:11px" text-anchor="middle" x="655" y="215"><tspan dy="-0.62em" x="655">Không có thật ở HIỆN TẠI</tspan><tspan dy="1.25em" x="655">If I were rich, I would travel.</tspan></text><rect class="no" height="62" rx="10" width="98" x="4" y="254"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="53" y="285"><tspan x="53">Loại 3</tspan></text><rect class="nb" height="62" rx="10" width="230" x="110" y="254"></rect><text class="tx" style="font-size:13px" text-anchor="middle" x="225" y="285"><tspan x="225">If + quá khứ hoàn thành</tspan></text><line class="ln" marker-end="url(#ah)" x1="342" x2="368" y1="285" y2="285"></line><rect class="nb" height="62" rx="10" width="150" x="370" y="254"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="445" y="285"><tspan x="445">would have + V3</tspan></text><rect class="nb" height="62" rx="10" width="230" x="540" y="254"></rect><text class="tx" style="font-size:11px" text-anchor="middle" x="655" y="285"><tspan dy="-1.24em" x="655">Không thể thay đổi (QUÁ KHỨ)</tspan><tspan dy="1.25em" x="655">If I had left earlier, I would have</tspan><tspan dy="1.25em" x="655">caught it.</tspan></text><rect class="nr" height="62" rx="10" width="98" x="4" y="324"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="53" y="355"><tspan x="53">Hỗn hợp</tspan></text><rect class="nb" height="62" rx="10" width="230" x="110" y="324"></rect><text class="tx" style="font-size:13px" text-anchor="middle" x="225" y="355"><tspan x="225">If + quá khứ hoàn thành</tspan></text><line class="ln" marker-end="url(#ah)" x1="342" x2="368" y1="355" y2="355"></line><rect class="nb" height="62" rx="10" width="150" x="370" y="324"></rect><text class="tb" style="font-size:13px" text-anchor="middle" x="445" y="355"><tspan x="445">would + V</tspan></text><rect class="nb" height="62" rx="10" width="230" x="540" y="324"></rect><text class="tx" style="font-size:11px" text-anchor="middle" x="655" y="355"><tspan dy="-1.24em" x="655">Quá khứ → ảnh hưởng HIỆN TẠI</tspan><tspan dy="1.25em" x="655">If I had studied law, I would be a</tspan><tspan dy="1.25em" x="655">judge now.</tspan></text></svg>