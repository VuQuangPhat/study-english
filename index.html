 the door.</div></td></tr><tr><td><div>Câu mệnh lệnh phủ định</div></td><td><div>told/asked + O + not to V-inf</div></td><td><div>\"Don't be late,\" → She told us not to be late.</div></td></tr><tr><td><div>Lời đề nghị/gợi ý (Let's...)</div></td><td><div>suggested + V-ing / suggested (that) + S + (should) + V</div></td><td><div>\"Let's go swimming,\" → He suggested going swimming.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Lưu ý riêng với \"suggest\"</strong><p>\"suggest\" KHÔNG theo sau bởi \"to V\" <span class=\"vi\">(không nói suggested me to go)</span>. Chỉ dùng suggest + V-ing, hoặc suggest + (that) + S + (should) + V-inf: He suggested that I should see a doctor. / He suggested seeing a doctor.</p></div></aside></section><section class=\"topic\" id=\"t-f5\"><h2>6.6  Động từ tường thuật và cấu trúc theo sau</h2><p>Thay vì chỉ dùng “say” và “tell”, người bản ngữ chọn động từ cho thấy THÁI ĐỘ và CHỨC NĂNG của lời nói. Mỗi nhóm có cấu trúc riêng.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Nhóm cấu trúc</th><th>Động từ</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>V + that + mệnh đề</div></td><td><div>say, tell (+ O), explain, mention, announce, claim, state, report, admit, deny, argue, point out, confirm, insist, warn, suggest, recommend, promise</div></td><td><div>She <strong>explained that</strong> the deadline had changed.</div></td></tr><tr><td><div>V + to-V</div></td><td><div>agree, refuse, offer, promise, threaten, demand, claim, decide</div></td><td><div>He <strong>refused to</strong> sign.</div></td></tr><tr><td><div>V + O + to-V</div></td><td><div>ask, tell, order, advise, warn, remind, invite, encourage, urge, beg, persuade, instruct</div></td><td><div>She <strong>advised me to</strong> read it again.</div></td></tr><tr><td><div>V + V-ing</div></td><td><div>admit, deny, suggest, recommend, mention, regret</div></td><td><div>He <strong>denied taking</strong> the file.</div></td></tr><tr><td><div>V + giới từ + V-ing</div></td><td><div>apologise for, accuse sb of, blame sb for, insist on, complain about, congratulate sb on, thank sb for, object to</div></td><td><div>She <strong>apologised for being</strong> late.</div></td></tr><tr><td><div>Suggest / recommend / insist / demand + that + (should) + V</div></td><td><div>giả định (xem Q3)</div></td><td><div>He <strong>suggested that</strong> we <strong>meet</strong> on Friday.</div></td></tr></tbody></table></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Chức năng</th><th>Dùng động từ</th><th>Thay vì</th></tr></thead><tbody><tr><td><div>Nêu thông tin trung lập</div></td><td><div>state, report, mention, note, observe</div></td><td><div>say</div></td></tr><tr><td><div>Giải thích</div></td><td><div>explain, clarify, point out</div></td><td><div>say</div></td></tr><tr><td><div>Khẳng định mạnh</div></td><td><div>insist, maintain, assert, emphasise</div></td><td><div>say strongly</div></td></tr><tr><td><div>Phản đối</div></td><td><div>object, dispute, deny, challenge</div></td><td><div>say no</div></td></tr><tr><td><div>Cảnh báo</div></td><td><div>warn, caution</div></td><td><div>tell not to</div></td></tr><tr><td><div>Đề nghị</div></td><td><div>propose, suggest, recommend</div></td><td><div>say we should</div></td></tr><tr><td><div>Chấp nhận / thừa nhận</div></td><td><div>concede, admit, acknowledge</div></td><td><div>say yes</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Dùng trong công việc</strong><p>“The client said…” → “The client <strong>confirmed</strong> / <strong>stated</strong> / <strong>objected</strong> that…”. Đổi động từ là đổi nghĩa; chọn đúng sẽ làm báo cáo chính xác và chuyên nghiệp hơn.</p></div></aside></section>", "topics": [{"id": "t-f0", "title": "Bậc thang lùi thì", "number": "6.1"}, {"id": "t-f1", "title": "Lùi thì (Backshift)", "number": "6.2"}, {"id": "t-f2", "title": "Thay đổi đại từ, tính từ chỉ định, trạng từ thời gian & nơi chốn", "number": "6.3"}, {"id": "t-f3", "title": "Câu tường thuật dạng câu hỏi", "number": "6.4"}, {"id": "t-f4", "title": "Câu tường thuật dạng câu mệnh lệnh, yêu cầu, đề nghị", "number": "6.5"}, {"id": "t-f5", "title": "Động từ tường thuật và cấu trúc theo sau", "number": "6.6"}], "number": 6}, {"id": "t-g", "title": "Mệnh đề quan hệ & cấu trúc phân từ", "html": "<section class=\"topic\" id=\"t-g0\"><h2>7.1  Chọn đại từ quan hệ</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Chọn đại từ quan hệ\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 356\"><rect class=\"fa\" height=\"40\" rx=\"10\" width=\"260\" x=\"260\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:14px\" text-anchor=\"middle\" x=\"390.0\" y=\"24.0\"><tspan dy=\"0.00em\" x=\"390.0\">Danh từ đứng trước là…?</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"124\" y1=\"44\" y2=\"70\"></line><rect class=\"na\" height=\"40\" rx=\"10\" width=\"246\" x=\"4\" y=\"70\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"127.0\" y=\"90.0\"><tspan dy=\"0.00em\" x=\"127.0\">NGƯỜI</tspan></text><rect class=\"nb\" height=\"46\" rx=\"10\" width=\"246\" x=\"4\" y=\"112\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"127.0\" y=\"135.0\"><tspan dy=\"-0.62em\" x=\"127.0\">who / whom / that</tspan><tspan dy=\"1.25em\" x=\"127.0\">the lawyer who won</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"382\" y1=\"44\" y2=\"70\"></line><rect class=\"ng\" height=\"40\" rx=\"10\" width=\"246\" x=\"262\" y=\"70\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"385.0\" y=\"90.0\"><tspan dy=\"0.00em\" x=\"385.0\">VẬT</tspan></text><rect class=\"nb\" height=\"46\" rx=\"10\" width=\"246\" x=\"262\" y=\"112\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"385.0\" y=\"135.0\"><tspan dy=\"-0.62em\" x=\"385.0\">which / that</tspan><tspan dy=\"1.25em\" x=\"385.0\">the case which failed</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"640\" y1=\"44\" y2=\"70\"></line><rect class=\"no\" height=\"40\" rx=\"10\" width=\"246\" x=\"520\" y=\"70\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"643.0\" y=\"90.0\"><tspan dy=\"0.00em\" x=\"643.0\">SỞ HỮU</tspan></text><rect class=\"nb\" height=\"46\" rx=\"10\" width=\"246\" x=\"520\" y=\"112\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"643.0\" y=\"135.0\"><tspan dy=\"-0.62em\" x=\"643.0\">whose + N</tspan><tspan dy=\"1.25em\" x=\"643.0\">the client whose case…</tspan></text><rect class=\"nr\" height=\"40\" rx=\"10\" width=\"246\" x=\"4\" y=\"170\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"127.0\" y=\"190.0\"><tspan dy=\"0.00em\" x=\"127.0\">NƠI</tspan></text><rect class=\"nb\" height=\"46\" rx=\"10\" width=\"246\" x=\"4\" y=\"212\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"127.0\" y=\"235.0\"><tspan dy=\"-0.62em\" x=\"127.0\">where</tspan><tspan dy=\"1.25em\" x=\"127.0\">the court where I work</tspan></text><rect class=\"na\" height=\"40\" rx=\"10\" width=\"246\" x=\"262\" y=\"170\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"385.0\" y=\"190.0\"><tspan dy=\"0.00em\" x=\"385.0\">THỜI GIAN</tspan></text><rect class=\"nb\" height=\"46\" rx=\"10\" width=\"246\" x=\"262\" y=\"212\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"385.0\" y=\"235.0\"><tspan dy=\"-0.62em\" x=\"385.0\">when</tspan><tspan dy=\"1.25em\" x=\"385.0\">the day when we met</tspan></text><rect class=\"ng\" height=\"40\" rx=\"10\" width=\"246\" x=\"520\" y=\"170\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"643.0\" y=\"190.0\"><tspan dy=\"0.00em\" x=\"643.0\">LÝ DO</tspan></text><rect class=\"nb\" height=\"46\" rx=\"10\" width=\"246\" x=\"520\" y=\"212\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"643.0\" y=\"235.0\"><tspan dy=\"-0.62em\" x=\"643.0\">why</tspan><tspan dy=\"1.25em\" x=\"643.0\">the reason why he left</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"376\" x=\"4\" y=\"280\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"192.0\" y=\"312.0\"><tspan dy=\"-0.62em\" x=\"192.0\">XÁC ĐỊNH (không phẩy)</tspan><tspan dy=\"1.25em\" x=\"192.0\">Thông tin cần thiết; dùng that được; bỏ được đại từ làm tân ngữ.</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"376\" x=\"394\" y=\"280\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"582.0\" y=\"312.0\"><tspan dy=\"-0.62em\" x=\"582.0\">KHÔNG XÁC ĐỊNH (có phẩy)</tspan><tspan dy=\"1.25em\" x=\"582.0\">Thông tin thêm; KHÔNG dùng that; không bỏ đại từ.</tspan></text></svg></div><figcaption>Danh từ phía trước quyết định đại từ quan hệ. Mệnh đề không xác định có dấu phẩy, không dùng that.</figcaption></figure></section><section class=\"topic\" id=\"t-g1\"><h2>7.2  Đại từ và trạng từ quan hệ</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ nối</th><th>Dùng thay cho</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>who</div></td><td><div>thay cho người, làm chủ ngữ hoặc tân ngữ</div></td><td><div>The man who called you is my uncle.</div></td></tr><tr><td><div>whom</div></td><td><div>thay cho người, chỉ làm tân ngữ <span class=\"vi\">(trang trọng, ít dùng trong văn nói)</span></div></td><td><div>The woman whom I met yesterday is a doctor.</div></td></tr><tr><td><div>which</div></td><td><div>thay cho vật/sự việc</div></td><td><div>The book which is on the table is mine.</div></td></tr><tr><td><div>that</div></td><td><div>thay cho cả người và vật <span class=\"vi\">(chỉ dùng trong mệnh đề XÁC ĐỊNH)</span></div></td><td><div>The man that called you is my uncle.</div></td></tr><tr><td><div>whose</div></td><td><div>chỉ sở hữu <span class=\"vi\">(của ai/của cái gì)</span></div></td><td><div>That's the boy whose father is a pilot.</div></td></tr><tr><td><div>where</div></td><td><div>thay cho nơi chốn <span class=\"vi\">(= giới từ + which)</span></div></td><td><div>This is the house where I was born.</div></td></tr><tr><td><div>when</div></td><td><div>thay cho thời gian <span class=\"vi\">(= giới từ + which)</span></div></td><td><div>I remember the day when we first met.</div></td></tr><tr><td><div>why</div></td><td><div>thay cho lý do <span class=\"vi\">(thường sau \"the reason\")</span></div></td><td><div>That's the reason why he left.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-g2\"><h2>7.3  Mệnh đề quan hệ xác định và không xác định</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Đặc điểm</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Mệnh đề xác định (defining)</div></td><td><div>Cung cấp thông tin CẦN THIẾT để xác định danh từ đang nói tới. Không có dấu phẩy. Có thể dùng \"that\" thay who/which.</div></td><td><div>The woman who lives next door is a teacher.</div></td></tr><tr><td><div>Mệnh đề không xác định (non-defining)</div></td><td><div>Cung cấp thêm thông tin PHỤ, không bắt buộc để hiểu câu. Có dấu phẩy bao quanh. KHÔNG dùng \"that\".</div></td><td><div>My mother, who is 60 this year, still works full-time.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo phân biệt nhanh</strong><p>Thử BỎ mệnh đề quan hệ ra khỏi câu: nếu câu còn lại vẫn rõ nghĩa, chỉ mất thông tin phụ → đó là mệnh đề KHÔNG xác định <span class=\"vi\">(có dấu phẩy)</span>. Nếu bỏ đi mà không biết đang nói về ai/cái gì → đó là mệnh đề XÁC ĐỊNH <span class=\"vi\">(không dấu phẩy, có thể dùng \"that\")</span>.</p></div></aside><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Có thể lược bỏ đại từ quan hệ (who/which/that) khi nó làm TÂN NGỮ trong mệnh đề xác định: The book (which) I bought yesterday is great. Không được lược bỏ khi nó làm CHỦ NGỮ, và không bao giờ lược bỏ trong mệnh đề không xác định.</p></div></aside></section><section class=\"topic\" id=\"t-g3\"><h2>7.4  Cấu trúc phân từ (Participle clauses) — rút gọn mệnh đề quan hệ</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Trường hợp</th><th>Ví dụ chuyển đổi</th></tr></thead><tbody><tr><td><div>Mệnh đề chủ động → V-ing <span class=\"vi\">(hiện tại phân từ)</span></div></td><td><div>The man who is standing there is my dad. → The man standing there is my dad.</div></td></tr><tr><td><div>Mệnh đề bị động → V3 <span class=\"vi\">(quá khứ phân từ)</span></div></td><td><div>The car which was stolen last night has been found. → The car stolen last night has been found.</div></td></tr><tr><td><div>Hành động xảy ra TRƯỚC hành động khác <span class=\"vi\">(chủ động, hoàn thành)</span> → Having + V3</div></td><td><div>After he had finished his homework, he went out. → Having finished his homework, he went out.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo chọn V-ing hay V3</strong><p>Chủ ngữ THỰC HIỆN hành động → dùng V-ing <span class=\"vi\">(chủ động, giống hiện tại phân từ)</span>. Chủ ngữ BỊ tác động bởi hành động → dùng V3 <span class=\"vi\">(bị động, giống quá khứ phân từ)</span>. Cách kiểm tra nhanh: thử đặt câu bị động — nếu hợp lý (was stolen) thì dùng V3; nếu chủ ngữ tự làm (is standing) thì dùng V-ing.</p></div></aside></section>", "topics": [{"id": "t-g0", "title": "Chọn đại từ quan hệ", "number": "7.1"}, {"id": "t-g1", "title": "Đại từ và trạng từ quan hệ", "number": "7.2"}, {"id": "t-g2", "title": "Mệnh đề quan hệ xác định và không xác định", "number": "7.3"}, {"id": "t-g3", "title": "Cấu trúc phân từ (Participle clauses) — rút gọn mệnh đề quan hệ", "number": "7.4"}], "number": 7}, {"id": "t-h", "title": "Danh động từ (V-ing) và động từ nguyên thể (to-V)", "html": "<div class=\"panelintro\"><p>Đây là phần khiến nhiều bạn \"sợ\" nhất vì phải nhớ động từ nào theo sau bởi V-ing, động từ nào theo sau bởi to V. Không có quy tắc chung 100%, nhưng có thể học theo NHÓM và MẸO bên dưới.</p></div><section class=\"topic\" id=\"t-h0\"><h2>8.1  Chọn V-ing hay to-V</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Chọn V-ing hay to-V sau động từ\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 302\"><rect class=\"fa\" height=\"40\" rx=\"10\" width=\"240\" x=\"270\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:14px\" text-anchor=\"middle\" x=\"390.0\" y=\"24.0\"><tspan dy=\"0.00em\" x=\"390.0\">Động từ đứng TRƯỚC là gì?</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"74\" y1=\"44\" y2=\"80\"></line><rect class=\"na\" height=\"50\" rx=\"10\" width=\"144\" x=\"4\" y=\"82\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"76.0\" y=\"107.0\"><tspan dy=\"0.00em\" x=\"76.0\">V-ing</tspan></text><rect class=\"nb\" height=\"120\" rx=\"10\" width=\"144\" x=\"4\" y=\"136\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"76.0\" y=\"196.0\"><tspan dy=\"-1.86em\" x=\"76.0\">enjoy, avoid, finish,</tspan><tspan dy=\"1.25em\" x=\"76.0\">mind, keep, suggest,</tspan><tspan dy=\"1.25em\" x=\"76.0\">consider, practise,</tspan><tspan dy=\"1.25em\" x=\"76.0\">admit, deny, risk</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"228\" y1=\"44\" y2=\"80\"></line><rect class=\"ng\" height=\"50\" rx=\"10\" width=\"144\" x=\"158\" y=\"82\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"107.0\"><tspan dy=\"0.00em\" x=\"230.0\">to-V</tspan></text><rect class=\"nb\" height=\"120\" rx=\"10\" width=\"144\" x=\"158\" y=\"136\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"196.0\"><tspan dy=\"-1.86em\" x=\"230.0\">want, hope, decide,</tspan><tspan dy=\"1.25em\" x=\"230.0\">plan, agree, refuse,</tspan><tspan dy=\"1.25em\" x=\"230.0\">afford, manage, offer,</tspan><tspan dy=\"1.25em\" x=\"230.0\">promise, learn</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"382\" y1=\"44\" y2=\"80\"></line><rect class=\"no\" height=\"50\" rx=\"10\" width=\"144\" x=\"312\" y=\"82\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"384.0\" y=\"107.0\"><tspan dy=\"0.00em\" x=\"384.0\">V nguyên (không to)</tspan></text><rect class=\"nb\" height=\"120\" rx=\"10\" width=\"144\" x=\"312\" y=\"136\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"384.0\" y=\"196.0\"><tspan dy=\"-1.86em\" x=\"384.0\">modal: can, must…</tspan><tspan dy=\"1.25em\" x=\"384.0\">let / make + O</tspan><tspan dy=\"1.25em\" x=\"384.0\">had better</tspan><tspan dy=\"1.25em\" x=\"384.0\">would rather</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"536\" y1=\"44\" y2=\"80\"></line><rect class=\"nr\" height=\"50\" rx=\"10\" width=\"144\" x=\"466\" y=\"82\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"538.0\" y=\"107.0\"><tspan dy=\"-0.62em\" x=\"538.0\">V-ing HOẶC to-V</tspan><tspan dy=\"1.25em\" x=\"538.0\">(KHÁC NGHĨA)</tspan></text><rect class=\"nb\" height=\"120\" rx=\"10\" width=\"144\" x=\"466\" y=\"136\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"538.0\" y=\"196.0\"><tspan dy=\"-1.24em\" x=\"538.0\">stop, remember,</tspan><tspan dy=\"1.25em\" x=\"538.0\">forget, try, regret,</tspan><tspan dy=\"1.25em\" x=\"538.0\">go on</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"690\" y1=\"44\" y2=\"80\"></line><rect class=\"nb\" height=\"50\" rx=\"10\" width=\"144\" x=\"620\" y=\"82\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"692.0\" y=\"107.0\"><tspan dy=\"0.00em\" x=\"692.0\">GIỚI TỪ + V-ing</tspan></text><rect class=\"nb\" height=\"120\" rx=\"10\" width=\"144\" x=\"620\" y=\"136\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"692.0\" y=\"196.0\"><tspan dy=\"-1.86em\" x=\"692.0\">look forward to</tspan><tspan dy=\"1.25em\" x=\"692.0\">be used to</tspan><tspan dy=\"1.25em\" x=\"692.0\">in / by / without</tspan><tspan dy=\"1.25em\" x=\"692.0\">+ V-ing</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"390\" y=\"282\"><tspan dy=\"0.00em\" x=\"390\">Mẹo: V-ing = việc ĐANG / ĐÃ làm, thực tế.   to-V = việc CHƯA làm, mục đích, tương lai.</tspan></text></svg></div><figcaption>Sau mỗi động từ, ngữ pháp “chọn sẵn” hình thức. Nhóm đỏ là nhóm đổi nghĩa, cần nhớ riêng.</figcaption></figure></section><section class=\"topic\" id=\"t-h1\"><h2>8.2  Động từ + V-ing</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Ví dụ / Danh sách</th><th></th></tr></thead><tbody><tr><td><div>Nhóm động từ</div></td><td><div>admit, avoid, consider, delay, deny, dislike, enjoy, escape, fancy, finish, imagine, involve, keep, mention, mind, miss, postpone, practise, resist, risk, suggest, feel like, can't help, can't stand</div></td><td><div>I enjoy reading in the evening.</div></td></tr><tr><td><div>Sau giới từ</div></td><td><div>Bất kỳ động từ nào theo ngay sau MỘT GIỚI TỪ đều phải ở dạng V-ing</div></td><td><div>I'm interested in learning French. She's good at cooking.</div></td></tr><tr><td><div>Làm chủ ngữ của câu</div></td><td><div>Swimming is good for your health.</div></td><td><div></div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-h2\"><h2>8.3  Động từ + to V</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Trường hợp</th><th>Ví dụ / Danh sách</th></tr></thead><tbody><tr><td><div>Nhóm động từ</div></td><td><div>agree, arrange, choose, decide, expect, fail, hope, learn, manage, offer, plan, prepare, promise, refuse, seem, want, would like, afford, attempt, ask</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-h3\"><h2>8.4  Động từ + tân ngữ + to V</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Danh sách động từ</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>advise, allow, ask, encourage, expect, invite, order, persuade, remind, teach, tell, want, warn...</div></td><td><div>She reminded me to bring my ID card.</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Riêng \"let\" và \"make\" <span class=\"vi\">(nghĩa bắt ai làm gì)</span> theo sau bởi động từ NGUYÊN THỂ KHÔNG TO: My mother let me go out. / He made me cry. Các động từ tri giác (see, hear, watch, feel, notice) cũng theo sau bởi V-inf hoặc V-ing tùy vào việc chứng kiến trọn vẹn hay một phần hành động.</p></div></aside></section><section class=\"topic\" id=\"t-h4\"><h2>8.5  Động từ đổi nghĩa khi theo sau bởi V-ing hoặc to V</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>remember + V-ing</div></td><td><div>nhớ đã làm gì <span class=\"vi\">(việc đã xảy ra rồi)</span></div></td><td><div>I remember locking the door. <span class=\"vi\">(nhớ đã khóa cửa)</span></div></td></tr><tr><td><div>remember + to V</div></td><td><div>nhớ PHẢI làm gì <span class=\"vi\">(việc chưa xảy ra)</span></div></td><td><div>Remember to lock the door! <span class=\"vi\">(nhớ khóa cửa trước khi đi nhé)</span></div></td></tr><tr><td><div>forget + V-ing</div></td><td><div>quên rằng đã làm gì <span class=\"vi\">(hiếm dùng, thường ở phủ định)</span></div></td><td><div>I'll never forget meeting him for the first time.</div></td></tr><tr><td><div>forget + to V</div></td><td><div>quên PHẢI làm gì</div></td><td><div>I forgot to lock the door.</div></td></tr><tr><td><div>stop + V-ing</div></td><td><div>dừng hẳn việc đang làm</div></td><td><div>He stopped smoking. <span class=\"vi\">(Anh ấy đã bỏ thuốc)</span></div></td></tr><tr><td><div>stop + to V</div></td><td><div>dừng lại ĐỂ làm việc khác <span class=\"vi\">(to V ở đây là mục đích)</span></div></td><td><div>He stopped to smoke. <span class=\"vi\">(Anh ấy dừng lại để hút thuốc)</span></div></td></tr><tr><td><div>try + V-ing</div></td><td><div>thử làm gì đó <span class=\"vi\">(một cách để giải quyết vấn đề)</span></div></td><td><div>Try restarting the computer.</div></td></tr><tr><td><div>try + to V</div></td><td><div>cố gắng làm gì đó <span class=\"vi\">(khó khăn, nỗ lực)</span></div></td><td><div>I tried to open the door, but it was locked.</div></td></tr><tr><td><div>mean + V-ing</div></td><td><div>có nghĩa là <span class=\"vi\">(đồng nghĩa với...)</span>, kéo theo hệ quả</div></td><td><div>Missing the flight meant waiting another day.</div></td></tr><tr><td><div>mean + to V</div></td><td><div>dự định, có ý định làm gì</div></td><td><div>I meant to call you but I forgot.</div></td></tr><tr><td><div>regret + V-ing</div></td><td><div>hối hận về việc đã làm trong quá khứ</div></td><td><div>I regret telling him the truth.</div></td></tr><tr><td><div>regret + to V</div></td><td><div>lấy làm tiếc phải thông báo điều gì <span class=\"vi\">(trang trọng)</span></div></td><td><div>We regret to inform you that your application was unsuccessful.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ nhanh nhóm động từ đổi nghĩa</strong><p>V-ing thường gắn với việc ĐÃ/ĐANG xảy ra <span class=\"vi\">(nhìn về QUÁ KHỨ hoặc là một hành động có thật)</span>. to V thường gắn với việc CHƯA xảy ra, mang tính DỰ ĐỊNH/MỤC ĐÍCH <span class=\"vi\">(hướng tới TƯƠNG LAI)</span>. Ví dụ remember to V = nhớ <span class=\"vi\">(rồi sẽ)</span> làm; remember V-ing = nhớ <span class=\"vi\">(đã)</span> làm.</p></div></aside></section><section class=\"topic\" id=\"t-h5\"><h2>8.6  Prefer, would rather, had better &amp; to-V chỉ mục đích</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>prefer + V-ing/N + to + V-ing/N</div></td><td><div>thích cái này hơn cái kia <span class=\"vi\">(nói chung chung)</span></div></td><td><div>I prefer reading to watching TV.</div></td></tr><tr><td><div>would prefer + to V + rather than + V(-inf)</div></td><td><div>thích làm gì hơn <span class=\"vi\">(một tình huống cụ thể)</span></div></td><td><div>I'd prefer to have dinner at home rather than eat out.</div></td></tr><tr><td><div>would rather + V-inf + than + V-inf</div></td><td><div>thích làm gì hơn <span class=\"vi\">(so sánh 2 hành động)</span></div></td><td><div>I'd rather walk than take the bus.</div></td></tr><tr><td><div>To-V để diễn đạt MỤC ĐÍCH</div></td><td><div>(in order) to V / so as to V</div></td><td><div>I went to university to study Law. / She whispered so as not to wake the baby.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-h6\"><h2>8.7  Danh sách động từ và cấu trúc theo sau (đầy đủ)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Nhóm</th><th>Động từ / cụm</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>+ V-ing</div></td><td><div>admit, avoid, consider, delay, deny, enjoy, finish, imagine, involve, keep (on), mind, miss, practise, postpone, risk, suggest, recommend, resist, quit</div></td><td><div>Would you <strong>mind opening</strong> the window?</div></td></tr><tr><td><div>+ to-V</div></td><td><div>afford, agree, aim, appear, arrange, attempt, choose, decide, demand, expect, fail, hope, learn, manage, offer, plan, pretend, promise, refuse, seem, tend, threaten, wish</div></td><td><div>We <strong>can't afford to lose</strong> this client.</div></td></tr><tr><td><div>+ O + to-V</div></td><td><div>advise, allow, ask, beg, cause, enable, encourage, expect, forbid, force, instruct, invite, order, permit, persuade, remind, require, teach, tell, urge, warn, want, would like</div></td><td><div>The law <strong>requires employers to provide</strong> insurance.</div></td></tr><tr><td><div>+ O + V <span class=\"vi\">(không to)</span></div></td><td><div>let, make, have <span class=\"vi\">(nhờ)</span>, see, hear, watch, notice, feel</div></td><td><div>He <strong>made us wait</strong>. · I <strong>heard her say</strong> it.</div></td></tr><tr><td><div>+ V-ing HOẶC to-V <span class=\"vi\">(nghĩa gần như nhau)</span></div></td><td><div>begin, start, continue, like, love, hate, prefer, intend, bother</div></td><td><div>It started <strong>raining / to rain</strong>.</div></td></tr><tr><td><div>Cụm cố định + V-ing</div></td><td><div>can't help, can't stand, it's no use / no good, it's (not) worth, there's no point (in), be busy, spend / waste time, have difficulty (in), look forward to, be used to, object to, feel like, be accustomed to, in addition to, instead of</div></td><td><div>It's <strong>worth reading</strong> twice. · I'm <strong>busy preparing</strong> the case. · I look forward <strong>to hearing</strong> from you.</div></td></tr><tr><td><div>Tính từ + to-V</div></td><td><div>happy, glad, ready, willing, able, afraid, likely, sure, easy, difficult, important, nice, kind, sorry</div></td><td><div>It is <strong>important to read</strong> the terms.</div></td></tr><tr><td><div>Giới từ + V-ing</div></td><td><div>in, on, by, without, before, after, about, of, for, at</div></td><td><div>Thank you <strong>for sending</strong> the draft.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ nhanh</strong><p>Việc ĐÃ làm / ĐANG làm / có thật → V-ing (enjoy, finish, avoid). Việc CHƯA làm / ý định / mục tiêu → to-V (want, plan, hope, decide).</p></div></aside></section>", "topics": [{"id": "t-h0", "title": "Chọn V-ing hay to-V", "number": "8.1"}, {"id": "t-h1", "title": "Động từ + V-ing", "number": "8.2"}, {"id": "t-h2", "title": "Động từ + to V", "number": "8.3"}, {"id": "t-h3", "title": "Động từ + tân ngữ + to V", "number": "8.4"}, {"id": "t-h4", "title": "Động từ đổi nghĩa khi theo sau bởi V-ing hoặc to V", "number": "8.5"}, {"id": "t-h5", "title": "Prefer, would rather, had better & to-V chỉ mục đích", "number": "8.6"}, {"id": "t-h6", "title": "Danh sách động từ và cấu trúc theo sau (đầy đủ)", "number": "8.7"}], "number": 8}, {"id": "t-k", "title": "Liên từ nhượng bộ, nguyên nhân–kết quả, so/neither", "html": "<section class=\"topic\" id=\"t-k1\"><h2>9.1  Sự nhượng bộ, tương phản (although/though/despite...)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ nối</th><th>Theo sau bởi</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>although / though / even though</div></td><td><div>+ mệnh đề (S + V)</div></td><td><div>Although it was raining, we went out. / We went out although it was raining.</div></td></tr><tr><td><div>despite / in spite of</div></td><td><div>+ V-ing / danh từ / the fact that + mệnh đề</div></td><td><div>Despite the rain, we went out. / In spite of the fact that it was raining, we went out.</div></td></tr><tr><td><div>however / nevertheless</div></td><td><div>đứng đầu câu MỚI, có dấu phẩy theo sau <span class=\"vi\">(liên từ nối 2 câu độc lập)</span></div></td><td><div>It was raining. However, we went out.</div></td></tr><tr><td><div>while / whereas</div></td><td><div>so sánh, đối lập giữa hai vế câu</div></td><td><div>Some people wear jeans on Sunday, while/whereas others wear more formal clothes.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo phân biệt nhanh nhóm nhượng bộ</strong><p>although/though/even though + MỆNH ĐỀ ĐẦY ĐỦ <span class=\"vi\">(có chủ ngữ + động từ)</span>.</p><p>despite/in spite of + CỤM DANH TỪ hoặc V-ing <span class=\"vi\">(KHÔNG được theo sau bởi mệnh đề trực tiếp — lỗi rất hay gặp: despite it rained ❌, phải là despite the fact that it rained ✔ hoặc despite raining/the rain)</span>.</p><p>however/nevertheless không phải liên từ nối trong 1 câu — nó đứng ĐẦU CÂU MỚI <span class=\"vi\">(sau dấu chấm hoặc chấm phẩy)</span>, có dấu phẩy ngay sau nó.</p></div></aside></section><section class=\"topic\" id=\"t-k2\"><h2>9.2  Nguyên nhân – kết quả</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ nối</th><th>Theo sau bởi</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>because</div></td><td><div>+ mệnh đề (S + V)</div></td><td><div>I stayed home because it was raining.</div></td></tr><tr><td><div>because of / due to / owing to</div></td><td><div>+ cụm danh từ / V-ing</div></td><td><div>I stayed home because of the rain.</div></td></tr><tr><td><div>so</div></td><td><div>nối 2 mệnh đề, diễn tả kết quả <span class=\"vi\">(đứng giữa câu, có dấu phẩy trước nó)</span></div></td><td><div>It was raining, so I stayed home.</div></td></tr><tr><td><div>therefore / as a result / consequently</div></td><td><div>trạng từ nối, đứng đầu câu mới hoặc sau dấu chấm phẩy</div></td><td><div>It was raining. Therefore, I stayed home.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-k3\"><h2>9.3  So sánh sự đồng tình: so / neither / either</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>So + trợ động từ + S</div></td><td><div>đồng tình với câu KHẲNG ĐỊNH <span class=\"vi\">(\"cũng vậy\")</span></div></td><td><div>\"I love coffee.\" \"So do I.\" <span class=\"vi\">(Tôi cũng vậy)</span></div></td></tr><tr><td><div>Neither/Nor + trợ động từ + S</div></td><td><div>đồng tình với câu PHỦ ĐỊNH <span class=\"vi\">(\"cũng không\")</span></div></td><td><div>\"I don't like coffee.\" \"Neither do I.\"</div></td></tr><tr><td><div>S + trợ động từ + too / as well</div></td><td><div>đồng tình với câu khẳng định <span class=\"vi\">(dùng cuối câu)</span></div></td><td><div>I love coffee, and she does too.</div></td></tr><tr><td><div>S + trợ động từ + not + either</div></td><td><div>đồng tình với câu phủ định <span class=\"vi\">(dùng cuối câu)</span></div></td><td><div>I don't like coffee, and she doesn't either.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo chọn trợ động từ đúng</strong><p>Trợ động từ dùng trong so/neither phải KHỚP với động từ ở câu trước: động từ thường → dùng do/does/did; động từ \"to be\" → dùng am/is/are/was/were; có động từ khuyết thiếu → lặp lại đúng động từ khuyết thiếu đó (can, will, should...). Sau \"so/neither\" luôn ĐẢO NGỮ: trợ động từ đứng trước chủ ngữ.</p></div></aside></section><section class=\"topic\" id=\"t-k4\"><h2>9.4  Bản đồ từ nối</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Bản đồ từ nối theo quan hệ ý\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 340\"><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"320.0\" x2=\"110\" y1=\"130\" y2=\"104\"></line><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390.0\" x2=\"390\" y1=\"130\" y2=\"104\"></line><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"460.0\" x2=\"670\" y1=\"130\" y2=\"104\"></line><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"320.0\" x2=\"110\" y1=\"188\" y2=\"230\"></line><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390.0\" x2=\"390\" y1=\"188\" y2=\"230\"></line><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"460.0\" x2=\"670\" y1=\"188\" y2=\"230\"></line><rect class=\"fa\" height=\"50\" rx=\"10\" width=\"180\" x=\"300\" y=\"134\"></rect><text class=\"tw\" style=\"font-size:14px\" text-anchor=\"middle\" x=\"390.0\" y=\"159.0\"><tspan dy=\"0.00em\" x=\"390.0\">Quan hệ giữa hai ý</tspan></text><rect class=\"na\" height=\"96\" rx=\"10\" width=\"200\" x=\"10\" y=\"6\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"110.0\" y=\"54.0\"><tspan dy=\"-1.24em\" x=\"110.0\">THÊM</tspan><tspan dy=\"1.25em\" x=\"110.0\">and, also, moreover,</tspan><tspan dy=\"1.25em\" x=\"110.0\">in addition, furthermore</tspan></text><rect class=\"nr\" height=\"96\" rx=\"10\" width=\"200\" x=\"290\" y=\"6\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"390.0\" y=\"54.0\"><tspan dy=\"-1.24em\" x=\"390.0\">TƯƠNG PHẢN</tspan><tspan dy=\"1.25em\" x=\"390.0\">but, however, although,</tspan><tspan dy=\"1.25em\" x=\"390.0\">whereas, despite</tspan></text><rect class=\"no\" height=\"96\" rx=\"10\" width=\"200\" x=\"570\" y=\"6\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"670.0\" y=\"54.0\"><tspan dy=\"-1.24em\" x=\"670.0\">NGUYÊN NHÂN</tspan><tspan dy=\"1.25em\" x=\"670.0\">because, since, as,</tspan><tspan dy=\"1.25em\" x=\"670.0\">due to, owing to</tspan></text><rect class=\"ng\" height=\"96\" rx=\"10\" width=\"200\" x=\"10\" y=\"232\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"110.0\" y=\"280.0\"><tspan dy=\"-1.24em\" x=\"110.0\">KẾT QUẢ</tspan><tspan dy=\"1.25em\" x=\"110.0\">so, therefore, thus,</tspan><tspan dy=\"1.25em\" x=\"110.0\">consequently, as a result</tspan></text><rect class=\"na\" height=\"96\" rx=\"10\" width=\"200\" x=\"290\" y=\"232\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"390.0\" y=\"280.0\"><tspan dy=\"-1.24em\" x=\"390.0\">ĐIỀU KIỆN</tspan><tspan dy=\"1.25em\" x=\"390.0\">if, unless, provided that,</tspan><tspan dy=\"1.25em\" x=\"390.0\">in case, otherwise</tspan></text><rect class=\"nb\" height=\"96\" rx=\"10\" width=\"200\" x=\"570\" y=\"232\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"670.0\" y=\"280.0\"><tspan dy=\"-1.24em\" x=\"670.0\">THỜI GIAN</tspan><tspan dy=\"1.25em\" x=\"670.0\">before, after, meanwhile,</tspan><tspan dy=\"1.25em\" x=\"670.0\">subsequently, thereafter</tspan></text></svg></div><figcaption>Chọn từ nối theo QUAN HỆ giữa hai ý, rồi chọn mức trang trọng.</figcaption></figure></section><section class=\"topic\" id=\"t-k5\"><h2>9.5  “Cũng như” và “giống như”: as well as, like, as, the same as</h2><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Cách nói</th><th>Nghĩa</th><th>Ví dụ</th><th>Mức</th></tr></thead><tbody><tr><td><div>and also</div></td><td><div>và cũng</div></td><td><div>He drafts contracts and also negotiates them.</div></td><td><div>thân mật</div></td></tr><tr><td><div>as well as</div></td><td><div>cũng như <span class=\"vi\">(thêm)</span></div></td><td><div>She is a lawyer <strong>as well as</strong> a consultant.</div></td><td><div>trung tính, trang trọng</div></td></tr><tr><td><div>along with / together with</div></td><td><div>cùng với</div></td><td><div>Send the contract <strong>along with</strong> the annexes.</div></td><td><div>trung tính</div></td></tr><tr><td><div>in addition to</div></td><td><div>ngoài ra</div></td><td><div><strong>In addition to</strong> the main contract, sign an NDA.</div></td><td><div>trang trọng</div></td></tr><tr><td><div>not only … but also …</div></td><td><div>không chỉ… mà còn…</div></td><td><div>He is <strong>not only</strong> professional <strong>but also</strong> dedicated.</div></td><td><div>nhấn mạnh</div></td></tr><tr><td><div>besides / moreover / furthermore</div></td><td><div>hơn nữa</div></td><td><div>Moreover, the fee is reasonable.</div></td><td><div>trang trọng <span class=\"vi\">(đầu câu)</span></div></td></tr></tbody></table></div><h3>Giống như: like, as, the same as, look like</h3><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cách nói</th><th>Dùng khi</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>be like + N</div></td><td><div>giống tính cách, bản chất</div></td><td><div>He is like his father.</div></td></tr><tr><td><div>look like + N</div></td><td><div>giống vẻ ngoài</div></td><td><div>She looks like her mother.</div></td></tr><tr><td><div>like + N</div></td><td><div>như, kiểu như <span class=\"vi\">(so sánh)</span></div></td><td><div>He works <strong>like</strong> a machine.</div></td></tr><tr><td><div>as + vai trò / chức năng</div></td><td><div>với tư cách là</div></td><td><div>She works <strong>as</strong> a lawyer. <span class=\"vi\">(nghề nghiệp thật)</span></div></td></tr><tr><td><div>as + S + V</div></td><td><div>giống như <span class=\"vi\">(mệnh đề)</span></div></td><td><div>Do <strong>as</strong> I say.</div></td></tr><tr><td><div>the same as</div></td><td><div>giống hệt ở điểm cụ thể</div></td><td><div>This is <strong>the same as</strong> the last version.</div></td></tr><tr><td><div>similar to</div></td><td><div>tương tự</div></td><td><div>This clause is <strong>similar to</strong> clause 5.</div></td></tr></tbody></table></div><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>He works like a lawyer. <span class=\"vi\">(nhưng anh ấy thật sự là luật sư)</span></div><div class=\"good\"><span>✓</span>He works <strong>as</strong> a lawyer.</div><div class=\"why\">as = vai trò thật; like = “giống như”.</div></div></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Cách nói “cũng vậy”</strong><p>Me too <span class=\"vi\">(thân mật)</span> · So do I <span class=\"vi\">(sau câu khẳng định)</span> · Neither do I <span class=\"vi\">(sau câu phủ định)</span> · Likewise <span class=\"vi\">(lịch sự)</span> · I feel the same way · I couldn't agree more <span class=\"vi\">(đồng ý mạnh)</span> · I'm with you on that · I share your view.</p></div></aside></section>", "topics": [{"id": "t-k1", "title": "Sự nhượng bộ, tương phản (although/though/despite...)", "number": "9.1"}, {"id": "t-k2", "title": "Nguyên nhân – kết quả", "number": "9.2"}, {"id": "t-k3", "title": "So sánh sự đồng tình: so / neither / either", "number": "9.3"}, {"id": "t-k4", "title": "Bản đồ từ nối", "number": "9.4"}, {"id": "t-k5", "title": "“Cũng như” và “giống như”: as well as, like, as, the same as", "number": "9.5"}], "number": 9}, {"id": "t-l", "title": "Đảo ngữ & sở hữu cách", "html": "<section class=\"topic\" id=\"t-l1\"><h2>10.1  Đảo ngữ với trạng từ/cụm từ mang nghĩa phủ định</h2><p>Khi các trạng từ/cụm từ phủ định <span class=\"vi\">(never, rarely, seldom, hardly, no sooner...than, not only...but also, little, not until, only + cụm trạng từ)</span> đứng ĐẦU CÂU để nhấn mạnh, trợ động từ phải đảo lên trước chủ ngữ — giống cấu trúc câu hỏi.</p><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Từ/cụm từ đứng đầu câu</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Never</div></td><td><div>Never have I worked so hard in all my life.</div></td></tr><tr><td><div>Rarely / Seldom</div></td><td><div>Rarely have I worked so hard in all my life.</div></td></tr><tr><td><div>Hardly...when / No sooner...than</div></td><td><div>Hardly had Matt started work when he was late. / No sooner had Matt started work than he was late. (hardly/scarcely → when; no sooner → than)</div></td></tr><tr><td><div>Not only...but also</div></td><td><div>Not only were you late for my birthday, but you had also forgotten my present.</div></td></tr><tr><td><div>Not until</div></td><td><div>Not until the next day did I find out what had happened.</div></td></tr><tr><td><div>Only + cụm TN</div></td><td><div>Only at the end of the interview did I think I had a chance of getting the job.</div></td></tr><tr><td><div>Little</div></td><td><div>Little did I realise that I would soon be famous.</div></td></tr><tr><td><div>Under no circumstances / At no time</div></td><td><div>Under no circumstances are employees allowed to leave the building without permission.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhận diện &amp; làm bài đảo ngữ</strong><p>Bước 1: xác định từ phủ định cần nhấn mạnh. Bước 2: mượn trợ động từ tương ứng với thì của câu gốc <span class=\"vi\">(do/does/did, have/has/had, is/are/was/were, hoặc modal có sẵn)</span>. Bước 3: đảo trợ động từ đó lên trước chủ ngữ, y hệt cách tạo câu hỏi Yes/No. Never have I seen... = giống hệt việc biến \"I have never seen...\" thành câu hỏi rồi thêm never vào đầu.</p></div></aside></section><section class=\"topic\" id=\"t-l2\"><h2>10.2  Đảo ngữ với so + adj/adv, such</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>So + adj/adv + trợ động từ + S + that...</div></td><td><div>So difficult was the exam that many students failed.</div></td></tr><tr><td><div>Such + be + S + that...</div></td><td><div>Such was her fear that she couldn't move.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-l3\"><h2>10.3  Sở hữu cách: 's và of</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Dùng cho</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>'s (apostrophe s)</div></td><td><div>dùng cho NGƯỜI, ĐỘNG VẬT, và thời gian/khoảng cách</div></td><td><div>Mary's book, the dog's tail, a two hours' wait, today's newspaper</div></td></tr><tr><td><div>of</div></td><td><div>dùng cho VẬT VÔ TRI, khái niệm trừu tượng</div></td><td><div>the title of the book, the roof of the house</div></td></tr><tr><td><div>Sở hữu kép (double genitive)</div></td><td><div>a/an/this/that + N + of + sở hữu cách</div></td><td><div>a friend of my sister's <span class=\"vi\">(một trong số bạn của chị tôi)</span></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ 's và of</strong><p>Vật CÓ SỰ SỐNG <span class=\"vi\">(người, con vật)</span> → thường dùng 's. Vật KHÔNG CÓ SỰ SỐNG → thường dùng of. Ngoại lệ: một số cụm cố định vẫn dùng 's cho vật vô tri liên quan thời gian (a day's journey, ten minutes' walk).</p></div></aside></section><section class=\"topic\" id=\"t-l4\"><h2>10.4  Đảo ngữ: tổng hợp cách dùng</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Khi nào</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Trạng từ phủ định đầu câu</div></td><td><div>Never / Rarely / Seldom / Hardly ever + trợ động từ + S + V</div></td><td><div><strong>Never have I seen</strong> such a case.</div></td></tr><tr><td><div>Hardly … when / No sooner … than</div></td><td><div>Hardly had + S + V3 + when …  /  No sooner had + S + V3 + than …</div></td><td><div><strong>Hardly had</strong> we started <strong>when</strong> the power failed.</div></td></tr><tr><td><div>Only + trạng từ</div></td><td><div>Only then / Only after / Only when + trợ động từ + S + V</div></td><td><div><strong>Only after</strong> the audit <strong>did</strong> we notice it.</div></td></tr><tr><td><div>Not only … but also</div></td><td><div>Not only + trợ động từ + S + V, but … also …</div></td><td><div><strong>Not only did</strong> he lie, <strong>but</strong> he <strong>also</strong> hid evidence.</div></td></tr><tr><td><div>Not until</div></td><td><div>Not until + mốc + trợ động từ + S + V</div></td><td><div><strong>Not until</strong> Monday <strong>will</strong> the court decide.</div></td></tr><tr><td><div>Điều kiện</div></td><td><div>Should / Were / Had + S …</div></td><td><div><strong>Had I known</strong>, I would have called.</div></td></tr><tr><td><div>So / such</div></td><td><div>So + adj + be + S + that …</div></td><td><div><strong>So complex was</strong> the deal that no one understood it.</div></td></tr><tr><td><div>Nơi chốn / hướng <span class=\"vi\">(văn học)</span></div></td><td><div>In / On / Here / There + V + S</div></td><td><div><strong>Here comes</strong> the manager.</div></td></tr><tr><td><div>Neither / So</div></td><td><div>Neither / So + trợ động từ + S</div></td><td><div><strong>So do I.</strong> · <strong>Neither have we.</strong></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Cách làm một câu đảo ngữ</strong><p>Đưa từ phủ định lên đầu → mượn trợ động từ (do / does / did / have / will) → đưa trợ động từ lên trước chủ ngữ. Nếu câu đã có trợ động từ (have / will / can), đảo luôn chính trợ động từ đó.</p></div></aside></section>", "topics": [{"id": "t-l1", "title": "Đảo ngữ với trạng từ/cụm từ mang nghĩa phủ định", "number": "10.1"}, {"id": "t-l2", "title": "Đảo ngữ với so + adj/adv, such", "number": "10.2"}, {"id": "t-l3", "title": "Sở hữu cách: 's và of", "number": "10.3"}, {"id": "t-l4", "title": "Đảo ngữ: tổng hợp cách dùng", "number": "10.4"}], "number": 10}, {"id": "t-m", "title": "Cấu trúc câu thông dụng", "html": "<section class=\"topic\" id=\"t-m1\"><h2>11.1  Cấu trúc gợi ý (Suggestion)</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Let's + V-inf</div></td><td><div>Let's go to the cinema tonight.</div></td></tr><tr><td><div>Shall we + V-inf?</div></td><td><div>Shall we go to the cinema tonight?</div></td></tr><tr><td><div>Why don't we/you + V-inf?</div></td><td><div>Why don't we go to the cinema tonight?</div></td></tr><tr><td><div>What about / How about + V-ing?</div></td><td><div>What about going to the cinema tonight?</div></td></tr><tr><td><div>S + suggest(s) + V-ing / (that) + S + (should) + V</div></td><td><div>I suggest going to the cinema. / I suggest that we (should) go.</div></td></tr><tr><td><div>S + should/ought to + V-inf</div></td><td><div>You should go to the cinema.</div></td></tr><tr><td><div>If I were you, I would + V-inf</div></td><td><div>If I were you, I would go to the cinema.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-m2\"><h2>11.2  Một số cấu trúc câu thông dụng khác</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>It takes (sb) + thời gian + to V</div></td><td><div>diễn tả việc gì tốn bao lâu để làm</div></td><td><div>It takes me 20 minutes to get to school.</div></td></tr><tr><td><div>S + spend + thời gian/tiền + V-ing</div></td><td><div>dành thời gian/tiền để làm gì</div></td><td><div>I spend 2 hours doing homework every day.</div></td></tr><tr><td><div>S + find/think + it + adj + to V</div></td><td><div>S thấy việc gì đó ntn</div></td><td><div>I find it difficult to wake up early.</div></td></tr><tr><td><div>S + be + the + so sánh nhất + N + (that) + S + have ever + V3</div></td><td><div>diễn tả \"…nhất mà ai đó từng…\"</div></td><td><div>This is the best film that I have ever seen.</div></td></tr><tr><td><div>No matter + what/who/where/when/how + S + V</div></td><td><div>dù cho... thế nào đi nữa</div></td><td><div>No matter what happens, I will support you.</div></td></tr><tr><td><div>S + be + so + adj + that + S + V</div></td><td><div>quá... đến nỗi</div></td><td><div>She was so tired that she fell asleep immediately.</div></td></tr><tr><td><div>Not only + S + V + but also + S + V</div></td><td><div>không những... mà còn</div></td><td><div>Not only is she smart, but she is also kind.</div></td></tr><tr><td><div>Both A and B / Either A or B / Neither A nor B</div></td><td><div>cả A và B / A hoặc B / không A cũng không B</div></td><td><div>Both my sister and I like music.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-m3\"><h2>11.3  Word order — Trật tự tính từ, trạng từ</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Trật tự tính từ trước danh từ</div></td><td><div>Ý kiến – Kích thước – Tuổi/hình dạng – Màu sắc – Nguồn gốc – Chất liệu – Mục đích + N</div></td><td><div>a beautiful small old round black Vietnamese wooden dining table</div></td></tr><tr><td><div>Trạng từ tần suất (always, usually, often, never...)</div></td><td><div>đứng SAU động từ \"to be\", nhưng TRƯỚC động từ thường</div></td><td><div>She is always late. / She always arrives late.</div></td></tr><tr><td><div>Trạng từ chỉ cách thức, nơi chốn, thời gian</div></td><td><div>thứ tự Manner – Place – Time <span class=\"vi\">(cách thức – nơi chốn – thời gian)</span></div></td><td><div>She sang beautifully at the concert last night.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ trật tự tính từ OSASCOMP</strong><p>Opinion <span class=\"vi\">(ý kiến)</span> – Size <span class=\"vi\">(kích thước)</span> – Age/Shape <span class=\"vi\">(tuổi/hình dạng)</span> – Colour <span class=\"vi\">(màu)</span> – Origin <span class=\"vi\">(nguồn gốc)</span> – Material <span class=\"vi\">(chất liệu)</span> – Purpose <span class=\"vi\">(mục đích)</span>. Không cần nhớ hết, chỉ cần nhớ tính từ CHỦ QUAN <span class=\"vi\">(đẹp, xấu, hay)</span> luôn đứng gần đầu câu nhất, tính từ khách quan/mục đích luôn sát danh từ nhất.</p></div></aside></section><section class=\"topic\" id=\"t-m4\"><h2>11.4  Các cấu trúc câu hay dùng (bổ sung)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>It takes (sb) + time + to V</div></td><td><div>mất <span class=\"vi\">(bao lâu)</span> để làm gì</div></td><td><div>It takes me an hour to commute.</div></td></tr><tr><td><div>spend + time / money + V-ing</div></td><td><div>dành / tiêu</div></td><td><div>He spends hours <strong>reviewing</strong> contracts.</div></td></tr><tr><td><div>too + adj + (for sb) + to V</div></td><td><div>quá… để…</div></td><td><div>It's <strong>too late to</strong> change it.</div></td></tr><tr><td><div>adj + enough + to V</div></td><td><div>đủ… để…</div></td><td><div>She is <strong>experienced enough to</strong> lead.</div></td></tr><tr><td><div>so + adj + that</div></td><td><div>quá… đến nỗi…</div></td><td><div>It was <strong>so</strong> complex <strong>that</strong> nobody understood it.</div></td></tr><tr><td><div>such + (a) + adj + N + that</div></td><td><div>…</div></td><td><div>It was <strong>such a</strong> complex deal <strong>that</strong>…</div></td></tr><tr><td><div>It's time (for sb) to V / It's time + S + V2</div></td><td><div>đã đến lúc</div></td><td><div>It's time we <strong>left</strong>.</div></td></tr><tr><td><div>would rather (not) + V</div></td><td><div>thà…</div></td><td><div>I'd rather <strong>not</strong> discuss it.</div></td></tr><tr><td><div>would rather + S + V2</div></td><td><div>muốn ai đó làm gì</div></td><td><div>I'd rather you <strong>sent</strong> it today.</div></td></tr><tr><td><div>prefer A to B  /  prefer V-ing to V-ing</div></td><td><div>thích A hơn B</div></td><td><div>I prefer email to phone calls.</div></td></tr><tr><td><div>had better + V</div></td><td><div>nên <span class=\"vi\">(cảnh báo)</span></div></td><td><div>You'd better <strong>check</strong> the date.</div></td></tr><tr><td><div>be about to + V</div></td><td><div>sắp sửa</div></td><td><div>The meeting is about to begin.</div></td></tr><tr><td><div>be likely / unlikely to + V</div></td><td><div>có thể / khó có thể</div></td><td><div>It's likely to <strong>rise</strong>.</div></td></tr><tr><td><div>be supposed to + V</div></td><td><div>được cho là / phải</div></td><td><div>You are supposed to <strong>sign</strong> here.</div></td></tr><tr><td><div>be bound to + V</div></td><td><div>chắc chắn sẽ</div></td><td><div>He is bound to <strong>agree</strong>.</div></td></tr><tr><td><div>be due to + V</div></td><td><div>dự kiến</div></td><td><div>The report is due to <strong>arrive</strong> Monday.</div></td></tr><tr><td><div>be willing / reluctant to + V</div></td><td><div>sẵn lòng / miễn cưỡng</div></td><td><div>We are reluctant to <strong>proceed</strong>.</div></td></tr><tr><td><div>It's worth + V-ing</div></td><td><div>đáng để</div></td><td><div>It's worth <strong>reading</strong>.</div></td></tr><tr><td><div>There is no point (in) V-ing</div></td><td><div>vô ích</div></td><td><div>There's no point <strong>arguing</strong>.</div></td></tr><tr><td><div>Why don't we / How about / What about + V-ing</div></td><td><div>gợi ý</div></td><td><div>How about <strong>meeting</strong> at 3?</div></td></tr><tr><td><div>the more …, the more …</div></td><td><div>càng… càng…</div></td><td><div>The sooner, the better.</div></td></tr><tr><td><div>whether … or not</div></td><td><div>liệu có… hay không</div></td><td><div>Please confirm whether you agree.</div></td></tr><tr><td><div>regardless of / irrespective of</div></td><td><div>bất kể</div></td><td><div>Regardless of the outcome…</div></td></tr><tr><td><div>as far as I am concerned</div></td><td><div>theo tôi</div></td><td><div>As far as I'm concerned, it's fair.</div></td></tr><tr><td><div>in terms of</div></td><td><div>xét về</div></td><td><div>In terms of cost…</div></td></tr><tr><td><div>with regard to / regarding</div></td><td><div>liên quan tới</div></td><td><div>Regarding your request…</div></td></tr><tr><td><div>let alone</div></td><td><div>nói gì đến</div></td><td><div>He can't read, let alone write.</div></td></tr><tr><td><div>have difficulty (in) V-ing</div></td><td><div>gặp khó khăn</div></td><td><div>We had difficulty reaching him.</div></td></tr><tr><td><div>It is (high) time</div></td><td><div>đã đến lúc <span class=\"vi\">(gấp)</span></div></td><td><div>It's high time we <strong>acted</strong>.</div></td></tr><tr><td><div>What matters is …</div></td><td><div>điều quan trọng là</div></td><td><div>What matters is the deadline.</div></td></tr></tbody></table></div></section>", "topics": [{"id": "t-m1", "title": "Cấu trúc gợi ý (Suggestion)", "number": "11.1"}, {"id": "t-m2", "title": "Một số cấu trúc câu thông dụng khác", "number": "11.2"}, {"id": "t-m3", "title": "Word order — Trật tự tính từ, trạng từ", "number": "11.3"}, {"id": "t-m4", "title": "Các cấu trúc câu hay dùng (bổ sung)", "number": "11.4"}], "number": 11}, {"id": "t-q", "title": "Câu phức và cách nhấn ý nâng cao", "html": "<div class=\"panelintro\"><p class=\"lead\">Phần này là phần “lên cấp” sau B2: những cấu trúc người bản ngữ có học dùng khi viết báo cáo, thư từ, hợp đồng và khi nói trong cuộc họp. Hiểu chúng giúp đọc hiểu nhanh và viết gọn, chính xác hơn.</p></div><section class=\"topic\" id=\"t-q1\"><h2>12.1  Mệnh đề danh từ: that, wh-, if / whether</h2><p>Mệnh đề danh từ là một cả mệnh đề đóng vai trò DANH TỪ trong câu: chủ ngữ, tân ngữ, bổ ngữ hoặc đứng sau giới từ.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Mở đầu bằng</th><th>Vai trò</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>that</div></td><td><div>Tân ngữ <span class=\"vi\">(that có thể bỏ)</span>, chủ ngữ, bổ ngữ</div></td><td><div>I know <strong>(that)</strong> he signed. · <strong>That he signed</strong> surprised us. · The fact is <strong>that</strong> we lost.</div></td></tr><tr><td><div>what / who / where / when / why / how</div></td><td><div>Chủ ngữ, tân ngữ</div></td><td><div><strong>What you say</strong> matters. · I don't know <strong>where he works</strong>.</div></td></tr><tr><td><div>if / whether</div></td><td><div>Hỏi có hay không</div></td><td><div>I wonder <strong>if</strong> she agrees. · Tell me <strong>whether</strong> you will come.</div></td></tr><tr><td><div>whatever / whoever / whichever</div></td><td><div>Bất kỳ…</div></td><td><div><strong>Whoever signs</strong> is responsible.</div></td></tr></tbody></table></div><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>Trật tự TRONG mệnh đề danh từ = câu KHẲNG ĐỊNH:  Wh-word + S + V</code></div><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>Do you know where is the office?</div><div class=\"good\"><span>✓</span>Do you know where <strong>the office is</strong>?</div><div class=\"why\">Câu hỏi gián tiếp: không đảo chủ vị, không mượn do/does/did.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>I wonder what does he want.</div><div class=\"good\"><span>✓</span>I wonder what <strong>he wants</strong>.</div><div class=\"why\">Sau wonder / ask / know / tell: S + V.</div></div></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Câu hỏi trực tiếp</th><th>Câu hỏi gián tiếp (lịch sự hơn)</th></tr></thead><tbody><tr><td><div>Where is the contract?</div></td><td><div>Could you tell me where the contract is?</div></td></tr><tr><td><div>What time does it start?</div></td><td><div>Do you know what time it starts?</div></td></tr><tr><td><div>Did he sign?</div></td><td><div>I'd like to know whether he signed.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Dùng that-clause để viết gọn</strong><p>“The fact that the payment was late caused problems.” = “The late payment caused problems.” Hãy cân nhắc: danh từ hoá (late payment) thường gọn hơn cho báo cáo.</p></div></aside></section><section class=\"topic\" id=\"t-q2\"><h2>12.2  Câu chẻ (cleft sentence): nhấn mạnh một phần của câu</h2><p>Câu chẻ “chẻ” một câu thường ra hai phần để đặt phần quan trọng lên nổi bật. Rất hữu ích để nhấn một thông tin hoặc sửa một hiểu lầm.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>It-cleft</div></td><td><div>It is / was + phần nhấn + that / who + phần còn lại</div></td><td><div><strong>It was the CLIENT who</strong> signed the document. <span class=\"vi\">(không phải luật sư)</span></div></td></tr><tr><td><div>Wh-cleft (pseudo-cleft)</div></td><td><div>What + S + V + is / was + phần nhấn</div></td><td><div><strong>What we need is</strong> a clear deadline.</div></td></tr><tr><td><div>All / The thing / The reason cleft</div></td><td><div>All / The only thing / The reason why … is …</div></td><td><div><strong>All I want is</strong> a straight answer. · <strong>The reason why</strong> I left <strong>is that</strong> …</div></td></tr><tr><td><div>Wh-cleft với hành động</div></td><td><div>What + S + did + was + (to) V</div></td><td><div><strong>What he did was</strong> (to) resign.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Dùng khi nào</strong><p>Cleft nhấn thông tin MỚI hoặc TƯƠNG PHẢN. Trong email: “What I'd like to propose is a short call on Thursday.” — mềm hơn và rõ hơn “I propose a call.” Đừng dùng quá nhiều, mỗi đoạn tối đa một lần.</p></div></aside></section><section class=\"topic\" id=\"t-q3\"><h2>12.3  Giả định (subjunctive) sau suggest, insist, essential</h2><p>Sau một số động từ / tính từ diễn tả ĐỀ XUẤT, YÊU CẦU, CẦN THIẾT, mệnh đề that dùng ĐỘNG TỪ NGUYÊN MẪU <span class=\"vi\">(không chia, không s, không -ed)</span>. Đây là văn phong trang trọng, rất hay gặp trong luật và quy chế.</p><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>S + suggest / recommend / insist / demand / require / propose / ask + that + S + (should) + V nguyên</code><code>It is essential / vital / important / necessary / desirable + that + S + (should) + V nguyên</code></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Anh-Mỹ / văn bản chuẩn</th><th>Anh-Anh (thêm should)</th><th>SAI</th></tr></thead><tbody><tr><td><div>The court demands that he <strong>appear</strong> in person.</div></td><td><div>…that he <strong>should appear</strong>…</div></td><td><div>…that he appears / appeared…</div></td></tr><tr><td><div>It is vital that the report <strong>be</strong> accurate.</div></td><td><div>…that the report <strong>should be</strong> accurate.</div></td><td><div>…that the report is accurate.</div></td></tr><tr><td><div>We recommend that she <strong>not sign</strong> yet.</div></td><td><div>…that she <strong>should not sign</strong> yet.</div></td><td><div>…that she doesn't sign.</div></td></tr></tbody></table></div><h3>Động từ và tính từ kích hoạt giả định</h3><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Động từ</th><th>Tính từ</th></tr></thead><tbody><tr><td><div>advise, ask, demand, insist, move (a motion), order, propose, recommend, request, require, suggest, stipulate</div></td><td><div>advisable, crucial, desirable, essential, imperative, important, necessary, vital</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Lưu ý với suggest</span><div class=\"box\"><p>Khi suggest = “gợi ý” → dùng giả định (He suggested that we meet). Khi suggest = “cho thấy, ngụ ý” → chia bình thường (The data suggests that sales are falling).</p></div></aside><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Cách nhận biết trong hợp đồng</strong><p>“It is a condition that the Buyer <strong>pay</strong> the price in full.” — hiểu “pay” <span class=\"vi\">(không phải “pays”)</span> là dấu hiệu giả định = nghĩa vụ bắt buộc.</p></div></aside></section><section class=\"topic\" id=\"t-q4\"><h2>12.4  Tỉnh lược và thay thế: tránh lặp từ</h2><p>Người bản ngữ không lặp lại từ đã nhắc. Họ lược bỏ hoặc thay bằng từ ngắn. Đọc hiểu và viết gọn đều cần kỹ năng này.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Kỹ thuật</th><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Lược chủ ngữ + trợ động từ sau and / but / or</div></td><td><div>Khi chủ ngữ giống nhau</div></td><td><div>She opened the file and (she) read it.</div></td></tr><tr><td><div>Lược cụm đã nhắc, giữ trợ động từ</div></td><td><div>Câu trả lời ngắn</div></td><td><div>“Can you sign?” “Yes, I <strong>can</strong>.”</div></td></tr><tr><td><div>Lược “to V” sau to</div></td><td><div>Tránh lặp động từ</div></td><td><div>I'd love to join, but I don't have time <strong>to</strong>.</div></td></tr><tr><td><div>do so / do it / do that</div></td><td><div>Thay cho động từ + tân ngữ</div></td><td><div>The Tenant must pay rent and <strong>should do so</strong> monthly.</div></td></tr><tr><td><div>so / not</div></td><td><div>Thay cho mệnh đề that</div></td><td><div>“Will he agree?” “I hope <strong>so</strong> / I'm afraid <strong>not</strong>.”</div></td></tr><tr><td><div>one / ones</div></td><td><div>Thay cho danh từ đếm được đã nhắc</div></td><td><div>I like the red <strong>one</strong> and the blue <strong>ones</strong>.</div></td></tr><tr><td><div>Mệnh đề so sánh</div></td><td><div>Lược động từ</div></td><td><div>He earns more than <strong>I do</strong> / than <strong>me</strong>.</div></td></tr><tr><td><div>Đại từ quan hệ làm tân ngữ</div></td><td><div>Có thể bỏ</div></td><td><div>The deal <strong>(that)</strong> we signed was good.</div></td></tr><tr><td><div>Lược mệnh đề phụ trạng ngữ</div></td><td><div>while / when / if + V-ing / V3 / adj</div></td><td><div><strong>If necessary</strong>, call me. · <strong>When signing</strong>, check the date.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Cẩn thận trong văn bản pháp lý</strong><p>Hợp đồng THƯỜNG lặp lại danh từ đầy đủ (“the Seller”, “the Buyer”) thay vì dùng đại từ, để tránh mơ hồ. Đây là ngoại lệ có chủ ý của quy tắc “tránh lặp”.</p></div></aside></section><section class=\"topic\" id=\"t-q5\"><h2>12.5  Thứ tự thông tin và các chủ ngữ giả (It, There)</h2><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Kỹ thuật</th><th>Cấu trúc</th><th>Ví dụ</th><th>Dùng để</th></tr></thead><tbody><tr><td><div>Chủ ngữ giả It (extraposition)</div></td><td><div>It + be + adj + that / to V</div></td><td><div><strong>It is important that</strong> we meet. · <strong>It is hard to</strong> decide.</div></td><td><div>Đưa mệnh đề dài ra sau, câu dễ đọc.</div></td></tr><tr><td><div>There is / are</div></td><td><div>There + be + N</div></td><td><div><strong>There is a risk</strong> of delay.</div></td><td><div>Giới thiệu thông tin mới.</div></td></tr><tr><td><div>There + động từ khác</div></td><td><div>There seems / appears / remains / exists / arose</div></td><td><div><strong>There remains</strong> one issue.</div></td><td><div>Trang trọng, báo cáo.</div></td></tr><tr><td><div>Đặt thông tin cũ trước, mới sau</div></td><td><div>Chủ ngữ = cái đã biết, cuối câu = cái mới</div></td><td><div>The contract was reviewed by <strong>our new associate</strong>.</div></td><td><div>Đoạn văn mạch lạc.</div></td></tr><tr><td><div>Bị động để giữ chủ đề</div></td><td><div>Giữ cùng chủ ngữ qua các câu</div></td><td><div>The product launched in May. <strong>It was praised</strong> by critics.</div></td><td><div>Mạch lạc.</div></td></tr><tr><td><div>Nhấn bằng do / does / did</div></td><td><div>Do + V trong câu khẳng định</div></td><td><div>I <strong>do</strong> understand your concern.</div></td><td><div>Nhấn / khẳng định mạnh.</div></td></tr><tr><td><div>Đảo ngữ trạng từ</div></td><td><div>Never / Seldom + trợ động từ + S</div></td><td><div><strong>Seldom have we seen</strong> such a case.</div></td><td><div>Trang trọng.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Quy tắc “cũ trước, mới sau”</strong><p>Câu mạch lạc thường bắt đầu bằng cái người đọc đã biết <span class=\"vi\">(từ câu trước)</span> và kết thúc bằng thông tin mới. Nếu bạn thấy đoạn văn “giật cục”, thử đổi vị trí hoặc dùng bị động.</p></div></aside></section><section class=\"topic\" id=\"t-q6\"><h2>12.6  Cấu trúc câu: đơn, ghép, phức</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Cấu tạo</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Câu đơn (simple)</div></td><td><div>1 mệnh đề độc lập</div></td><td><div>The court approved the plan.</div></td></tr><tr><td><div>Câu ghép (compound)</div></td><td><div>2 mệnh đề độc lập nối bằng liên từ đẳng lập (FANBOYS: for, and, nor, but, or, yet, so)</div></td><td><div>The court approved the plan, <strong>but</strong> the client objected.</div></td></tr><tr><td><div>Câu phức (complex)</div></td><td><div>1 mệnh đề chính + mệnh đề phụ (because, although, which, that, if…)</div></td><td><div><strong>Although</strong> the client objected, the court approved the plan.</div></td></tr><tr><td><div>Câu phức-ghép</div></td><td><div>Kết hợp cả hai</div></td><td><div>The court approved the plan, <strong>although</strong> the client objected, <strong>and</strong> the case closed.</div></td></tr></tbody></table></div><h3>Lỗi hay gặp</h3><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>The deadline passed, we did not receive the file. (comma splice)</div><div class=\"good\"><span>✓</span>The deadline passed <strong>and</strong> we did not receive the file. / The deadline passed; we did not receive the file.</div><div class=\"why\">Hai mệnh đề độc lập không nối bằng dấu phẩy.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>Because the client was late. <span class=\"vi\">(câu thiếu)</span></div><div class=\"good\"><span>✓</span><strong>Because the client was late, we postponed.</strong></div><div class=\"why\">Mệnh đề phụ không đứng một mình.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>We reviewed the draft, signed the contract, and the client was happy. <span class=\"vi\">(không song song)</span></div><div class=\"good\"><span>✓</span>We reviewed the draft, signed the contract, <strong>and made the client happy.</strong></div><div class=\"why\">Các mục trong danh sách cần cùng dạng ngữ pháp.</div></div></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo độ dài</strong><p>Trung bình 15–20 từ mỗi câu cho văn bản công việc. Câu trên 30 từ → tách. Câu nào cần đọc hai lần → tách hoặc đơn giản hoá.</p></div></aside></section><section class=\"topic\" id=\"t-q7\"><h2>12.7  Mệnh đề phân từ đầu câu và lỗi “treo”</h2><p>Mệnh đề phân từ (V-ing / V3) đứng đầu câu phải có CÙNG CHỦ NGỮ với mệnh đề chính. Nếu không, đó là lỗi “dangling modifier” <span class=\"vi\">(từ bổ nghĩa bị treo)</span>.</p><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>Walking into the office, the phone rang.</div><div class=\"good\"><span>✓</span>Walking into the office, <strong>I heard the phone ring</strong>.</div><div class=\"why\">Ai đang đi? Cái điện thoại không đi.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>Having reviewed the contract, the changes were made.</div><div class=\"good\"><span>✓</span>Having reviewed the contract, <strong>we made changes</strong>.</div><div class=\"why\">Chủ ngữ người xem hợp đồng phải xuất hiện.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>Based on the report, the budget was cut.</div><div class=\"good\"><span>✓</span>Based on the report, <strong>management cut the budget</strong>. / <strong>The budget was cut</strong> based on the report.</div><div class=\"why\">Mệnh đề phân từ gắn với chủ ngữ mệnh đề chính.</div></div></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Dạng</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>V-ing <span class=\"vi\">(chủ động, cùng lúc)</span></div></td><td><div>Khi / trong khi / vì</div></td><td><div><strong>Reading</strong> the contract, I noticed a gap.</div></td></tr><tr><td><div>Having + V3 <span class=\"vi\">(xong trước)</span></div></td><td><div>Sau khi</div></td><td><div><strong>Having signed</strong>, he left.</div></td></tr><tr><td><div>V3 <span class=\"vi\">(bị động)</span></div></td><td><div>Được / bị</div></td><td><div><strong>Delayed by rain</strong>, the flight landed late.</div></td></tr><tr><td><div>Not + V-ing</div></td><td><div>Phủ định</div></td><td><div><strong>Not knowing</strong> the law, he hired a lawyer.</div></td></tr></tbody></table></div></section>", "topics": [{"id": "t-q1", "title": "Mệnh đề danh từ: that, wh-, if / whether", "number": "12.1"}, {"id": "t-q2", "title": "Câu chẻ (cleft sentence): nhấn mạnh một phần của câu", "number": "12.2"}, {"id": "t-q3", "title": "Giả định (subjunctive) sau suggest, insist, essential", "number": "12.3"}, {"id": "t-q4", "title": "Tỉnh lược và thay thế: tránh lặp từ", "number": "12.4"}, {"id": "t-q5", "title": "Thứ tự thông tin và các chủ ngữ giả (It, There)", "number": "12.5"}, {"id": "t-q6", "title": "Cấu trúc câu: đơn, ghép, phức", "number": "12.6"}, {"id": "t-q7", "title": "Mệnh đề phân từ đầu câu và lỗi “treo”", "number": "12.7"}], "number": 12}, {"id": "t-i", "title": "Giới từ (Prepositions)", "html": "<section class=\"topic\" id=\"t-i0\"><h2>13.1  Phễu in – on – at</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Phễu in, on, at cho thời gian và nơi chốn\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 262\"><text class=\"tb\" text-anchor=\"middle\" x=\"100\" y=\"18\"><tspan dy=\"0.00em\" x=\"100\">THỜI GIAN (rộng → hẹp)</tspan></text><polygon class=\"na\" points=\"10.0,34 190.0,34 171.66666666666669,100 28.33333333333333,100\"></polygon><text class=\"tb\" style=\"font-size:18px\" text-anchor=\"middle\" x=\"100\" y=\"67.0\"><tspan dy=\"0.00em\" x=\"100\">IN</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"start\" x=\"210\" y=\"67.0\"><tspan dy=\"-1.24em\" x=\"210\">thế kỷ, năm, tháng,</tspan><tspan dy=\"1.25em\" x=\"210\">mùa, buổi</tspan><tspan dy=\"1.25em\" x=\"210\">in 2025, in May, in the morning</tspan></text><polygon class=\"no\" points=\"28.33333333333333,104 171.66666666666669,104 153.33333333333334,170 46.666666666666664,170\"></polygon><text class=\"tb\" style=\"font-size:18px\" text-anchor=\"middle\" x=\"100\" y=\"137.0\"><tspan dy=\"0.00em\" x=\"100\">ON</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"start\" x=\"210\" y=\"137.0\"><tspan dy=\"-0.62em\" x=\"210\">thứ, ngày cụ thể</tspan><tspan dy=\"1.25em\" x=\"210\">on Monday, on 5 May</tspan></text><polygon class=\"nr\" points=\"46.666666666666664,174 153.33333333333334,174 135.0,240 65.0,240\"></polygon><text class=\"tb\" style=\"font-size:18px\" text-anchor=\"middle\" x=\"100\" y=\"207.0\"><tspan dy=\"0.00em\" x=\"100\">AT</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"start\" x=\"210\" y=\"207.0\"><tspan dy=\"-0.62em\" x=\"210\">giờ, mốc chính xác</tspan><tspan dy=\"1.25em\" x=\"210\">at 7 p.m., at noon, at night</tspan></text><text class=\"tb\" text-anchor=\"middle\" x=\"490\" y=\"18\"><tspan dy=\"0.00em\" x=\"490\">NƠI CHỐN (rộng → hẹp)</tspan></text><polygon class=\"na\" points=\"400.0,34 580.0,34 561.6666666666666,100 418.3333333333333,100\"></polygon><text class=\"tb\" style=\"font-size:18px\" text-anchor=\"middle\" x=\"490\" y=\"67.0\"><tspan dy=\"0.00em\" x=\"490\">IN</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"start\" x=\"600\" y=\"67.0\"><tspan dy=\"-1.24em\" x=\"600\">không gian bao quanh</tspan><tspan dy=\"1.25em\" x=\"600\">in Vietnam, in the room,</tspan><tspan dy=\"1.25em\" x=\"600\">in a car</tspan></text><polygon class=\"no\" points=\"418.3333333333333,104 561.6666666666666,104 543.3333333333334,170 436.6666666666667,170\"></polygon><text class=\"tb\" style=\"font-size:18px\" text-anchor=\"middle\" x=\"490\" y=\"137.0\"><tspan dy=\"0.00em\" x=\"490\">ON</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"start\" x=\"600\" y=\"137.0\"><tspan dy=\"-1.24em\" x=\"600\">bề mặt, đường, tầng</tspan><tspan dy=\"1.25em\" x=\"600\">on the table, on Le Loi St.,</tspan><tspan dy=\"1.25em\" x=\"600\">on the 3rd floor</tspan></text><polygon class=\"nr\" points=\"436.6666666666667,174 543.3333333333334,174 525.0,240 455.0,240\"></polygon><text class=\"tb\" style=\"font-size:18px\" text-anchor=\"middle\" x=\"490\" y=\"207.0\"><tspan dy=\"0.00em\" x=\"490\">AT</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"start\" x=\"600\" y=\"207.0\"><tspan dy=\"-1.24em\" x=\"600\">điểm cụ thể</tspan><tspan dy=\"1.25em\" x=\"600\">at the door, at 12 Le Loi,</tspan><tspan dy=\"1.25em\" x=\"600\">at the airport</tspan></text></svg></div><figcaption>Từ rộng đến hẹp: IN <span class=\"vi\">(bao quanh, khoảng dài)</span> → ON <span class=\"vi\">(bề mặt, ngày)</span> → AT <span class=\"vi\">(điểm, giờ)</span>.</figcaption></figure></section><section class=\"topic\" id=\"t-i1\"><h2>13.2  Giới từ chỉ thời gian: in / on / at</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Giới từ</th><th>Dùng cho</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>at</div></td><td><div>giờ giấc, thời điểm cụ thể, một số cụm cố định</div></td><td><div>at 6 o'clock, at night, at the moment, at Christmas, at the weekend (Anh-Anh)</div></td></tr><tr><td><div>on</div></td><td><div>ngày, ngày tháng cụ thể, thứ trong tuần, dịp cụ thể</div></td><td><div>on Monday, on 20th July, on my birthday, on Christmas Day</div></td></tr><tr><td><div>in</div></td><td><div>tháng, năm, mùa, thế kỷ, khoảng thời gian dài <span class=\"vi\">(buổi sáng/chiều/tối)</span></div></td><td><div>in July, in 2020, in summer, in the morning, in the 1990s</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ in/on/at theo \"độ dài thời gian\"</strong><p>Hãy tưởng tượng 3 giới từ này theo độ dài giảm dần: IN <span class=\"vi\">(khoảng thời gian DÀI: năm, tháng, mùa)</span> → ON <span class=\"vi\">(một NGÀY cụ thể)</span> → AT <span class=\"vi\">(một ĐIỂM thời gian ngắn, chính xác: giờ)</span>. Càng cụ thể/ngắn thì càng dùng \"at\".</p></div></aside></section><section class=\"topic\" id=\"t-i2\"><h2>13.3  Giới từ chỉ nơi chốn: in / on / at</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Giới từ</th><th>Dùng cho</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>at</div></td><td><div>một điểm/địa chỉ cụ thể</div></td><td><div>at the bus stop, at home, at 25 Tran Hung Dao Street, at school <span class=\"vi\">(ý nói đang học)</span></div></td></tr><tr><td><div>on</div></td><td><div>bề mặt, đường phố <span class=\"vi\">(không kèm số nhà)</span>, phương tiện lớn <span class=\"vi\">(tàu, máy bay, xe buýt)</span></div></td><td><div>on the wall, on Nguyen Trai Street, on the bus/train/plane</div></td></tr><tr><td><div>in</div></td><td><div>không gian kín/khu vực rộng: thành phố, quốc gia, phòng, hộp</div></td><td><div>in London, in Vietnam, in the room, in the box, in a car/taxi</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-i3\"><h2>13.4  Một số giới từ chỉ nơi chốn/hướng khác</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Giới từ</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>between</div></td><td><div>ở giữa <span class=\"vi\">(2 vật/người)</span></div></td><td><div>between the two buildings</div></td></tr><tr><td><div>among</div></td><td><div>ở giữa <span class=\"vi\">(từ 3 trở lên, số nhiều)</span></div></td><td><div>among the crowd</div></td></tr><tr><td><div>opposite</div></td><td><div>đối diện</div></td><td><div>opposite the station</div></td></tr><tr><td><div>next to / beside</div></td><td><div>bên cạnh</div></td><td><div>next to the bank</div></td></tr><tr><td><div>through</div></td><td><div>xuyên qua <span class=\"vi\">(không gian 3 chiều)</span></div></td><td><div>walk through the tunnel</div></td></tr><tr><td><div>across</div></td><td><div>băng qua <span class=\"vi\">(bề mặt phẳng)</span></div></td><td><div>walk across the street</div></td></tr><tr><td><div>along</div></td><td><div>dọc theo</div></td><td><div>walk along the river</div></td></tr><tr><td><div>towards</div></td><td><div>về phía</div></td><td><div>He ran towards the exit.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-i4\"><h2>13.5  Giới từ đi cùng tính từ, động từ cố định (collocations)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cụm từ 1</th><th>Cụm từ 2</th><th>Cụm từ 3</th></tr></thead><tbody><tr><td><div>interested in</div></td><td><div>afraid of</div></td><td><div>good at</div></td></tr><tr><td><div>married to</div></td><td><div>famous for</div></td><td><div>angry with <span class=\"vi\">(người)</span> / about <span class=\"vi\">(việc)</span></div></td></tr><tr><td><div>proud of</div></td><td><div>similar to</div></td><td><div>different from</div></td></tr><tr><td><div>worried about</div></td><td><div>keen on</div></td><td><div>responsible for</div></td></tr><tr><td><div>depend on</div></td><td><div>listen to</div><
