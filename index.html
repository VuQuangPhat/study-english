class=\"vi\">(thì động từ, câu bị động, mệnh đề quan hệ...)</span> sẽ dễ thở hơn rất nhiều, vì chúng đều được xây trên nền của đại từ, danh từ, mạo từ và cách so sánh.</p></div><section class=\"topic\" id=\"t-a1\"><h2>1.1  Đại từ nhân xưng, tính từ sở hữu, đại từ phản thân</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Đại từ chủ ngữ / tân ngữ / phản thân / sở hữu / TT sở hữu</th><th>Ghi chú</th></tr></thead><tbody><tr><td><div>I / me / myself / mine / my</div></td><td><div>Ngôi thứ 1 số ít</div></td></tr><tr><td><div>we / us / ourselves / ours / our</div></td><td><div>Ngôi thứ 1 số nhiều</div></td></tr><tr><td><div>you / you / yourself(-selves) / yours / your</div></td><td><div>Ngôi thứ 2</div></td></tr><tr><td><div>he / him / himself / his / his</div></td><td><div>Ngôi thứ 3 số ít (nam)</div></td></tr><tr><td><div>she / her / herself / hers / her</div></td><td><div>Ngôi thứ 3 số ít <span class=\"vi\">(nữ)</span></div></td></tr><tr><td><div>it / it / itself / its / its</div></td><td><div>Ngôi thứ 3 số ít <span class=\"vi\">(vật/con vật)</span></div></td></tr><tr><td><div>they / them / themselves / theirs / their</div></td><td><div>Ngôi thứ 3 số nhiều</div></td></tr></tbody></table></div><h3>Phân biệt 5 loại</h3><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Chức năng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Đại từ chủ ngữ</div></td><td><div>Làm chủ ngữ, đứng đầu câu.</div></td><td><div>She is a doctor. <span class=\"vi\">(Cô ấy là bác sĩ.)</span></div></td></tr><tr><td><div>Đại từ tân ngữ</div></td><td><div>Làm tân ngữ, đứng sau động từ/giới từ.</div></td><td><div>Can you help her? <span class=\"vi\">(Bạn giúp cô ấy được không?)</span></div></td></tr><tr><td><div>Tính từ sở hữu</div></td><td><div>Đứng trước danh từ để chỉ \"của ai\".</div></td><td><div>This is her book. <span class=\"vi\">(Đây là sách của cô ấy.)</span></div></td></tr><tr><td><div>Đại từ sở hữu</div></td><td><div>Đứng một mình, thay cho \"TT sở hữu + danh từ\".</div></td><td><div>This book is hers. <span class=\"vi\">(Cuốn sách này là của cô ấy.)</span></div></td></tr><tr><td><div>Đại từ phản thân</div></td><td><div>Dùng khi chủ ngữ và tân ngữ là một; hoặc để nhấn mạnh.</div></td><td><div>She hurt herself. <span class=\"vi\">(Cô ấy tự làm mình bị thương.)</span> / She did it herself. <span class=\"vi\">(Cô ấy tự làm việc đó.)</span></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt tính từ sở hữu và đại từ sở hữu</strong><p>Tính từ sở hữu luôn kè theo một danh từ phía sau (her book). Đại từ sở hữu đứng một mình, không có danh từ theo sau <span class=\"vi\">(This book is hers — không nói \"hers book\")</span>.</p><p>its <span class=\"vi\">(không có nháy)</span> = tính từ sở hữu của \"it\"; it's = it is/it has. Đây là lỗi chính tả rất hay gặp.</p></div></aside></section><section class=\"topic\" id=\"t-a2\"><h2>1.2  Danh từ đếm được – không đếm được &amp; lượng từ</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Đặc điểm</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Danh từ đếm được <span class=\"vi\">(đếm được từng cái)</span></div></td><td><div>book → books, chair → chairs, idea → ideas</div></td><td><div>There are three books on the table.</div></td></tr><tr><td><div>Danh từ không đếm được <span class=\"vi\">(chỉ chất liệu, khái niệm trừu tượng)</span></div></td><td><div>water, rice, money, advice, information, furniture, homework, news</div></td><td><div>I need some advice. <span class=\"vi\">(KHÔNG nói \"an advice\")</span></div></td></tr></tbody></table></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Lượng từ</th><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>many</div></td><td><div>Đi với danh từ đếm được số nhiều, thường trong câu phủ định/nghi vấn</div></td><td><div>How many books do you have?</div></td></tr><tr><td><div>much</div></td><td><div>Đi với danh từ không đếm được, thường trong câu phủ định/nghi vấn</div></td><td><div>I don't have much time.</div></td></tr><tr><td><div>a lot of / lots of</div></td><td><div>Đi với cả 2 loại, dùng tự nhiên trong câu khẳng định</div></td><td><div>She has a lot of friends. / a lot of money.</div></td></tr><tr><td><div>a few</div></td><td><div>\"một vài\" <span class=\"vi\">(đếm được)</span> — mang nghĩa DƯƠNG, đủ dùng</div></td><td><div>I have a few friends here. <span class=\"vi\">(Tôi có vài người bạn — đủ để không cô đơn)</span></div></td></tr><tr><td><div>few</div></td><td><div>\"rất ít, hầu như không có\" <span class=\"vi\">(đếm được)</span> — mang nghĩa ÂM</div></td><td><div>I have few friends here. <span class=\"vi\">(Tôi có rất ít bạn — hơi buồn)</span></div></td></tr><tr><td><div>a little</div></td><td><div>\"một chút\" <span class=\"vi\">(không đếm được)</span> — nghĩa DƯƠNG</div></td><td><div>I have a little money. <span class=\"vi\">(Đủ tiêu tạm)</span></div></td></tr><tr><td><div>little</div></td><td><div>\"rất ít, hầu như không\" <span class=\"vi\">(không đếm được)</span> — nghĩa ÂM</div></td><td><div>I have little money. <span class=\"vi\">(Gần như hết tiền)</span></div></td></tr><tr><td><div>some / any</div></td><td><div>some: câu khẳng định &amp; lời mời/đề nghị; any: câu phủ định &amp; nghi vấn thường</div></td><td><div>I bought some apples. Do you have any apples?</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ a few/few và a little/little</strong><p>Cứ có chữ \"a\" đứng trước là mang nghĩa TÍCH CỰC <span class=\"vi\">(có một ít, đủ dùng)</span>. Không có \"a\" là mang nghĩa TIÊU CỰC <span class=\"vi\">(gần như không có, thiếu)</span>.</p><p>few/a few đi với danh từ ĐẾM ĐƯỢC số nhiều; little/a little đi với danh từ KHÔNG đếm được.</p></div></aside></section><section class=\"topic\" id=\"t-a3\"><h2>1.3  Mạo từ: a / an / the / mạo từ Ø (không dùng)</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Chọn a, an, the hay không mạo từ\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 360\"><rect class=\"fa\" height=\"40\" rx=\"10\" width=\"260\" x=\"260\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:14px\" text-anchor=\"middle\" x=\"390.0\" y=\"24.0\"><tspan dy=\"0.00em\" x=\"390.0\">Danh từ cần mạo từ</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"390\" y1=\"44\" y2=\"70\"></line><rect class=\"nq\" height=\"52\" rx=\"10\" width=\"340\" x=\"220\" y=\"72\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"390.0\" y=\"98.0\"><tspan dy=\"-0.62em\" x=\"390.0\">Người nghe có BIẾT ĐÓ LÀ CÁI NÀO không?</tspan><tspan dy=\"1.25em\" x=\"390.0\">(đã nhắc, duy nhất, chỉ có một)</tspan></text><line class=\"ln\" x1=\"220\" x2=\"130\" y1=\"98\" y2=\"98\"></line><text class=\"tg\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"180\" y=\"88\"><tspan dy=\"0.00em\" x=\"180\">Có</tspan></text><polyline class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\" points=\"130,98 130,140\"></polyline><rect class=\"ng\" height=\"50\" rx=\"10\" width=\"220\" x=\"20\" y=\"142\"></rect><text class=\"tb\" style=\"font-size:14px\" text-anchor=\"middle\" x=\"130.0\" y=\"167.0\"><tspan dy=\"-0.62em\" x=\"130.0\">THE</tspan><tspan dy=\"1.25em\" x=\"130.0\">the contract, the sun</tspan></text><line class=\"ln\" x1=\"560\" x2=\"650\" y1=\"98\" y2=\"98\"></line><text class=\"tr\" style=\"font-size:11px\" text-anchor=\"start\" x=\"612\" y=\"88\"><tspan dy=\"0.00em\" x=\"612\">Chưa / lần đầu</tspan></text><polyline class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\" points=\"650,98 650,140\"></polyline><rect class=\"nq\" height=\"52\" rx=\"10\" width=\"260\" x=\"500\" y=\"142\"></rect><text class=\"tx\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"630.0\" y=\"168.0\"><tspan dy=\"0.00em\" x=\"630.0\">Đếm được SỐ ÍT?</tspan></text><polyline class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\" points=\"560,194 560,230\"></polyline><text class=\"tg\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"590\" y=\"216\"><tspan dy=\"0.00em\" x=\"590\">Có</tspan></text><rect class=\"ng\" height=\"50\" rx=\"10\" width=\"200\" x=\"450\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:14px\" text-anchor=\"middle\" x=\"550.0\" y=\"257.0\"><tspan dy=\"-0.62em\" x=\"550.0\">A / AN</tspan><tspan dy=\"1.25em\" x=\"550.0\">a deal, an hour</tspan></text><polyline class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\" points=\"700,194 700,230\"></polyline><text class=\"tr\" style=\"font-size:11px\" text-anchor=\"start\" x=\"718\" y=\"216\"><tspan dy=\"0.00em\" x=\"718\">Không</tspan></text><rect class=\"ng\" height=\"50\" rx=\"10\" width=\"110\" x=\"660\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"715.0\" y=\"257.0\"><tspan dy=\"-0.62em\" x=\"715.0\">Ø hoặc</tspan><tspan dy=\"1.25em\" x=\"715.0\">some</tspan></text><rect class=\"nb\" height=\"118\" rx=\"12\" width=\"420\" x=\"20\" y=\"230\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"289.0\"><tspan dy=\"-1.86em\" x=\"230.0\">Dùng THE luôn luôn:</tspan><tspan dy=\"1.25em\" x=\"230.0\">• so sánh nhất (the best)   • duy nhất (the sun, the Constitution)</tspan><tspan dy=\"1.25em\" x=\"230.0\">• sông, biển, dãy núi, nhóm đảo (the Mekong, the Alps)</tspan><tspan dy=\"1.25em\" x=\"230.0\">• nhóm người (the rich)   • the + tên tổ chức có “of” (the Court of Appeal)</tspan></text></svg></div><figcaption>Đi từ trên xuống: người nghe đã biết cái nào chưa? Nếu chưa, danh từ có đếm được và số ít không?</figcaption></figure><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Mạo từ</th><th>Khi nào dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>a</div></td><td><div>Đứng trước danh từ đếm được số ít, bắt đầu bằng ÂM phụ âm; mang nghĩa \"một, chưa xác định\"</div></td><td><div>a book, a university <span class=\"vi\">(âm /juː/)</span>, a European city</div></td></tr><tr><td><div>an</div></td><td><div>Đứng trước danh từ đếm được số ít, bắt đầu bằng ÂM nguyên âm</div></td><td><div>an apple, an hour <span class=\"vi\">(h câm)</span>, an MBA <span class=\"vi\">(âm /em/)</span></div></td></tr><tr><td><div>the</div></td><td><div>Danh từ đã xác định: nhắc lại lần 2, duy nhất, có cụm bổ nghĩa xác định, hoặc cả hai bên đều biết đang nói vật nào</div></td><td><div>The book you gave me is great. The sun rises in the East.</div></td></tr><tr><td><div>Ø <span class=\"vi\">(không mạo từ)</span></div></td><td><div>Danh từ số nhiều/không đếm được nói chung; tên riêng; bữa ăn; môn thể thao; phương tiện đi lại sau \"by\"</div></td><td><div>I like dogs. Have breakfast. Play football. Go by bus.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo phân biệt a/an</strong><p>Không dựa vào chữ cái mà dựa vào CÁCH ĐỌC: an hour <span class=\"vi\">(h câm→ nguyên âm)</span>, a university <span class=\"vi\">(u đọc là /juː/ → coi như phụ âm)</span>.</p></div></aside><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Người Anh - Mỹ dùng mạo từ khác nhau ở một số từ: Mỹ nói \"go to the hospital\", Anh nói \"go to hospital\" <span class=\"vi\">(không mạo từ khi đi khám/nằm viện)</span>.</p></div></aside></section><section class=\"topic\" id=\"t-a4\"><h2>1.4  Sự hòa hợp giữa chủ ngữ và động từ</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hai chủ ngữ nối bằng \"and\"</div></td><td><div>→ động từ số nhiều</div></td><td><div>Tom and Mary are here.</div></td></tr><tr><td><div>each / every + N số ít</div></td><td><div>→ động từ số ít</div></td><td><div>Every student has a book.</div></td></tr><tr><td><div>Danh từ tập hợp (family, team, class...)</div></td><td><div>số ít nếu coi là 1 khối; số nhiều nếu nhấn mạnh từng thành viên</div></td><td><div>My family is happy. / My family are watching TV <span class=\"vi\">(mỗi người 1 việc)</span>.</div></td></tr><tr><td><div>a number of + N</div></td><td><div>→ động từ số NHIỀU <span class=\"vi\">(nhiều)</span></div></td><td><div>A number of students are absent.</div></td></tr><tr><td><div>the number of + N</div></td><td><div>→ động từ số ÍT <span class=\"vi\">(con số)</span></div></td><td><div>The number of students is 30.</div></td></tr><tr><td><div>Neither...nor / Either...or</div></td><td><div>động từ hòa hợp với chủ ngữ đứng GẦN NHẤT</div></td><td><div>Neither the teacher nor the students are ready.</div></td></tr><tr><td><div>Danh từ chỉ môn học/bệnh/quốc gia có đuôi -s (maths, physics, news, the USA)</div></td><td><div>→ động từ số ít</div></td><td><div>Maths is my favorite subject. The news is good.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo phân biệt a number of / the number of</strong><p>\"A number of\" = một SỐ <span class=\"vi\">(nhiều)</span> → chia số nhiều. \"The number of\" = CON SỐ, SỐ LƯỢNG <span class=\"vi\">(một khái niệm số ít)</span> → chia số ít.</p></div></aside></section><section class=\"topic\" id=\"t-a4x\"><h2>1.5  Hòa hợp chủ vị: các trường hợp khó</h2><p>Quy tắc gốc: chủ ngữ số ít → động từ số ít; số nhiều → số nhiều. Khó là khi chủ ngữ “trông” như một kiểu nhưng thật ra là kiểu khác. Bảng dưới gom các bẫy hay gặp nhất trong văn bản công việc.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Chia thế nào</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>A + as well as / along with / together with / in addition to + B</div></td><td><div>Theo A <span class=\"vi\">(từ đầu)</span>. Phần “as well as B” chỉ là phụ chú.</div></td><td><div>The director, <strong>as well as</strong> his assistants, <strong>is</strong> attending.</div></td></tr><tr><td><div>Either A or B / Neither A nor B / Not only A but also B</div></td><td><div>Theo chủ ngữ GẦN động từ nhất (B).</div></td><td><div>Neither the manager nor the <strong>employees</strong> were told.</div></td></tr><tr><td><div>A or B <span class=\"vi\">(không có either)</span></div></td><td><div>Theo B, giống trên.</div></td><td><div>The lawyer or the clients <strong>are</strong> here.</div></td></tr><tr><td><div>Danh từ tập hợp: team, committee, board, staff, family, government</div></td><td><div>Anh-Anh: số ít khi cả nhóm làm một việc; số nhiều khi nhấn từng thành viên. Anh-Mỹ gần như luôn số ít.</div></td><td><div>The board <strong>has</strong> approved. / The board <strong>are</strong> divided.</div></td></tr><tr><td><div>The + tính từ (the rich, the poor, the elderly)</div></td><td><div>Số nhiều <span class=\"vi\">(nghĩa là “những người…”)</span>.</div></td><td><div>The elderly <strong>need</strong> more care.</div></td></tr><tr><td><div>Số tiền, khoảng thời gian, khoảng cách, cân nặng <span class=\"vi\">(coi như MỘT khối)</span></div></td><td><div>Số ít</div></td><td><div>Ten thousand dollars <strong>is</strong> a lot. / Two weeks <strong>is</strong> enough.</div></td></tr><tr><td><div>Môn học, bệnh có đuôi -s: news, physics, economics, mathematics, measles</div></td><td><div>Số ít</div></td><td><div>The news <strong>is</strong> good. / Economics <strong>is</strong> difficult.</div></td></tr><tr><td><div>Đồ vật có 2 phần: trousers, scissors, glasses, jeans</div></td><td><div>Số nhiều <span class=\"vi\">(trừ khi có “a pair of” → số ít)</span></div></td><td><div>My glasses <strong>are</strong> broken. / A pair of glasses <strong>is</strong> on the desk.</div></td></tr><tr><td><div>Phân số / phần trăm / some / most / all + of + N</div></td><td><div>Theo danh từ SAU “of”.</div></td><td><div>Half of the <strong>money is</strong> gone. / Half of the <strong>documents are</strong> missing.</div></td></tr><tr><td><div>A number of + N số nhiều  ≠  The number of + N</div></td><td><div>A number of → số nhiều.  The number of → số ít.</div></td><td><div>A number of cases <strong>are</strong> pending. / The number of cases <strong>is</strong> rising.</div></td></tr><tr><td><div>There is / There are</div></td><td><div>Theo danh từ ĐI SAU.</div></td><td><div>There <strong>is</strong> a problem. / There <strong>are</strong> two problems.</div></td></tr><tr><td><div>Mệnh đề / V-ing / to-V làm chủ ngữ</div></td><td><div>Số ít</div></td><td><div>Signing the contract <strong>takes</strong> time. / What he said <strong>was</strong> true.</div></td></tr><tr><td><div>Tên sách, công ty, quốc gia số nhiều</div></td><td><div>Số ít</div></td><td><div>“Les Misérables” <strong>is</strong> long. / The United States <strong>has</strong> …</div></td></tr><tr><td><div>One of the + N số nhiều</div></td><td><div>Số ít <span class=\"vi\">(chủ ngữ là “one”)</span></div></td><td><div>One of the clauses <strong>is</strong> invalid.</div></td></tr><tr><td><div>The same / each / every / either / neither / anyone / everyone / somebody</div></td><td><div>Số ít</div></td><td><div>Everyone <strong>has</strong> a role.</div></td></tr><tr><td><div>Mệnh đề quan hệ: who / which / that</div></td><td><div>Theo danh từ ĐỨNG TRƯỚC nó.</div></td><td><div>He is one of the lawyers who <strong>work</strong> here.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo xác định chủ ngữ thật</strong><p>Gạch bỏ mọi cụm xen giữa chủ ngữ và động từ <span class=\"vi\">(cụm “of …”, cụm có dấu phẩy, “who …”)</span>. Từ còn lại ở đầu câu mới là chủ ngữ.</p><p>The <strong>list</strong> of items <strong>is</strong> long. <span class=\"vi\">(không phải “items are”)</span></p></div></aside></section><section class=\"topic\" id=\"t-a5\"><h2>1.6  Câu hỏi Wh-, câu hỏi đuôi, câu hỏi gián tiếp</h2><h3>Câu hỏi Wh-</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>Wh-word + trợ động từ (do/does/did/have/will/can...) + S + V...?</code></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ hỏi</th><th>Dùng để</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>What</div></td><td><div>hỏi vật, việc</div></td><td><div>What is your name?</div></td></tr><tr><td><div>Who/Whom</div></td><td><div>hỏi người <span class=\"vi\">(chủ ngữ/tân ngữ)</span></div></td><td><div>Who called you? / Whom did you meet?</div></td></tr><tr><td><div>Where</div></td><td><div>hỏi nơi chốn</div></td><td><div>Where do you live?</div></td></tr><tr><td><div>When</div></td><td><div>hỏi thời gian</div></td><td><div>When did you arrive?</div></td></tr><tr><td><div>Why</div></td><td><div>hỏi lý do</div></td><td><div>Why are you late?</div></td></tr><tr><td><div>How</div></td><td><div>hỏi cách thức; kết hợp: how much/many/often/long...</div></td><td><div>How do you go to school? How often do you swim?</div></td></tr><tr><td><div>Which</div></td><td><div>hỏi để chọn lựa trong 1 số lựa chọn cụ thể</div></td><td><div>Which colour do you like, red or blue?</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Khi từ hỏi (who/what/which) LÀM CHỦ NGỮ của câu thì KHÔNG dùng trợ động từ do/does/did: Who broke the window? <span class=\"vi\">(KHÔNG nói \"Who did break...\")</span>.</p></div></aside><h3>Câu hỏi đuôi (Tag questions)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>Câu khẳng định, + trợ động từ phủ định + đại từ chủ ngữ?  |  Câu phủ định, + trợ động từ khẳng định + đại từ chủ ngữ?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Vế trước khẳng định → đuôi phủ định</div></td><td><div>She is a teacher, isn't she?</div></td></tr><tr><td><div>Vế trước phủ định → đuôi khẳng định</div></td><td><div>They don't like fish, do they?</div></td></tr><tr><td><div>Vế trước có động từ khuyết thiếu → lặp lại chính động từ đó</div></td><td><div>You can swim, can't you?</div></td></tr><tr><td><div>Câu mệnh lệnh → dùng \"will you?\"; Let's... → dùng \"shall we?\"</div></td><td><div>Close the door, will you? / Let's go, shall we?</div></td></tr><tr><td><div>I am... → đuôi là \"aren't I?\"</div></td><td><div>I am late, aren't I?</div></td></tr><tr><td><div>There is/are → lặp lại there</div></td><td><div>There is a cat, isn't there?</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo học nhanh câu hỏi đuôi</strong><p>Nhớ nguyên tắc \"NGƯỢC DẤU\": mệnh đề chính dương → đuôi âm, mệnh đề chính âm → đuôi dương. Từ phủ định ẩn (never, hardly, no one, rarely, seldom) làm câu chính mang nghĩa ÂM nên đuôi vẫn là khẳng định: He never smokes, does he?</p></div></aside><h3>Câu hỏi gián tiếp (Indirect questions) &amp; câu hỏi lồng</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>Could/Can/Do you know/tell me + (Wh-word/if/whether) + S + V...  (trật tự câu KHẲNG ĐỊNH, không đảo ngữ, không dùng do/does/did)</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Trường hợp</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Có từ hỏi Wh-</div></td><td><div>Do you know what time it is? <span class=\"vi\">(KHÔNG nói \"what time is it\")</span></div></td></tr><tr><td><div>Câu hỏi Yes/No → thêm if/whether</div></td><td><div>I wonder if/whether he is coming.</div></td></tr><tr><td><div>Giữ nguyên thì, chỉ đổi trật tự từ + bỏ trợ động từ do/does/did</div></td><td><div>Could you tell me where she lives? <span class=\"vi\">(she lives — không đảo does she live)</span></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Lỗi hay gặp nhất</strong><p>Học sinh hay giữ nguyên trật tự đảo ngữ của câu hỏi trực tiếp. Hãy nhớ: sau \"do you know / could you tell me...\" luôn là trật tự câu KỂ (S + V), không phải trật tự câu hỏi.</p></div></aside></section><section class=\"topic\" id=\"t-a5x\"><h2>1.7  Câu hỏi đuôi: các trường hợp đặc biệt</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Câu hỏi đuôi</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Câu khẳng định</div></td><td><div>dùng đuôi PHỦ ĐỊNH</div></td><td><div>You <strong>are</strong> a lawyer, <strong>aren't you</strong>?</div></td></tr><tr><td><div>Câu phủ định</div></td><td><div>dùng đuôi KHẲNG ĐỊNH</div></td><td><div>He <strong>didn't</strong> sign, <strong>did he</strong>?</div></td></tr><tr><td><div>I am</div></td><td><div>aren't I</div></td><td><div>I'm late, <strong>aren't I</strong>?</div></td></tr><tr><td><div>Let's …</div></td><td><div>shall we</div></td><td><div>Let's start, <strong>shall we</strong>?</div></td></tr><tr><td><div>Mệnh lệnh</div></td><td><div>will you / won't you</div></td><td><div>Close the door, <strong>will you</strong>?</div></td></tr><tr><td><div>Mời lịch sự</div></td><td><div>won't you</div></td><td><div>Have a seat, <strong>won't you</strong>?</div></td></tr><tr><td><div>Everyone, someone, nobody, no one</div></td><td><div>they</div></td><td><div>Everyone agreed, <strong>didn't they</strong>?</div></td></tr><tr><td><div>Nothing, something, everything, this, that</div></td><td><div>it</div></td><td><div>Nothing happened, <strong>did it</strong>?</div></td></tr><tr><td><div>Từ phủ định: never, hardly, rarely, seldom, scarcely, barely, nobody</div></td><td><div>Coi như câu phủ định → đuôi KHẲNG ĐỊNH</div></td><td><div>She <strong>rarely</strong> complains, <strong>does she</strong>?</div></td></tr><tr><td><div>I wish …</div></td><td><div>may</div></td><td><div>I wish to leave, <strong>may I</strong>?</div></td></tr><tr><td><div>Have là động từ chính <span class=\"vi\">(sở hữu, Anh-Anh)</span></div></td><td><div>have / haven't</div></td><td><div>He has a car, <strong>hasn't he</strong>?</div></td></tr><tr><td><div>There + be</div></td><td><div>there</div></td><td><div>There is a problem, <strong>isn't there</strong>?</div></td></tr><tr><td><div>Must <span class=\"vi\">(suy đoán / bắt buộc)</span></div></td><td><div>mustn't <span class=\"vi\">(bắt buộc)</span> / needn't / theo động từ sau must</div></td><td><div>You must go, <strong>mustn't you</strong>?</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Ngữ điệu</span><div class=\"box\"><p>Đuôi XUỐNG giọng = bạn chắc chắn, chỉ xin xác nhận. Đuôi LÊN giọng = bạn thật sự chưa chắc, đang hỏi.</p></div></aside></section><section class=\"topic\" id=\"t-a6\"><h2>1.8  So sánh: bằng, hơn, nhất, kép, càng...càng</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại tính từ</th><th>Quy tắc</th><th>Ví dụ / ghi chú</th></tr></thead><tbody><tr><td><div>Tính từ 1 âm tiết</div></td><td><div>adj + er / adj + est</div></td><td><div>tall → taller → tallest</div></td></tr><tr><td><div>Tính từ 1 âm tiết tận cùng phụ âm-nguyên âm-phụ âm</div></td><td><div>gấp đôi phụ âm cuối</div></td><td><div>big → bigger → biggest</div></td></tr><tr><td><div>Tính từ 2 âm tiết tận cùng -y</div></td><td><div>đổi y→i, thêm -er/-est</div></td><td><div>happy → happier → happiest</div></td></tr><tr><td><div>Tính từ 2 âm tiết trở lên <span class=\"vi\">(không tận cùng -y)</span></div></td><td><div>more/most + adj</div></td><td><div>beautiful → more beautiful → most beautiful</div></td></tr><tr><td><div>Bất quy tắc</div></td><td><div>good→better→best; bad→worse→worst; far→farther/further→farthest/furthest; little→less→least; many/much→more→most</div></td><td><div></div></td></tr></tbody></table></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>So sánh bằng</div></td><td><div>as + adj/adv + as</div></td><td><div>She is as tall as her brother.</div></td></tr><tr><td><div>So sánh hơn</div></td><td><div>adj-er/more + adj + than</div></td><td><div>This film is more interesting than that one.</div></td></tr><tr><td><div>So sánh nhất</div></td><td><div>the + adj-est/most + adj (+ in/of...)</div></td><td><div>It is the most expensive shop in town.</div></td></tr><tr><td><div>So sánh kép <span class=\"vi\">(càng ngày càng)</span></div></td><td><div>adj-er and adj-er / more and more + adj</div></td><td><div>It's getting colder and colder.</div></td></tr><tr><td><div>Càng...càng...</div></td><td><div>The + so sánh hơn + S + V, the + so sánh hơn + S + V</div></td><td><div>The more you practice, the better you get.</div></td></tr><tr><td><div>So sánh với so/such...that</div></td><td><div>so + adj/adv + that / such (a/an) + adj + N + that</div></td><td><div>The film was so boring that I fell asleep. It was such a boring film that I fell asleep.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt so...that và such...that</strong><p>\"so\" đi thẳng với tính từ/trạng từ (so + adj). \"such\" đi với DANH TỪ có tính từ bổ nghĩa phía trước (such + a/an + adj + N). Cả hai đều diễn tả nguyên nhân–kết quả \"đến nỗi mà\".</p></div></aside><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt too và enough</strong><p>too + adj/adv (+ for sb) + to V: quá... <span class=\"vi\">(mang nghĩa KHÔNG THỂ làm gì đó)</span> — This box is too heavy for me to carry.</p><p>adj/adv + enough (+ for sb) + to V: đủ... để làm gì <span class=\"vi\">(khẳng định khả năng)</span> — She is old enough to drive. <span class=\"vi\">(enough đứng SAU tính từ, nhưng đứng TRƯỚC danh từ: enough time)</span></p></div></aside></section><section class=\"topic\" id=\"t-a7\"><h2>1.9  Tính từ và trạng từ: vị trí, mức độ, cặp dễ nhầm</h2><p>Tính từ miêu tả DANH TỪ <span class=\"vi\">(cái gì, như thế nào)</span>. Trạng từ miêu tả ĐỘNG TỪ, TÍNH TỪ, TRẠNG TỪ KHÁC hoặc cả câu <span class=\"vi\">(làm như thế nào, khi nào, mức độ)</span>.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th></th><th>Tính từ (adj)</th><th>Trạng từ (adv)</th></tr></thead><tbody><tr><td><div>Bổ nghĩa cho</div></td><td><div>Danh từ, đại từ</div></td><td><div>Động từ, tính từ, trạng từ khác, cả câu</div></td></tr><tr><td><div>Trả lời</div></td><td><div>What kind? Như thế nào?</div></td><td><div>How? When? Where? To what degree?</div></td></tr><tr><td><div>Vị trí</div></td><td><div>Trước danh từ; sau be / seem / look / feel / become</div></td><td><div>Sau động từ thường; trước tính từ; đầu hoặc cuối câu</div></td></tr><tr><td><div>Ví dụ</div></td><td><div>a <strong>clear</strong> answer · The clause is <strong>clear</strong>.</div></td><td><div>answer <strong>clearly</strong> · <strong>extremely</strong> clear</div></td></tr></tbody></table></div><h3>Cặp dễ nhầm</h3><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Từ</th><th>Nghĩa</th><th>Từ gần giống</th><th>Nghĩa</th></tr></thead><tbody><tr><td><div>hard (adj/adv)</div></td><td><div>khó / chăm chỉ, hết sức</div></td><td><div>hardly</div></td><td><div>hầu như không</div></td></tr><tr><td><div>late (adj/adv)</div></td><td><div>muộn</div></td><td><div>lately</div></td><td><div>gần đây</div></td></tr><tr><td><div>near</div></td><td><div>gần</div></td><td><div>nearly</div></td><td><div>gần như, suýt</div></td></tr><tr><td><div>high</div></td><td><div>cao <span class=\"vi\">(vị trí)</span></div></td><td><div>highly</div></td><td><div>rất, ở mức cao (highly recommended)</div></td></tr><tr><td><div>free</div></td><td><div>miễn phí / rảnh</div></td><td><div>freely</div></td><td><div>tự do, thoải mái</div></td></tr><tr><td><div>deep</div></td><td><div>sâu</div></td><td><div>deeply</div></td><td><div>rất, sâu sắc (deeply concerned)</div></td></tr><tr><td><div>fast (adj/adv)</div></td><td><div>nhanh <span class=\"vi\">(không có “fastly”)</span></div></td><td><div>—</div></td><td><div>—</div></td></tr><tr><td><div>good (adj)</div></td><td><div>tốt</div></td><td><div>well (adv)</div></td><td><div>tốt (She works well)</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Tính từ nhưng đuôi -ly</strong><p>friendly, lovely, costly, lonely, likely, elderly, silly, early là TÍNH TỪ. Không có “friendlyly”. Muốn nói “một cách thân thiện” → <strong>in a friendly way</strong>.</p></div></aside><h3>Tính từ trạng thái sau động từ liên kết</h3><p>Sau be, seem, look, feel, sound, taste, smell, become, get, stay, remain → dùng TÍNH TỪ, không dùng trạng từ.</p><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>The offer sounds well.</div><div class=\"good\"><span>✓</span>The offer sounds <strong>good</strong>.</div><div class=\"why\">Sound là động từ liên kết, đi với tính từ.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>She felt badly about it.</div><div class=\"good\"><span>✓</span>She felt <strong>bad</strong> about it.</div><div class=\"why\">Feel + tính từ khi nói cảm xúc.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>He looks happily.</div><div class=\"good\"><span>✓</span>He looks <strong>happy</strong>.</div><div class=\"why\">Look <span class=\"vi\">(trông có vẻ)</span> + tính từ.</div></div></div><h3>Tính từ có mức độ (gradable) và không có mức độ (ungradable)</h3><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại</th><th>Ví dụ</th><th>Từ nhấn mạnh dùng được</th></tr></thead><tbody><tr><td><div>Gradable <span class=\"vi\">(có mức độ)</span></div></td><td><div>good, big, cold, tired, difficult, interesting</div></td><td><div>very, quite, rather, extremely, fairly, slightly, a bit</div></td></tr><tr><td><div>Ungradable / cực đoan</div></td><td><div>perfect, excellent, impossible, exhausted, freezing, terrible, fascinating</div></td><td><div>absolutely, completely, totally, utterly, really <span class=\"vi\">(KHÔNG dùng “very”)</span></div></td></tr></tbody></table></div><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>very + gradable   (very difficult)</code><code>absolutely + ungradable   (absolutely impossible)</code></div></section><section class=\"topic\" id=\"t-a8\"><h2>1.10  Cụm danh từ: thứ tự từ trước &amp; sau danh từ</h2><p>Trong công việc, bạn cần đọc và viết những cụm danh từ dài như “the three main legal risks associated with the project”. Hiểu cấu trúc thì không bị ngợp.</p><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>Hạn định từ + ý kiến + kích cỡ + tuổi + hình dạng + màu + nguồn gốc + chất liệu + mục đích + DANH TỪ</code></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Vị trí</th><th>Thành phần</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>1. Hạn định từ</div></td><td><div>a / the / my / this / some / three</div></td><td><div><strong>the</strong> / <strong>my</strong> / <strong>those</strong></div></td></tr><tr><td><div>2. Ý kiến</div></td><td><div>nice, important, useful</div></td><td><div>a <strong>useful</strong></div></td></tr><tr><td><div>3. Kích cỡ · tuổi · hình dạng</div></td><td><div>large, old, round</div></td><td><div>a useful <strong>large old</strong></div></td></tr><tr><td><div>4. Màu · nguồn gốc · chất liệu</div></td><td><div>blue, Vietnamese, wooden</div></td><td><div>a <strong>Vietnamese wooden</strong></div></td></tr><tr><td><div>5. Danh từ bổ nghĩa + danh từ chính</div></td><td><div>legal, contract, service</div></td><td><div>a <strong>commercial legal</strong> document</div></td></tr><tr><td><div>6. Sau danh từ</div></td><td><div>cụm giới từ / mệnh đề quan hệ / V-ing / V3 / to-V</div></td><td><div>the risks <strong>associated with the project</strong> · the meeting <strong>to be held on Friday</strong></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Nhớ nhanh thứ tự tính từ: OSASCOMP</strong><p><strong>O</strong>pinion – <strong>S</strong>ize – <strong>A</strong>ge – <strong>S</strong>hape – <strong>C</strong>olour – <strong>O</strong>rigin – <strong>M</strong>aterial – <strong>P</strong>urpose. Ví dụ: a beautiful small old round white French porcelain tea cup. Thực tế chỉ dùng 2–3 tính từ liền nhau.</p></div></aside><aside class=\"note\"><span class=\"chip\">Danh từ làm tính từ</span><div class=\"box\"><p>Danh từ đứng trước danh từ luôn ở dạng SỐ ÍT: a three-year contract <span class=\"vi\">(không “three-years”)</span>, a ten-page report, a five-star hotel.</p></div></aside></section><section class=\"topic\" id=\"t-a9\"><h2>1.11  have got, get, got: ba chữ hay gặp nhất khẩu ngữ</h2><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Cách dùng</th><th>Cấu trúc</th><th>Ví dụ</th><th>Ghi chú</th></tr></thead><tbody><tr><td><div>Sở hữu</div></td><td><div>have got + N</div></td><td><div>I've got a new laptop.</div></td><td><div>= I have. Thân mật, Anh-Anh.</div></td></tr><tr><td><div>Bắt buộc</div></td><td><div>have got to + V</div></td><td><div>I've got to go.</div></td><td><div>Nói nhanh: gotta. Trang trọng hơn: I must / I have to.</div></td></tr><tr><td><div>Trở nên</div></td><td><div>get + adj</div></td><td><div>It got dark. They got married. I got lost.</div></td><td><div>Quá trình thay đổi.</div></td></tr><tr><td><div>Nhận</div></td><td><div>get + N</div></td><td><div>I got an email from my boss.</div></td><td><div>= receive.</div></td></tr><tr><td><div>Mua, kiếm</div></td><td><div>get + N</div></td><td><div>Where did you get that?</div></td><td><div>= buy / obtain.</div></td></tr><tr><td><div>Hiểu</div></td><td><div>get it</div></td><td><div>“Do you see?” “Yes, I got it.”</div></td><td><div>= understand.</div></td></tr><tr><td><div>Đến nơi</div></td><td><div>get to / get home</div></td><td><div>We got home late.</div></td><td><div>= arrive.</div></td></tr><tr><td><div>Nhờ ai làm</div></td><td><div>get + O + to V</div></td><td><div>I got the mechanic to check the brakes.</div></td><td><div>= persuade / arrange.</div></td></tr><tr><td><div>Bị động nhẹ</div></td><td><div>get + V3</div></td><td><div>He got fired. She got promoted.</div></td><td><div>Đời thường, hay dùng với chuyện bất ngờ / bất lợi.</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Quá khứ phân từ của get</span><div class=\"box\"><p>Anh-Anh: get → got → got. Anh-Mỹ: get → got → <strong>gotten</strong> <span class=\"vi\">(nghĩa “đã trở nên / đã nhận được”)</span>. Nhưng “have got” <span class=\"vi\">(sở hữu)</span> vẫn dùng got ở cả hai: I've got a car.</p></div></aside><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Trong văn bản trang trọng, đừng dùng get</strong><p>Thay get bằng động từ chính xác: get → obtain / receive / become; get a reply → receive a reply; get better → improve; get to → reach / arrive at.</p></div></aside></section><section class=\"topic\" id=\"t-a10\"><h2>1.12  like, love, would like: mức độ và cấu trúc</h2><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Cách nói</th><th>Nghĩa</th><th>Cấu trúc theo sau</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>like</div></td><td><div>thích <span class=\"vi\">(nhẹ)</span></div></td><td><div>V-ing hoặc to-V</div></td><td><div>I like reading. · I like to wash up straight away <span class=\"vi\">(vì thấy nên làm)</span>.</div></td></tr><tr><td><div>love</div></td><td><div>rất thích / yêu</div></td><td><div>V-ing hoặc to-V</div></td><td><div>I love legal research. · I'd love to hear your view.</div></td></tr><tr><td><div>would like</div></td><td><div>muốn <span class=\"vi\">(lịch sự)</span></div></td><td><div>LUÔN to-V</div></td><td><div>I would like to invite you to the meeting.</div></td></tr><tr><td><div>would love</div></td><td><div>rất muốn / rất sẵn lòng</div></td><td><div>LUÔN to-V</div></td><td><div>I would love to help with this draft.</div></td></tr><tr><td><div>want</div></td><td><div>muốn <span class=\"vi\">(thẳng, hơi cộc)</span></div></td><td><div>to-V</div></td><td><div>Tránh với khách hàng, cấp trên, văn bản.</div></td></tr></tbody></table></div><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>I very like this firm.</div><div class=\"good\"><span>✓</span>I like this firm <strong>very much / a lot</strong>.</div><div class=\"why\">Không đặt “very” trước động từ.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>I would like going.</div><div class=\"good\"><span>✓</span>I would like <strong>to go</strong>.</div><div class=\"why\">Would like + to-V, không V-ing.</div></div></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Công thức lịch sự trong công việc</strong><p>want → would like · I want to ask → I would like to ask · Do you want…? → Would you like…?</p></div></aside></section>", "topics": [{"id": "t-a1", "title": "Đại từ nhân xưng, tính từ sở hữu, đại từ phản thân", "number": "1.1"}, {"id": "t-a2", "title": "Danh từ đếm được – không đếm được & lượng từ", "number": "1.2"}, {"id": "t-a3", "title": "Mạo từ: a / an / the / mạo từ Ø (không dùng)", "number": "1.3"}, {"id": "t-a4", "title": "Sự hòa hợp giữa chủ ngữ và động từ", "number": "1.4"}, {"id": "t-a4x", "title": "Hòa hợp chủ vị: các trường hợp khó", "number": "1.5"}, {"id": "t-a5", "title": "Câu hỏi Wh-, câu hỏi đuôi, câu hỏi gián tiếp", "number": "1.6"}, {"id": "t-a5x", "title": "Câu hỏi đuôi: các trường hợp đặc biệt", "number": "1.7"}, {"id": "t-a6", "title": "So sánh: bằng, hơn, nhất, kép, càng...càng", "number": "1.8"}, {"id": "t-a7", "title": "Tính từ và trạng từ: vị trí, mức độ, cặp dễ nhầm", "number": "1.9"}, {"id": "t-a8", "title": "Cụm danh từ: thứ tự từ trước & sau danh từ", "number": "1.10"}, {"id": "t-a9", "title": "have got, get, got: ba chữ hay gặp nhất khẩu ngữ", "number": "1.11"}, {"id": "t-a10", "title": "like, love, would like: mức độ và cấu trúc", "number": "1.12"}], "number": 1}, {"id": "t-b", "title": "Thì của động từ (Tenses)", "html": "<details class=\"atlas\"><summary>Bản đồ trực quan 12 thì <span>12 thẻ đối chiếu</span></summary><div class=\"tense-chapter-intro\"><h2>12 thì tiếng Anh — Bản đồ trực quan</h2><p>Bản đồ tổng quan để đối chiếu. Mở từng mục trong tài liệu bên dưới để đọc cách dùng đầy đủ. Các sơ đồ chỉ minh họa trường hợp điển hình, không thay thế toàn bộ quy tắc về thì và thể.</p><div class=\"tense-legend\"><span><i class=\"lg-blue\"></i>Mốc tham chiếu</span><span><i class=\"lg-green\"></i>Quá trình / sự kéo dài</span><span><i class=\"lg-orange\"></i>Sự kiện / hoàn tất</span><span><i class=\"lg-red\"></i>Lỗi dễ nhầm</span><span><i class=\"lg-violet\"></i>Mẹo ghi nhớ</span></div><div class=\"tense-jump\"><a href=\"#tense-present\">Nhóm hiện tại</a><a href=\"#tense-past\">Nhóm quá khứ</a><a href=\"#tense-future\">Nhóm tương lai</a><a href=\"#tense-contrast\">So sánh nhanh</a></div></div><section class=\"tense-section\" id=\"tense-present\"><h2>Nhóm hiện tại</h2><div class=\"tense-grid\"><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">01/12</span><h3>Present Simple</h3><div class=\"tense-vn\">Hiện tại đơn</div></div><p class=\"tense-meaning\">Thói quen, sự thật, lịch trình</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><circle cx=\"65\" cy=\"43\" r=\"6\" fill=\"#18864b\"/><circle cx=\"109\" cy=\"43\" r=\"6\" fill=\"#18864b\"/><circle cx=\"153\" cy=\"43\" r=\"6\" fill=\"#18864b\"/><circle cx=\"233\" cy=\"43\" r=\"6\" fill=\"#18864b\"/><circle cx=\"282\" cy=\"43\" r=\"6\" fill=\"#18864b\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + V(s/es)</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>usually · often · every day</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I review contracts every day.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Không dùng tiếp diễn cho thói quen ổn định.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">02/12</span><h3>Present Continuous</h3><div class=\"tense-vn\">Hiện tại tiếp diễn</div></div><p class=\"tense-meaning\">Việc đang diễn ra hoặc tình huống tạm thời</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><rect x=\"160\" y=\"35\" width=\"63\" height=\"16\" rx=\"8\" fill=\"#18864b\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + am/is/are + V-ing</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>now · at the moment · currently</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I am reviewing a contract now.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Có thể chỉ kế hoạch tương lai đã sắp xếp.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">03/12</span><h3>Present Perfect</h3><div class=\"tense-vn\">Hiện tại hoàn thành</div></div><p class=\"tense-meaning\">Kết quả, trải nghiệm hay sự việc liên quan hiện tại</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><circle cx=\"90\" cy=\"43\" r=\"8\" fill=\"#c26a1d\"/><path d=\"M101 43 Q140 12 180 43\" fill=\"none\" stroke=\"#18864b\" stroke-width=\"4\" stroke-dasharray=\"5 5\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + have/has + V3</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>already · yet · ever · so far</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I have finished the report.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Không mặc định dùng với mốc quá khứ đã kết thúc như yesterday.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">04/12</span><h3>Present Perfect Continuous</h3><div class=\"tense-vn\">Hiện tại hoàn thành tiếp diễn</div></div><p class=\"tense-meaning\">Quá trình từ trước tới nay, nhấn mạnh thời lượng</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><rect x=\"75\" y=\"35\" width=\"113\" height=\"16\" rx=\"8\" fill=\"#18864b\"/><circle cx=\"188\" cy=\"43\" r=\"6\" fill=\"#c26a1d\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + have/has been + V-ing</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>for · since · all morning · lately</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I have been reading for two hours.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Nhiều động từ trạng thái thường không dùng dạng tiếp diễn.</span></div></article></div></section><section class=\"tense-section\" id=\"tense-past\"><h2>Nhóm quá khứ</h2><div class=\"tense-grid\"><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">05/12</span><h3>Past Simple</h3><div class=\"tense-vn\">Quá khứ đơn</div></div><p class=\"tense-meaning\">Sự kiện ở thời gian quá khứ xác định</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><circle cx=\"87\" cy=\"43\" r=\"9\" fill=\"#c26a1d\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + V2/ed</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>yesterday · last week · ago · in 2020</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>We signed the agreement yesterday.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Có mốc quá khứ không đồng nghĩa luôn luôn phải dùng quá khứ đơn.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">06/12</span><h3>Past Continuous</h3><div class=\"tense-vn\">Quá khứ tiếp diễn</div></div><p class=\"tense-meaning\">Hành động đang diễn ra tại một thời điểm quá khứ</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><rect x=\"62\" y=\"35\" width=\"82\" height=\"16\" rx=\"8\" fill=\"#18864b\"/><circle cx=\"118\" cy=\"43\" r=\"5\" fill=\"#c26a1d\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + was/were + V-ing</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>at 8 p.m. yesterday · while</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I was working when she called.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>when và while không tự quyết định thì; cần xem ý nghĩa.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">07/12</span><h3>Past Perfect</h3><div class=\"tense-vn\">Quá khứ hoàn thành</div></div><p class=\"tense-meaning\">Một việc đã xảy ra trước mốc quá khứ khác</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><circle cx=\"80\" cy=\"43\" r=\"8\" fill=\"#c26a1d\"/><circle cx=\"144\" cy=\"43\" r=\"7\" fill=\"#0071e3\"/><text x=\"80\" y=\"22\" text-anchor=\"middle\" font-size=\"11\">A</text><text x=\"144\" y=\"22\" text-anchor=\"middle\" font-size=\"11\">B</text></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + had + V3</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>by then · before · by the time</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>He had left before I arrived.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Không cần dùng trong mọi câu kể hai sự việc quá khứ.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">08/12</span><h3>Past Perfect Continuous</h3><div class=\"tense-vn\">Quá khứ hoàn thành tiếp diễn</div></div><p class=\"tense-meaning\">Quá trình kéo dài đến trước một mốc quá khứ</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><rect x=\"45\" y=\"35\" width=\"100\" height=\"16\" rx=\"8\" fill=\"#18864b\"/><circle cx=\"145\" cy=\"43\" r=\"7\" fill=\"#c26a1d\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + had been + V-ing</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>for · since · before + mốc quá khứ</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>She had been waiting for an hour when I arrived.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Nhấn quá trình hơn kết quả.</span></div></article></div></section><section class=\"tense-section\" id=\"tense-future\"><h2>Nhóm tương lai</h2><div class=\"tense-grid\"><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">09/12</span><h3>Future Simple</h3><div class=\"tense-vn\">Tương lai đơn</div></div><p class=\"tense-meaning\">Dự đoán, quyết định lúc nói, lời hứa</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><circle cx=\"275\" cy=\"43\" r=\"9\" fill=\"#c26a1d\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + will + V</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>I think · probably · tomorrow</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I will send the file tomorrow.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Không phải tất cả tương lai đều dùng will; còn be going to và hiện tại tiếp diễn.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">10/12</span><h3>Future Continuous</h3><div class=\"tense-vn\">Tương lai tiếp diễn</div></div><p class=\"tense-meaning\">Đang diễn ra vào một mốc tương lai</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><rect x=\"234\" y=\"35\" width=\"66\" height=\"16\" rx=\"8\" fill=\"#18864b\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + will be + V-ing</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>this time tomorrow · at 9 tomorrow</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I will be presenting at 9 tomorrow.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Thể hiện hành động đang diễn ra, không nhất thiết đã hoàn tất.</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">11/12</span><h3>Future Perfect</h3><div class=\"tense-vn\">Tương lai hoàn thành</div></div><p class=\"tense-meaning\">Hoàn tất trước mốc tương lai</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><circle cx=\"241\" cy=\"43\" r=\"8\" fill=\"#c26a1d\"/><circle cx=\"295\" cy=\"43\" r=\"7\" fill=\"#0071e3\"/><text x=\"295\" y=\"22\" text-anchor=\"middle\" font-size=\"11\">Mốc</text></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + will have + V3</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>by Friday · by the time</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>I will have finished by Friday.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>by là hạn chót, khác với until (kéo dài tới).</span></div></article><article class=\"tense-card\"><div class=\"tense-card-h\"><span class=\"tense-num\">12/12</span><h3>Future Perfect Continuous</h3><div class=\"tense-vn\">Tương lai hoàn thành tiếp diễn</div></div><p class=\"tense-meaning\">Quá trình kéo dài tới một mốc tương lai</p><div class=\"tense-graphic\"><svg viewBox=\"0 0 350 90\" role=\"img\" aria-label=\"Sơ đồ thời gian giản lược\"><text x=\"25\" y=\"82\" font-size=\"10\" fill=\"#69717d\">QUÁ KHỨ</text><text x=\"276\" y=\"82\" font-size=\"10\" fill=\"#69717d\">TƯƠNG LAI</text><line x1=\"22\" y1=\"43\" x2=\"328\" y2=\"43\" stroke=\"#a6abb4\" stroke-width=\"2\"/><line x1=\"188\" y1=\"20\" x2=\"188\" y2=\"66\" stroke=\"#0071e3\" stroke-width=\"2\"/><text x=\"188\" y=\"83\" text-anchor=\"middle\" font-size=\"11\" fill=\"#586170\">HIỆN TẠI</text><rect x=\"204\" y=\"35\" width=\"88\" height=\"16\" rx=\"8\" fill=\"#18864b\"/><circle cx=\"292\" cy=\"43\" r=\"6\" fill=\"#c26a1d\"/></svg></div><div class=\"tense-fact tense-form\"><strong>CÔNG THỨC</strong><code>S + will have been + V-ing</code></div><div class=\"tense-fact tense-clue\"><strong>DẤU HIỆU THƯỜNG GẶP</strong><span>by next month + for …</span></div><div class=\"tense-fact tense-example\"><strong>VÍ DỤ</strong><em>By June, I will have been working here for five years.</em></div><div class=\"tense-fact tense-caution\"><strong>CẦN PHÂN BIỆT</strong><span>Nhấn thời lượng tích lũy tới mốc tương lai.</span></div></article></div></section><section id=\"tense-contrast\" class=\"tense-compare\"><h2>Nhận diện và phân biệt nhanh</h2><p><b>Lưu ý học thuật:</b> các trạng từ thời gian là <em>gợi ý</em>, không phải công thức suy luận bắt buộc. Luôn xác định ý nghĩa và mốc tham chiếu trước khi chọn thì.</p><div class=\"tense-compare-grid\"><div><h3>Past Simple ↔ Present Perfect</h3><p><b>I sent the email yesterday.</b> — mốc quá khứ đã xác định.</p><p><b>I have sent the email.</b> — kết quả có liên quan hiện tại.</p></div><div><h3>Present Perfect ↔ Perfect Continuous</h3><p><b>I have written three pages.</b> — số lượng / kết quả.</p><p><b>I have been writing for two hours.</b> — thời lượng / quá trình.</p></div><div><h3>Past Simple ↔ Past Continuous</h3><p><b>She called while I was reading.</b> — sự kiện xen vào quá trình đang diễn ra.</p></div><div><h3>Will ↔ Be going to</h3><p><b>I’ll answer it.</b> — quyết định ngay lúc nói.</p><p><b>I’m going to visit him.</b> — dự định đã có trước.</p></div></div><div class=\"tense-memory\"><strong>MẸO GHI NHỚ</strong><p><b>Simple</b>: sự kiện / thói quen · <b>Continuous</b>: quá trình đang diễn ra · <b>Perfect</b>: nhìn một việc từ mốc tham chiếu · <b>Perfect Continuous</b>: nhấn quá trình kéo dài đến mốc tham chiếu.</p></div><h3>Tự kiểm tra</h3><ol><li>By next Friday, we ___ (complete) the report. <details><summary>Xem đáp án</summary>will have completed — hoàn tất trước hạn tương lai.</details></li><li>I ___ (work) here since 2020. <details><summary>Xem đáp án</summary>have worked / have been working — tùy sắc thái nhấn trạng thái hay quá trình.</details></li><li>When he arrived, I ___ (prepare) dinner. <details><summary>Xem đáp án</summary>was preparing — đang trong quá trình chuẩn bị tại thời điểm anh ấy đến.</details></li></ol></section></details><div class=\"panelintro\"><p>Tiếng Anh có 12 thì chính, chia làm 3 nhóm thời gian <span class=\"vi\">(hiện tại – quá khứ – tương lai)</span> x 4 khía cạnh <span class=\"vi\">(đơn – tiếp diễn – hoàn thành – hoàn thành tiếp diễn)</span>. Học theo NHÓM và luôn so sánh với thì \"hàng xóm\" của nó sẽ dễ nhớ hơn học rời rạc từng thì.</p></div><section class=\"topic\" id=\"t-b0\"><h2>2.1  Bản đồ 12 thì và đường thời gian</h2><p>Mọi thì đều được dựng từ HAI lựa chọn: MỐC thời gian <span class=\"vi\">(quá khứ / hiện tại / tương lai)</span> và DẠNG hành động <span class=\"vi\">(đơn / tiếp diễn / hoàn thành / hoàn thành tiếp diễn)</span>. Nhìn bảng một lần, rồi xem đường thời gian để thấy sự khác nhau.</p><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Bảng 12 thì: 4 dạng nhân 3 mốc thời gian\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 750 410\"><rect class=\"fa\" height=\"34\" rx=\"10\" width=\"200\" x=\"130\" y=\"4\"></rect><text class=\"tw\" text-anchor=\"middle\" x=\"230.0\" y=\"21.0\"><tspan dy=\"0.00em\" x=\"230.0\">Quá khứ</tspan></text><rect class=\"fa\" height=\"34\" rx=\"10\" width=\"200\" x=\"336\" y=\"4\"></rect><text class=\"tw\" text-anchor=\"middle\" x=\"436.0\" y=\"21.0\"><tspan dy=\"0.00em\" x=\"436.0\">Hiện tại</tspan></text><rect class=\"fa\" height=\"34\" rx=\"10\" width=\"200\" x=\"542\" y=\"4\"></rect><text class=\"tw\" text-anchor=\"middle\" x=\"642.0\" y=\"21.0\"><tspan dy=\"0.00em\" x=\"642.0\">Tương lai</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"122\" x=\"4\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"65.0\" y=\"86.0\"><tspan dy=\"-0.62em\" x=\"65.0\">Simple</tspan><tspan dy=\"1.25em\" x=\"65.0\">(đơn)</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"130\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"230.0\" y=\"74\"><tspan dy=\"0.00em\" x=\"230.0\">V2 / did + V</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"102\"><tspan dy=\"0.00em\" x=\"230.0\">I worked</tspan></text><rect class=\"na\" height=\"84\" rx=\"10\" width=\"200\" x=\"336\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"436.0\" y=\"74\"><tspan dy=\"0.00em\" x=\"436.0\">V / V(s,es)</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"436.0\" y=\"102\"><tspan dy=\"0.00em\" x=\"436.0\">I work</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"542\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"642.0\" y=\"74\"><tspan dy=\"0.00em\" x=\"642.0\">will + V</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"642.0\" y=\"102\"><tspan dy=\"0.00em\" x=\"642.0\">I will work</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"122\" x=\"4\" y=\"134\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"65.0\" y=\"176.0\"><tspan dy=\"-0.62em\" x=\"65.0\">Continuous</tspan><tspan dy=\"1.25em\" x=\"65.0\">(tiếp diễn)</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"130\" y=\"134\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"230.0\" y=\"164\"><tspan dy=\"0.00em\" x=\"230.0\">was/were + V-ing</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"192\"><tspan dy=\"0.00em\" x=\"230.0\">I was working</tspan></text><rect class=\"na\" height=\"84\" rx=\"10\" width=\"200\" x=\"336\" y=\"134\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"436.0\" y=\"164\"><tspan dy=\"0.00em\" x=\"436.0\">am/is/are + V-ing</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"436.0\" y=\"192\"><tspan dy=\"0.00em\" x=\"436.0\">I am working</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"542\" y=\"134\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"642.0\" y=\"164\"><tspan dy=\"0.00em\" x=\"642.0\">will be + V-ing</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"642.0\" y=\"192\"><tspan dy=\"0.00em\" x=\"642.0\">I will be working</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"122\" x=\"4\" y=\"224\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"65.0\" y=\"266.0\"><tspan dy=\"-0.62em\" x=\"65.0\">Perfect</tspan><tspan dy=\"1.25em\" x=\"65.0\">(hoàn thành)</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"130\" y=\"224\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"230.0\" y=\"254\"><tspan dy=\"0.00em\" x=\"230.0\">had + V3</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"282\"><tspan dy=\"0.00em\" x=\"230.0\">I had worked</tspan></text><rect class=\"na\" height=\"84\" rx=\"10\" width=\"200\" x=\"336\" y=\"224\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"436.0\" y=\"254\"><tspan dy=\"0.00em\" x=\"436.0\">have/has + V3</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"436.0\" y=\"282\"><tspan dy=\"0.00em\" x=\"436.0\">I have worked</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"542\" y=\"224\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"642.0\" y=\"254\"><tspan dy=\"0.00em\" x=\"642.0\">will have + V3</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"642.0\" y=\"282\"><tspan dy=\"0.00em\" x=\"642.0\">I will have worked</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"122\" x=\"4\" y=\"314\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"65.0\" y=\"356.0\"><tspan dy=\"-0.62em\" x=\"65.0\">Perfect continuous</tspan><tspan dy=\"1.25em\" x=\"65.0\">(hoàn thành tiếp diễn)</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"130\" y=\"314\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"230.0\" y=\"344\"><tspan dy=\"0.00em\" x=\"230.0\">had been + V-ing</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"230.0\" y=\"372\"><tspan dy=\"0.00em\" x=\"230.0\">I had been working</tspan></text><rect class=\"na\" height=\"84\" rx=\"10\" width=\"200\" x=\"336\" y=\"314\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"436.0\" y=\"344\"><tspan dy=\"0.00em\" x=\"436.0\">have/has been + V-ing</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"436.0\" y=\"372\"><tspan dy=\"0.00em\" x=\"436.0\">I have been working</tspan></text><rect class=\"nb\" height=\"84\" rx=\"10\" width=\"200\" x=\"542\" y=\"314\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"642.0\" y=\"344\"><tspan dy=\"0.00em\" x=\"642.0\">will have been + V-ing</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"642.0\" y=\"372\"><tspan dy=\"0.00em\" x=\"642.0\">I will have been working</tspan></text></svg></div><figcaption>Bảng 12 thì. Cột = mốc thời gian, hàng = dạng hành động. Cột giữa <span class=\"vi\">(hiện tại)</span> được tô màu vì dùng nhiều nhất.</figcaption></figure><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Công thức chọn thì trong 3 câu hỏi</strong><p>1) Mốc nào? <span class=\"vi\">(đã qua / đang / sẽ)</span>. 2) Việc ĐANG diễn ra hay đã XONG hay chỉ là một SỰ KIỆN? 3) Có liên quan tới mốc khác không? Nếu có <span class=\"vi\">(trước một mốc / tới một mốc)</span> → dùng thì hoàn thành.</p></div></aside></section><section class=\"topic\" id=\"t-b1\"><h2>2.2  Nhóm thì hiện tại</h2><h3>1. Hiện tại đơn (Present Simple)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + V(s/es)</code><code>(-) S + don't/doesn't + V</code><code>(?) Do/Does + S + V?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Thói quen, sự việc lặp đi lặp lại</div></td><td><div>I get up at 6 every day.</div></td></tr><tr><td><div>Sự thật hiển nhiên, chân lý</div></td><td><div>The Earth goes around the Sun.</div></td></tr><tr><td><div>Tình huống cố định, thường xuyên xảy ra <span class=\"vi\">(lịch trình, thời khóa biểu)</span></div></td><td><div>The train leaves at 6 p.m.</div></td></tr><tr><td><div>Trạng thái, cảm xúc, suy nghĩ <span class=\"vi\">(với nội động từ - stative verbs)</span></div></td><td><div>I like this song.</div></td></tr></tbody></table></div><p>Dấu hiệu nhận biết: always, usually, often, sometimes, rarely, never, every day/week..., once/twice a week...</p><h3>2. Hiện tại tiếp diễn (Present Continuous)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + am/is/are + V-ing</code><code>(-) S + am/is/are + not + V-ing</code><code>(?) Am/Is/Are + S + V-ing?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hành động đang xảy ra ngay lúc nói</div></td><td><div>Look! She is dancing.</div></td></tr><tr><td><div>Tình huống tạm thời <span class=\"vi\">(không phải mãi mãi)</span></div></td><td><div>I'm staying with my aunt this week.</div></td></tr><tr><td><div>Kế hoạch đã sắp xếp trong tương lai gần</div></td><td><div>We're having a party tonight.</div></td></tr><tr><td><div>Thói quen gây khó chịu <span class=\"vi\">(đi kèm always)</span></div></td><td><div>He's always losing his keys!</div></td></tr></tbody></table></div><p>Dấu hiệu: now, right now, at the moment, at present, Look!/Listen!</p><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Nội động từ (stative verbs: be, have <span class=\"vi\">(sở hữu)</span>, like, love, hate, want, need, know, understand, believe, belong to, seem, appear, remember...) thường KHÔNG chia ở dạng tiếp diễn vì chúng diễn tả trạng thái chứ không phải hành động.</p><p>Một số từ (think, have, look...) có thể chia tiếp diễn khi mang nghĩa HÀNH ĐỘNG: I think he is right <span class=\"vi\">(nghĩ = quan điểm)</span> &gt;&lt; I'm thinking about it <span class=\"vi\">(đang suy nghĩ = hành động)</span>.</p></div></aside><h3>3. Hiện tại hoàn thành (Present Perfect)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + have/has + V3/-ed</code><code>(-) S + haven't/hasn't + V3</code><code>(?) Have/Has + S + V3?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hành động xảy ra trong quá khứ nhưng không rõ/không quan trọng thời điểm chính xác</div></td><td><div>I have visited Japan twice.</div></td></tr><tr><td><div>Hành động bắt đầu trong quá khứ, kéo dài đến hiện tại</div></td><td><div>She has lived here since 2015.</div></td></tr><tr><td><div>Hành động vừa mới xảy ra, còn ảnh hưởng đến hiện tại</div></td><td><div>I have just finished my homework.</div></td></tr><tr><td><div>Trải nghiệm lần đầu tiên <span class=\"vi\">(kết hợp so sánh nhất)</span></div></td><td><div>It's the first time I've eaten sushi.</div></td></tr></tbody></table></div><p>Dấu hiệu: already, just, yet, ever, never, since, for, recently, so far, up to now</p><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt since và for</strong><p>since + MỐC thời gian (since 2015, since Monday, since I was young). for + KHOẢNG thời gian (for 3 years, for a long time, for ages).</p></div></aside><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt hiện tại hoàn thành và quá khứ đơn</strong><p>Quá khứ đơn: hành động đã kết thúc hẳn, có mốc thời gian cụ thể trong quá khứ (yesterday, last year, in 2010, ago).</p><p>Hiện tại hoàn thành: KHÔNG nói rõ mốc thời gian cụ thể, hoặc hành động còn liên quan/ảnh hưởng tới hiện tại. → I saw that film yesterday. <span class=\"vi\">(đã xong, có mốc rõ)</span> &gt;&lt; I have seen that film. <span class=\"vi\">(không rõ khi nào, chỉ là kinh nghiệm)</span>.</p></div></aside><h3>4. Hiện tại hoàn thành tiếp diễn (Present Perfect Continuous)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + have/has + been + V-ing</code><code>(-) S + haven't/hasn't + been + V-ing</code><code>(?) Have/Has + S + been + V-ing?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Nhấn mạnh QUÁ TRÌNH/khoảng thời gian của hành động kéo dài đến hiện tại <span class=\"vi\">(thường còn tiếp diễn)</span></div></td><td><div>I've been waiting for you for an hour!</div></td></tr><tr><td><div>Hành động vừa kết thúc gần đây, kết quả còn thấy được ở hiện tại</div></td><td><div>You look tired. Have you been running?</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt hiện tại hoàn thành và hiện tại hoàn thành tiếp diễn</strong><p>Hoàn thành ĐƠN nhấn mạnh KẾT QUẢ / số lượng (I've read 3 books this month).</p><p>Hoàn thành TIẾP DIỄN nhấn mạnh QUÁ TRÌNH, sự liên tục, thường trả lời cho câu hỏi \"How long...?\" <span class=\"vi\">(I've been reading this book for 3 hours — vẫn đang đọc, nhấn mạnh thời gian đọc)</span>.</p></div></aside></section><section class=\"topic\" id=\"t-b2\"><h2>2.3  Nhóm thì quá khứ</h2><h3>5. Quá khứ đơn (Past Simple)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + V2/-ed</code><code>(-) S + didn't + V (nguyên thể)</code><code>(?) Did + S + V (nguyên thể)?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hành động đã xảy ra và kết thúc trong quá khứ, có mốc thời gian rõ ràng</div></td><td><div>I visited my grandma last week.</div></td></tr><tr><td><div>Chuỗi hành động liên tiếp trong quá khứ <span class=\"vi\">(kể chuyện)</span></div></td><td><div>He got up, brushed his teeth and left.</div></td></tr><tr><td><div>Thói quen trong quá khứ <span class=\"vi\">(nay không còn)</span></div></td><td><div>When I was young, I played football every day.</div></td></tr></tbody></table></div><p>Dấu hiệu: yesterday, last night/week/year, ... ago, in + năm đã qua, when I was young</p><h3>6. Quá khứ tiếp diễn (Past Continuous)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + was/were + V-ing</code><code>(-) S + wasn't/weren't + V-ing</code><code>(?) Was/Were + S + V-ing?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hành động đang xảy ra tại 1 thời điểm xác định trong quá khứ</div></td><td><div>At 8 p.m. yesterday, I was doing my homework.</div></td></tr><tr><td><div>Hành động đang xảy ra thì hành động khác xen vào <span class=\"vi\">(dùng chung quá khứ đơn)</span></div></td><td><div>I was watching TV when the phone rang.</div></td></tr><tr><td><div>Hai hành động cùng xảy ra song song trong quá khứ</div></td><td><div>While I was cooking, my sister was cleaning.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo: when và while</strong><p>\"when\" + quá khứ đơn <span class=\"vi\">(hành động ngắn, xen vào)</span>; \"while\"/\"as\" + quá khứ tiếp diễn <span class=\"vi\">(hành động dài, nền)</span>. Công thức quen thuộc: S + was/were + V-ing + when + S + V(ed).</p></div></aside><h3>7. Quá khứ hoàn thành (Past Perfect)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + had + V3/-ed</code><code>(-) S + hadn't + V3</code><code>(?) Had + S + V3?</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hành động xảy ra TRƯỚC một hành động/thời điểm khác trong quá khứ</div></td><td><div>When I arrived, the train had already left.</div></td></tr><tr><td><div>Diễn tả kinh nghiệm/trải nghiệm trước một mốc quá khứ</div></td><td><div>It was the first time she had been abroad.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Nguyên tắc \"trước – sau\"</strong><p>Việc nào xảy ra TRƯỚC trong quá khứ → chia quá khứ hoàn thành (had + V3). Việc nào xảy ra SAU → chia quá khứ đơn. Thường đi kèm before, after, by the time, when, as soon as.</p></div></aside><h3>8. Quá khứ hoàn thành tiếp diễn (Past Perfect Continuous)</h3><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>(+) S + had + been + V-ing</code></div><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Nhấn mạnh QUÁ TRÌNH của hành động xảy ra trước 1 mốc/hành động khác trong quá khứ</div></td><td><div>She was tired because she had been working all day.</div></td></tr></tbody></table></div><h3>9. would / used to / be used to / get used to</h3><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>used to + V-inf</div></td><td><div>Thói quen/tình trạng trong quá khứ, NAY KHÔNG CÒN nữa</div></td><td><div>I used to smoke, but I quit 2 years ago.</div></td></tr><tr><td><div>would + V-inf</div></td><td><div>Thói quen trong quá khứ <span class=\"vi\">(chỉ dùng cho HÀNH ĐỘNG lặp lại, không dùng cho trạng thái)</span></div></td><td><div>Every summer, we would go to the beach.</div></td></tr><tr><td><div>be used to + V-ing/N</div></td><td><div>ĐÃ QUEN với việc gì <span class=\"vi\">(trạng thái ở hiện tại hoặc quá khứ)</span></div></td><td><div>I'm used to getting up early now.</div></td></tr><tr><td><div>get used to + V-ing/N</div></td><td><div>DẦN QUEN với việc gì <span class=\"vi\">(một quá trình thích nghi)</span></div></td><td><div>I'm gradually getting used to living alone.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt bộ ba dễ nhầm nhất trong tiếng Anh</strong><p>used to + V: THÓI QUEN CŨ, nay đã bỏ → theo sau là ĐỘNG TỪ NGUYÊN THỂ.</p><p>be used to + V-ing: ĐÃ QUEN <span class=\"vi\">(trạng thái)</span> → theo sau là DANH ĐỘNG TỪ, vì \"to\" ở đây là GIỚI TỪ.</p><p>get used to + V-ing: QUÁ TRÌNH quen dần → cũng theo sau là V-ing.</p><p>→ Chỉ cần nhớ: có \"be/get\" đứng trước \"used to\" thì \"to\" là giới từ (+V-ing); không có be/get thì \"used to\" là cấu trúc chỉ thói quen cũ <span class=\"vi\">(+V nguyên thể)</span>.</p></div></aside></section><section class=\"topic\" id=\"t-b3\"><h2>2.4  Nhóm thì tương lai</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Cách dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>will + V-inf</div></td><td><div>Quyết định tức thời <span class=\"vi\">(nghĩ ra ngay lúc nói)</span>; dự đoán không có căn cứ rõ; lời hứa/đề nghị/lời mời</div></td><td><div>I'll help you with that. / I think it will rain.</div></td></tr><tr><td><div>be going to + V-inf</div></td><td><div>Kế hoạch, dự định đã có TỪ TRƯỚC; dự đoán CÓ CĂN CỨ <span class=\"vi\">(nhìn thấy dấu hiệu)</span></div></td><td><div>I'm going to visit my parents this weekend. / Look at those clouds — it's going to rain.</div></td></tr><tr><td><div>Hiện tại tiếp diễn</div></td><td><div>Kế hoạch/lịch hẹn CÁ NHÂN đã sắp xếp cụ thể <span class=\"vi\">(thường có thời gian, địa điểm)</span></div></td><td><div>I'm meeting Jane at 7 tonight.</div></td></tr><tr><td><div>Hiện tại đơn</div></td><td><div>Lịch trình cố định, thời khóa biểu <span class=\"vi\">(tàu xe, rạp chiếu phim...)</span></div></td><td><div>The film starts at 8 p.m.</div></td></tr><tr><td><div>Tương lai tiếp diễn (will/shall + be + V-ing)</div></td><td><div>Hành động đang diễn ra tại 1 thời điểm xác định trong tương lai</div></td><td><div>This time tomorrow, I'll be flying to Paris.</div></td></tr><tr><td><div>Tương lai hoàn thành (will + have + V3)</div></td><td><div>Hành động sẽ HOÀN TẤT trước 1 thời điểm/mốc trong tương lai</div></td><td><div>By 2030, I will have graduated.</div></td></tr><tr><td><div>Tươ
