<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cẩm Nang Tiếng Anh</title>
<meta name="description" content="Cẩm nang tự học tiếng Anh: lý thuyết, nghe, nói, đọc, viết, thực hành và nhật ký ôn tập. Nội dung đọc từ Google Sheet.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F5F0;--surface:#FFFFFF;--surface2:#F0EEE7;--ink:#16202A;--ink2:#3B4753;--ink3:#697481;--line:#E2E0D8;--line2:#ECEAE3;
  --accent:#0B5C7A;--accent-soft:#E3F0F5;
  --tip:#1F5FCC;--tip-soft:#E8F0FD;--warn:#A65200;--warn-soft:#FDF0DE;
  --bad:#B42318;--bad-soft:#FDECEA;--good:#1B7A43;--good-soft:#E6F4EA;
  --t-s:#7352B5;--t-aux:#0B6E8A;--t-v:#1B7A43;--t-o:#A65200;
  --a-soft:var(--accent-soft);--g-soft:var(--good-soft);--o-soft:var(--warn-soft);--r-soft:var(--bad-soft);
  --sa:#0B5C7A;--sg:#1B7A43;--so:#A65200;--sr:#B42318;--green:#1B7A43;--orange:#A65200;--red:#B42318;
  --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 20px rgba(20,30,40,.05);
  --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --navh:56px;--tabsh:46px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114;--surface:#171B20;--surface2:#1F252B;--ink:#EDF1F5;--ink2:#C5CDD6;--ink3:#8E99A5;--line:#2A323A;--line2:#222A31;
  --accent:#5CB8D6;--accent-soft:#12303B;--tip:#7DA8FF;--tip-soft:#16264A;--warn:#F2A65A;--warn-soft:#3A2812;
  --bad:#FF8A80;--bad-soft:#3E1A18;--good:#6FD29A;--good-soft:#14301F;
  --t-s:#B89CF0;--t-aux:#5CB8D6;--t-v:#6FD29A;--t-o:#F2A65A;
  --sa:#2F89A8;--sg:#2E9C61;--so:#C9803A;--sr:#D9544B;--green:#6FD29A;--orange:#F2A65A;--red:#FF8A80;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114;--surface:#171B20;--surface2:#1F252B;--ink:#EDF1F5;--ink2:#C5CDD6;--ink3:#8E99A5;--line:#2A323A;--line2:#222A31;
  --accent:#5CB8D6;--accent-soft:#12303B;--tip:#7DA8FF;--tip-soft:#16264A;--warn:#F2A65A;--warn-soft:#3A2812;
  --bad:#FF8A80;--bad-soft:#3E1A18;--good:#6FD29A;--good-soft:#14301F;
  --t-s:#B89CF0;--t-aux:#5CB8D6;--t-v:#6FD29A;--t-o:#F2A65A;
  --sa:#2F89A8;--sg:#2E9C61;--so:#C9803A;--sr:#D9544B;--green:#6FD29A;--orange:#F2A65A;--red:#FF8A80;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--navh) + var(--tabsh) + 20px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{position:sticky;top:0;z-index:40;height:var(--navh);display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--bg);font:700 .85rem var(--font);font-style:normal}
.searchbox{position:relative;flex:1;min-width:0;max-width:460px;margin-left:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:38px;color:var(--ink3)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:.92rem;color:var(--ink);min-width:0;outline:0}
.iconbtn{min-width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);padding:0 8px;font-size:.78rem;font-weight:600}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.results{position:absolute;left:0;right:0;top:44px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px;display:none}
.results.on{display:block}
.results a{display:block;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:.9rem;line-height:1.4}
.results a:hover,.results a:focus{background:var(--accent-soft)}
.results small{display:block;color:var(--ink3);font-size:.75rem}
.results mark{background:color-mix(in srgb,var(--warn) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.results .none{padding:12px;color:var(--ink3);font-size:.9rem}

.tabs{position:sticky;top:var(--navh);z-index:30;height:var(--tabsh);display:flex;gap:6px;align-items:center;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;font-size:.9rem;color:var(--ink2);text-decoration:none;border:1px solid transparent}
.tabs a:hover{background:var(--surface2)}
.tabs a.on{background:var(--accent);color:var(--bg);font-weight:600}
.tabs .ico{width:17px;height:17px}

.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 220px;gap:36px;padding:0 20px}
.rail{position:sticky;top:calc(var(--navh) + var(--tabsh));align-self:start;max-height:calc(100vh - var(--navh) - var(--tabsh));overflow:auto;padding:18px 0 40px}
.rail h6{margin:6px 0 8px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.rail a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.93rem;line-height:1.35}
.rail a b{display:grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:var(--surface2);font-size:.78rem;color:var(--ink3);flex:none;padding:0 4px}
.rail a:hover{background:var(--surface2)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a.on b{background:var(--accent);color:var(--bg)}
.rail a.done b{background:var(--good-soft);color:var(--good)}
.toc{position:sticky;top:calc(var(--navh) + var(--tabsh));align-self:start;padding:22px 0;font-size:.85rem;max-height:calc(100vh - var(--navh) - var(--tabsh));overflow:auto}
.toc h6{margin:0 0 8px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.toc a{display:block;padding:4px 0 4px 12px;border-left:2px solid var(--line);color:var(--ink3);text-decoration:none;line-height:1.4;margin-bottom:2px}
.toc a.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.toc a.sub{padding-left:24px;font-size:.8rem}
.prog{margin-top:22px}.prog .bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.prog .bar i{display:block;height:100%;background:var(--accent)}

main{padding:26px 0 90px;min-width:0}
.crumb{font-size:.82rem;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--ink3);text-decoration:none}.crumb a:hover{color:var(--accent)}
h1{font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:8px 0 4px}
.en-sub{color:var(--ink3);margin:0 0 16px;font-size:1rem}
.lede{font-size:1.1rem;color:var(--ink2);max-width:68ch;margin:0 0 6px}
.vi{color:var(--ink3)}.en{color:var(--ink);font-weight:500}
.note{font-size:.88rem;color:var(--ink3);background:var(--surface2);border-radius:10px;padding:8px 12px;margin:10px 0}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.86rem;color:var(--ink2)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:4px 14px;font-size:.86rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}

.topic{margin-top:38px}
.topic>h2,details.sec>summary h2{display:flex;align-items:baseline;gap:12px;font-size:1.3rem;letter-spacing:-.01em;margin:0;font-weight:700;line-height:1.3}
.no{font-family:var(--mono);font-size:.82rem;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:8px;font-weight:600;position:relative;top:-2px;white-space:nowrap}
h3.sub{font-size:1.05rem;margin:26px 0 8px;color:var(--ink);letter-spacing:-.005em}
.topic>.body{margin-top:12px}
p{margin:10px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:11px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border:0}
td.k{font-weight:600;white-space:nowrap}
.m{display:inline-block;font-family:var(--mono);font-size:.88rem;font-weight:600;color:var(--t-aux);background:color-mix(in srgb,var(--t-aux) 10%,transparent);padding:0 7px;border-radius:7px;margin:1px 2px 1px 0}
.blur .hideable .t{filter:blur(6px);cursor:pointer;transition:filter .15s}.blur .hideable.rv .t{filter:none}

.ex{display:flex;gap:8px;align-items:flex-start}
.ex .t{flex:1}
.spk{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.spk:hover{background:var(--accent-soft);border-color:var(--accent)}
.spk .ico{width:15px;height:15px}
.ex.playing .t,.dl p.playing{background:var(--accent-soft);border-radius:6px;box-shadow:0 0 0 4px var(--accent-soft)}

.fig{margin:16px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 14px 10px;box-shadow:var(--shadow)}
.fig .sv{overflow-x:auto}
.fig figcaption{font-size:.86rem;color:var(--ink3);margin-top:6px}
.fig svg{width:100%;height:auto;display:block}
.fig text{font-family:var(--font)}
.nb{fill:var(--surface2);stroke:var(--line);stroke-width:1}.na{fill:var(--a-soft);stroke:var(--accent);stroke-width:1}
.ng{fill:var(--g-soft);stroke:var(--green);stroke-width:1}.no{fill:var(--o-soft);stroke:var(--orange);stroke-width:1}
.nr{fill:var(--r-soft);stroke:var(--red);stroke-width:1}.nq{fill:var(--surface);stroke:var(--ink3);stroke-width:1.5;stroke-dasharray:5 3}
.fa{fill:var(--sa)}.fg{fill:var(--sg)}.fo{fill:var(--so)}
.tx{fill:var(--ink)}.tm{fill:var(--ink3)}.tb{fill:var(--ink);font-weight:650}.ta{fill:var(--accent);font-weight:560}
.tg{fill:var(--green);font-weight:650}.tr{fill:var(--red);font-weight:650}.tw{}
svg text.tw{fill:#fff;font-weight:650}
.ln{stroke:var(--ink3);stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 4}.nowl{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}

.cl{display:flex;gap:12px;border-radius:14px;padding:13px 16px;margin:14px 0;border:1px solid;font-size:.97rem}
.cl .ico{margin-top:3px}
.cl b.h{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.cl.tip{background:var(--tip-soft);border-color:color-mix(in srgb,var(--tip) 30%,transparent)}.cl.tip .ico,.cl.tip b.h{color:var(--tip)}
.cl.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}.cl.warn .ico,.cl.warn b.h{color:var(--warn)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.pair>div{border-radius:14px;padding:13px 16px;border:1px solid}
.pair .x{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.pair .v{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.pair .lab{display:flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.pair .x .lab{color:var(--bad)}.pair .v .lab{color:var(--good)}
.pair .x .t{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.pair .why{grid-column:1/-1;margin:-4px 0 0;font-size:.9rem;color:var(--ink2)}

.fstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0;font-family:var(--mono);font-size:1rem}
.fstrip .lab{font-family:var(--font);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-right:4px}
.tk{padding:5px 11px;border-radius:10px;border:1.5px solid;background:color-mix(in srgb,currentColor 9%,transparent);font-weight:600}
.tk.s{color:var(--t-s)}.tk.aux{color:var(--t-aux)}.tk.v{color:var(--t-v)}.tk.o{color:var(--t-o)}.tk.n{color:var(--ink2);border-color:var(--line)}
.plus{color:var(--ink3)}
ul.bl{margin:10px 0;padding-left:22px}ul.bl li{margin:6px 0}
ul.chk{list-style:none;margin:10px 0;padding:0}
ul.chk li{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
ul.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
ul.chk li.on{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.dl{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 16px;margin:14px 0;box-shadow:var(--shadow)}
.dl h4{margin:0 0 8px;font-size:1rem;display:flex;align-items:center;gap:10px}
.dl h4 .pill{margin-left:auto;padding:3px 12px;font-size:.8rem}
.dl p{margin:4px 0;display:flex;gap:10px;align-items:flex-start;padding:2px 4px}
.dl p span.who{font-family:var(--mono);font-weight:700;color:var(--accent);flex:none;width:1.6em}
.dl p span.tx2{flex:1}

details.sec{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin:18px 0;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{margin-left:auto;transition:transform .2s;color:var(--ink3)}
details.sec[open]>summary .chev{transform:rotate(180deg)}
details.sec>.in{padding:0 18px 16px}
.rev{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap}
.rev .st{font-size:.84rem;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:99px;padding:6px 15px;font-size:.88rem;font-weight:600}
.btn:hover{background:var(--accent-soft)}.btn.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.ghost{border-color:var(--line);color:var(--ink2);font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad)}

.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:44px}
.nav2 a{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);background:var(--surface)}
.nav2 a small{display:block;color:var(--ink3);font-size:.78rem}.nav2 a:last-child{text-align:right}
.nav2 a:hover{border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:20px 0}
.card{display:block;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card .no{display:inline-block;margin-bottom:8px;top:0}
.card h3{margin:0 0 2px;font-size:1.05rem;line-height:1.3}
.card small{color:var(--ink3);display:block}
.card p{margin:8px 0 0;font-size:.88rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:12px}.card .bar i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0}
.tile{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
.tile b{display:block;font-size:1.7rem;line-height:1.1;color:var(--accent)}.tile span{font-size:.82rem;color:var(--ink3)}
.list a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:6px 0;text-decoration:none;color:var(--ink)}
.list a small{color:var(--ink3);white-space:nowrap}
.list a:hover{border-color:var(--accent)}
footer.foot{max-width:1320px;margin:0 auto;padding:0 20px 30px;color:var(--ink3);font-size:.8rem}
footer.foot p{margin:4px 0}

.bottom,.subtabs,.chips{display:none}
@media (max-width:1180px){.shell{grid-template-columns:230px minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){
  :root{--navh:52px;--tabsh:0px}
  .tabs{display:none}
  .shell{grid-template-columns:1fr;padding:0 16px;gap:0}
  .rail{display:none}
  .top{padding:0 14px;gap:8px}.brand span{display:none}
  body{font-size:16.5px;padding-bottom:78px}
  main{padding-top:14px}
  .subtabs{display:flex;gap:6px;margin-bottom:10px}
  .subtabs a{padding:5px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;color:var(--ink2);text-decoration:none}
  .subtabs a.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .chips{display:flex;gap:6px;overflow-x:auto;position:sticky;top:var(--navh);z-index:20;margin:0 -16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .chips a{flex:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;color:var(--ink2);text-decoration:none;white-space:nowrap}
  .chips a.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .pair{grid-template-columns:1fr}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--ink3);text-decoration:none;padding:5px 0;border-radius:10px}
  .bottom a.on{color:var(--accent);font-weight:600}
  .nav2{flex-direction:column}.nav2 a:last-child{text-align:left}
  details.sec>summary{padding:12px 14px}details.sec>.in{padding:0 14px 14px}
  td,th{padding:10px 12px}
}
@media print{.top,.tabs,.rail,.toc,.bottom,.chips,.subtabs,.tools,.nav2,.spk,.rev{display:none!important}.shell{display:block}body{background:#fff;color:#000;font-size:11pt}details.sec{box-shadow:none;break-inside:avoid}details>*{display:block}.tw,.fig{box-shadow:none}}

  if(!shown)h+='<p class="note">Phần này chưa có nội dung.</p>';

function buildIdx(){var I=[];
  D.cd.forEach(function(c){I.push({r:0,t:c.ma+" · "+c.ten_vi,x:norm(c.ten_vi+" "+c.ten_en+" "+c.mo_ta),raw:c.ten_en||c.mo_ta,h:"#/"+c.tab+"/"+c.id,w:tabInfo(c.tab).n})});
  Object.keys(D.kh).forEach(function(cid){var c=D.cdBy[cid];if(!c)return;D.kh[cid].forEach(function(k){
    var tx=[k.tieu_de,k.noi_dung,k.noi_dung_2].join(" ");if(!tx.trim()||k.loai==="bang"||k.loai==="so_do")return;
    I.push({r:k.loai==="muc"?1:2,t:k.tieu_de||plain(k.noi_dung).slice(0,70),x:norm(plain(tx)),raw:plain(tx),h:"#/"+c.tab+"/"+c.id+"/"+encodeURIComponent(k.muc_id),w:tabInfo(c.tab).n+" › "+c.ma})})});
  Object.keys(D.bang).forEach(function(bid){var rows=D.bang[bid],mid=rows[0].muc_id,cid=D.mucCd[mid],c=D.cdBy[cid];if(!c)return;
    rows.forEach(function(r){var tx=[1,2,3,4,5,6,7,8,9].map(function(i){return r["c"+i]}).join(" · ");I.push({r:3,t:plain(r.c1||tx).slice(0,70),x:norm(plain(tx)),raw:plain(tx),h:"#/"+c.tab+"/"+c.id+"/"+encodeURIComponent(mid),w:tabInfo(c.tab).n+" › "+c.ma})})});
  D.vd.forEach(function(v){var c=D.cdBy[v.chu_de];if(!c)return;I.push({r:4,t:plain(v.en),x:norm(plain(v.en+" "+v.vi)),raw:plain(v.en)+(v.vi?" — "+v.vi:""),h:"#/"+c.tab+"/"+c.id+"/"+encodeURIComponent(v.muc_id),w:tabInfo(c.tab).n+" › "+c.ma})});
  D.idx=I}
function doSearch(q){var box=$("#res");q=norm(q).trim();
  if(!q){box.classList.remove("on");box.innerHTML="";return}
  if(!D.idx)buildIdx();
  var tk=q.split(/\s+/),out=[];
  for(var i=0;i<D.idx.length&&out.length<400;i++){var it=D.idx[i],ok=true;for(var j=0;j<tk.length;j++)if(it.x.indexOf(tk[j])<0){ok=false;break}if(ok)out.push(it)}
  out.sort(function(a,b){return a.r-b.r});out=out.slice(0,30);
  box.innerHTML=out.length?out.map(function(it){var p=norm(it.raw).indexOf(tk[0]),sn=it.raw;
      if(p>=0&&it.raw.length>90)sn=(p>30?"…":"")+it.raw.slice(Math.max(0,p-30),p+70);else sn=it.raw.slice(0,100);
      return '<a href="'+it.h+'" data-close><b>'+esc(it.t.slice(0,80))+"</b><small>"+esc(it.w)+" · "+esc(sn)+"</small></a>"}).join(""):'<div class="none">Không tìm thấy “'+esc(q)+'”.</div>';
  box.classList.add("on")}
