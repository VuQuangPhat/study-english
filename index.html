<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cẩm Nang Tiếng Anh Pháp Lý & Thương Mại</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --tag-bg: #eff6ff;
      --tag-text: #1e40af;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* Thanh tìm kiếm & Nút thao tác */
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg-card);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .btn-refresh {
      padding: 0 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: #f1f5f9;
      color: var(--primary);
    }

    /* Điều hướng Tab */
    .tabs-nav {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 10px 18px;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--primary);
      background-color: #f1f5f9;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
      background-color: #eff6ff;
    }

    .badge {
      font-size: 0.8rem;
      background: #e2e8f0;
      color: #334155;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
    }

    .tab-btn.active .badge {
      background: var(--primary);
      color: #ffffff;
    }

    /* Trạng thái Loading & Kết quả */
    .status-msg {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      font-weight: 500;
      color: var(--text-muted);
    }

    .search-summary {
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(30, 64, 175, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Grid bài học */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .card h3 {
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .card-body {
      color: var(--text-muted);
      font-size: 0.95rem;
      white-space: pre-line;
      margin-bottom: 12px;
    }

    .example-box {
      position: relative;
      background-color: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      padding-right: 60px;
      border-radius: 0 8px 8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      color: #1e293b;
      white-space: pre-wrap;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .copy-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>CẨM NANG TIẾNG ANH (KẾT NỐI BỘ NÃO GOOGLE SHEET)</h1>
  </header>

  <!-- Thanh tìm kiếm & nút làm mới -->
  <div class="search-row">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm kiếm từ vựng, ngữ pháp, mẫu câu..." oninput="handleSearch()">
    <button class="btn-refresh" onclick="fetchSheetData()" title="Tải lại dữ liệu">🔄 Làm mới</button>
  </div>

  <!-- Trạng thái Loading -->
  <div id="statusBox" class="status-msg">
    <div class="spinner"></div> Đang kết nối dữ liệu từ Google Sheet...
  </div>

  <!-- Thanh Tab điều hướng -->
  <div id="tabsNav" class="tabs-nav" style="display: none;"></div>

  <!-- Thông báo kết quả tìm kiếm -->
  <div id="searchSummary" class="search-summary" style="display: none;"></div>

  <!-- Vùng hiển thị nội dung -->
  <div id="contentGrid" class="content-grid"></div>
</div>

<script>
  const CONFIG = {
    API_URL: "https://script.google.com/macros/s/AKfycbxfq8HO5CDRptfLYM6FUjTUIjU3ZDMD8bhvnDU5qeXzW2nPOl-0-y6YCKIWxpyyJcd52Q/exec"
  };

  let masterData = [];
  let currentCategory = "";

  async function fetchSheetData() {
    const statusBox = document.getElementById("statusBox");
    statusBox.style.display = "block";
    statusBox.innerHTML = `<div class="spinner"></div> Đang kết nối dữ liệu từ Google Sheet...`;
    
    document.getElementById("tabsNav").style.display = "none";
    document.getElementById("contentGrid").innerHTML = "";
    document.getElementById("searchSummary").style.display = "none";

    try {
      const response = await fetch(CONFIG.API_URL);
      if (!response.ok) throw new Error("Không thể truy cập API Google Sheet");
      
      const data = await response.json();
      if (data.error) throw new Error(data.error);

      masterData = data;
      statusBox.style.display = "none";
      document.getElementById("tabsNav").style.display = "flex";
      
      initTabs();
    } catch (err) {
      statusBox.innerHTML = `<span style="color: #dc2626;">❌ Lỗi kết nối: ${err.message}. Vui lòng kiểm tra lại URL Web App hoặc phân quyền "Anyone".</span>`;
    }
  }

  function initTabs() {
    const categories = [...new Set(masterData.map(item => item.Category || "Khác"))];
    const tabsNav = document.getElementById("tabsNav");
    tabsNav.innerHTML = "";

    categories.forEach((cat, index) => {
      const count = masterData.filter(item => (item.Category || "Khác") === cat).length;
      const btn = document.createElement("button");
      btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
      btn.innerHTML = `${escapeHtml(cat)} <span class="badge">${count}</span>`;
      btn.onclick = () => switchTab(cat, btn);
      tabsNav.appendChild(btn);
    });

    if (categories.length > 0) {
      currentCategory = categories[0];
      renderData();
    }
  }

  function switchTab(category, btnElement) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btnElement.classList.add("active");
    currentCategory = category;
    document.getElementById("searchInput").value = "";
    document.getElementById("searchSummary").style.display = "none";
    renderData();
  }

  function renderData(filteredItems = null) {
    const container = document.getElementById("contentGrid");
    container.innerHTML = "";

    const items = filteredItems || masterData.filter(item => (item.Category || "Khác") === currentCategory);

    if (items.length === 0) {
      container.innerHTML = `<div class="status-msg">Không tìm thấy nội dung phù hợp.</div>`;
      return;
    }

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      
      let exampleHtml = '';
      if (item.Example) {
        exampleHtml = `
          <div class="example-box">
            <button class="copy-btn" onclick="copyText(this)">Copy</button>
            <span>${escapeHtml(item.Example)}</span>
          </div>`;
      }

      card.innerHTML = `
        <div class="card-header">
          ${item.Tag ? `<span class="tag">${escapeHtml(item.Tag)}</span>` : '<span></span>'}
        </div>
        ${item.Title ? `<h3>${escapeHtml(item.Title)}</h3>` : ''}
        ${item.Content ? `<div class="card-body">${escapeHtml(item.Content)}</div>` : ''}
        ${exampleHtml}
      `;
      container.appendChild(card);
    });
  }

  function handleSearch() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const summaryBox = document.getElementById("searchSummary");

    if (!query) {
      summaryBox.style.display = "none";
      renderData();
      return;
    }

    const filtered = masterData.filter(item => {
      return (
        (item.Title && item.Title.toLowerCase().includes(query)) ||
        (item.Content && item.Content.toLowerCase().includes(query)) ||
        (item.Example && item.Example.toLowerCase().includes(query)) ||
        (item.Tag && item.Tag.toLowerCase().includes(query)) ||
        (item.Category && item.Category.toLowerCase().includes(query))
      );
    });

    summaryBox.style.display = "block";
    summaryBox.innerText = `🔍 Tìm thấy ${filtered.length} kết quả phù hợp cho từ khóa "${query}"`;

    renderData(filtered);
  }

  function copyText(btn) {
    const text = btn.nextElementSibling.innerText;
    navigator.clipboard.writeText(text).then(() => {
      const originalText = btn.innerText;
      btn.innerText = "Đã chép! ✓";
      btn.style.color = "#16a34a";
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.color = "";
      }, 1500);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  document.addEventListener("DOMContentLoaded", fetchSheetData);
</script>

</body>
</html>
