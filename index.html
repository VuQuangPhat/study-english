/td><td><div>look forward to (+ V-ing)</div></td></tr><tr><td><div>apologise for</div></td><td><div>believe in</div></td><td><div>wait for</div></td></tr><tr><td><div>succeed in</div></td><td><div>consist of</div></td><td><div>belong to</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Cách học giới từ hiệu quả</strong><p>Đừng học giới từ đơn lẻ — hãy học THEO CỤM với tính từ/động từ đi kèm nó, vì giới từ trong tiếng Anh thường không có logic dịch 1-1 sang tiếng Việt. Ghi vào sổ tay theo cụm, ôn lại nhiều lần sẽ nhớ tự nhiên hơn là học quy tắc.</p></div></aside></section><section class=\"topic\" id=\"t-i5\"><h2>13.6  Giới từ trong tiếng Anh pháp lý và công việc</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cụm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>comply with</div></td><td><div>tuân thủ</div></td><td><div>The company must comply with the regulations.</div></td></tr><tr><td><div>in accordance with</div></td><td><div>theo, phù hợp với</div></td><td><div>The contract was drafted in accordance with Vietnamese law.</div></td></tr><tr><td><div>subject to</div></td><td><div>tuỳ thuộc vào, phải chịu</div></td><td><div>This offer is subject to board approval.</div></td></tr><tr><td><div>adhere to</div></td><td><div>tuân theo</div></td><td><div>Both parties must adhere to the terms.</div></td></tr><tr><td><div>responsible for</div></td><td><div>chịu trách nhiệm về</div></td><td><div>The seller is responsible for damage in transit.</div></td></tr><tr><td><div>liable for</div></td><td><div>có nghĩa vụ pháp lý bồi thường</div></td><td><div>The driver is liable for the costs.</div></td></tr><tr><td><div>on behalf of</div></td><td><div>thay mặt cho</div></td><td><div>I am writing on behalf of my client.</div></td></tr><tr><td><div>within</div></td><td><div>trong vòng</div></td><td><div>Payment must be made within 30 days.</div></td></tr><tr><td><div>under</div></td><td><div>theo <span class=\"vi\">(hợp đồng / luật)</span></div></td><td><div>Rights and obligations under this Agreement.</div></td></tr><tr><td><div>in respect of / with respect to</div></td><td><div>đối với, liên quan đến</div></td><td><div>A claim in respect of breach of contract.</div></td></tr><tr><td><div>independent of</div></td><td><div>độc lập với</div></td><td><div>The auditor must be independent of the company.</div></td></tr><tr><td><div>in conflict with</div></td><td><div>xung đột với</div></td><td><div>This clause is in conflict with the law.</div></td></tr><tr><td><div>enter into</div></td><td><div>ký kết, bước vào</div></td><td><div>The parties entered into an agreement.</div></td></tr><tr><td><div>pursuant to</div></td><td><div>căn cứ theo</div></td><td><div>Pursuant to Article 5…</div></td></tr><tr><td><div>by virtue of</div></td><td><div>nhờ có, do</div></td><td><div>By virtue of his position…</div></td></tr><tr><td><div>in breach of</div></td><td><div>vi phạm</div></td><td><div>The Seller is in breach of contract.</div></td></tr><tr><td><div>in the event of</div></td><td><div>trong trường hợp</div></td><td><div>In the event of default…</div></td></tr><tr><td><div>notwithstanding</div></td><td><div>bất kể</div></td><td><div>Notwithstanding the above…</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Ví dụ nâng cấp câu</strong><p>“I agree with that point.” <span class=\"vi\">(nói thường)</span> → “I am in agreement with your position regarding the settlement terms.” <span class=\"vi\">(trang trọng, văn bản)</span></p></div></aside></section>", "topics": [{"id": "t-i0", "title": "Phễu in – on – at", "number": "13.1"}, {"id": "t-i1", "title": "Giới từ chỉ thời gian: in / on / at", "number": "13.2"}, {"id": "t-i2", "title": "Giới từ chỉ nơi chốn: in / on / at", "number": "13.3"}, {"id": "t-i3", "title": "Một số giới từ chỉ nơi chốn/hướng khác", "number": "13.4"}, {"id": "t-i4", "title": "Giới từ đi cùng tính từ, động từ cố định (collocations)", "number": "13.5"}, {"id": "t-i5", "title": "Giới từ trong tiếng Anh pháp lý và công việc", "number": "13.6"}], "number": 13}, {"id": "t-n", "title": "Cấu tạo từ (Word formation)", "html": "<div class=\"panelintro\"><p>Khi đọc và viết, bạn thường phải biến đổi một từ gốc <span class=\"vi\">(thường cho sẵn)</span> thành đúng từ loại cần dùng trong câu. Chìa khóa là: (1) xác định VỊ TRÍ cần điền là danh từ/động từ/tính từ/trạng từ, (2) nhớ các HẬU TỐ đặc trưng của từng loại.</p></div><section class=\"topic\" id=\"t-n0\"><h2>14.1  Cây cấu tạo từ</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Cây hình thành từ từ một gốc\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 296\"><rect class=\"fa\" height=\"44\" rx=\"10\" width=\"180\" x=\"300\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:15px\" text-anchor=\"middle\" x=\"390.0\" y=\"26.0\"><tspan dy=\"0.00em\" x=\"390.0\">Gốc từ:  decide</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"77\" y1=\"48\" y2=\"92\"></line><rect class=\"na\" height=\"40\" rx=\"10\" width=\"146\" x=\"4\" y=\"94\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"77.0\" y=\"114.0\"><tspan dy=\"0.00em\" x=\"77.0\">DANH TỪ</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"146\" x=\"4\" y=\"138\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"77.0\" y=\"170.0\"><tspan dy=\"-0.62em\" x=\"77.0\">-tion -sion -ment</tspan><tspan dy=\"1.25em\" x=\"77.0\">-ness -ity -ance</tspan></text><rect class=\"nb\" height=\"40\" rx=\"10\" width=\"146\" x=\"4\" y=\"206\"></rect><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"77.0\" y=\"226.0\"><tspan dy=\"0.00em\" x=\"77.0\">decision</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"231\" y1=\"48\" y2=\"92\"></line><rect class=\"na\" height=\"40\" rx=\"10\" width=\"146\" x=\"158\" y=\"94\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"231.0\" y=\"114.0\"><tspan dy=\"0.00em\" x=\"231.0\">DANH TỪ (người)</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"146\" x=\"158\" y=\"138\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"231.0\" y=\"170.0\"><tspan dy=\"0.00em\" x=\"231.0\">-er -or -ist -ee</tspan></text><rect class=\"nb\" height=\"40\" rx=\"10\" width=\"146\" x=\"158\" y=\"206\"></rect><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"231.0\" y=\"226.0\"><tspan dy=\"0.00em\" x=\"231.0\">decider / assignee</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"385\" y1=\"48\" y2=\"92\"></line><rect class=\"ng\" height=\"40\" rx=\"10\" width=\"146\" x=\"312\" y=\"94\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"385.0\" y=\"114.0\"><tspan dy=\"0.00em\" x=\"385.0\">TÍNH TỪ</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"146\" x=\"312\" y=\"138\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"385.0\" y=\"170.0\"><tspan dy=\"-0.62em\" x=\"385.0\">-al -ive -able</tspan><tspan dy=\"1.25em\" x=\"385.0\">-ous -ful -less</tspan></text><rect class=\"nb\" height=\"40\" rx=\"10\" width=\"146\" x=\"312\" y=\"206\"></rect><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"385.0\" y=\"226.0\"><tspan dy=\"0.00em\" x=\"385.0\">decisive</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"539\" y1=\"48\" y2=\"92\"></line><rect class=\"no\" height=\"40\" rx=\"10\" width=\"146\" x=\"466\" y=\"94\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"539.0\" y=\"114.0\"><tspan dy=\"0.00em\" x=\"539.0\">ĐỘNG TỪ</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"146\" x=\"466\" y=\"138\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"539.0\" y=\"170.0\"><tspan dy=\"0.00em\" x=\"539.0\">-ate -ize -ify -en</tspan></text><rect class=\"nb\" height=\"40\" rx=\"10\" width=\"146\" x=\"466\" y=\"206\"></rect><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"539.0\" y=\"226.0\"><tspan dy=\"0.00em\" x=\"539.0\">legalize, shorten</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"390\" x2=\"693\" y1=\"48\" y2=\"92\"></line><rect class=\"nr\" height=\"40\" rx=\"10\" width=\"146\" x=\"620\" y=\"94\"></rect><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"693.0\" y=\"114.0\"><tspan dy=\"0.00em\" x=\"693.0\">TRẠNG TỪ</tspan></text><rect class=\"nb\" height=\"64\" rx=\"10\" width=\"146\" x=\"620\" y=\"138\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"693.0\" y=\"170.0\"><tspan dy=\"0.00em\" x=\"693.0\">-ly</tspan></text><rect class=\"nb\" height=\"40\" rx=\"10\" width=\"146\" x=\"620\" y=\"206\"></rect><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"693.0\" y=\"226.0\"><tspan dy=\"0.00em\" x=\"693.0\">decisively</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"390\" y=\"276\"><tspan dy=\"0.00em\" x=\"390\">Bước 1: nhìn chỗ trống cần LOẠI TỪ gì.   Bước 2: chọn đuôi đúng loại từ.   Bước 3: kiểm tra nghĩa (khẳng định / phủ định).</tspan></text></svg></div><figcaption>Từ một gốc có thể sinh ra danh từ, tính từ, động từ, trạng từ. Đuôi cho biết loại từ.</figcaption></figure></section><section class=\"topic\" id=\"t-n1\"><h2>14.2  Nhận diện từ loại qua vị trí trong câu</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ loại</th><th>Vị trí nhận diện</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Danh từ (Noun)</div></td><td><div>sau mạo từ (a/an/the), tính từ sở hữu, tính từ, giới từ; làm chủ ngữ/tân ngữ</div></td><td><div>Her ... beauty ... amazed everyone. <span class=\"vi\">(tính từ + N)</span></div></td></tr><tr><td><div>Động từ (Verb)</div></td><td><div>sau chủ ngữ, sau trợ động từ, sau \"to\"</div></td><td><div>She ... decided ... to leave.</div></td></tr><tr><td><div>Tính từ (Adjective)</div></td><td><div>trước danh từ, hoặc sau động từ liên kết (be, seem, become, look, feel...)</div></td><td><div>It was a ... beautiful ... day. / She looks ... happy.</div></td></tr><tr><td><div>Trạng từ (Adverb)</div></td><td><div>bổ nghĩa cho động từ/tính từ/trạng từ khác, thường cuối câu hoặc trước tính từ/động từ chính</div></td><td><div>He drives ... carefully. / It's ... extremely ... hot.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-n2\"><h2>14.3  Hậu tố tạo DANH TỪ</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Hậu tố</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>-tion / -sion</div></td><td><div>decide → decision, inform → information</div></td></tr><tr><td><div>-ment</div></td><td><div>develop → development, govern → government</div></td></tr><tr><td><div>-ness</div></td><td><div>happy → happiness, kind → kindness</div></td></tr><tr><td><div>-ity / -ty</div></td><td><div>able → ability, real → reality</div></td></tr><tr><td><div>-er / -or</div></td><td><div>teach → teacher, act → actor <span class=\"vi\">(chỉ người làm)</span></div></td></tr><tr><td><div>-ance / -ence</div></td><td><div>differ → difference, important → importance</div></td></tr><tr><td><div>-ship</div></td><td><div>friend → friendship, relation → relationship</div></td></tr><tr><td><div>-th</div></td><td><div>grow → growth, strong → strength</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-n3\"><h2>14.4  Hậu tố tạo TÍNH TỪ</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Hậu tố</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>-ful</div></td><td><div>care → careful, help → helpful</div></td></tr><tr><td><div>-less <span class=\"vi\">(phủ định, thiếu)</span></div></td><td><div>care → careless, home → homeless</div></td></tr><tr><td><div>-able / -ible</div></td><td><div>accept → acceptable, respond → responsible</div></td></tr><tr><td><div>-ive</div></td><td><div>act → active, attract → attractive</div></td></tr><tr><td><div>-al</div></td><td><div>nature → natural, culture → cultural</div></td></tr><tr><td><div>-ous</div></td><td><div>danger → dangerous, fame → famous</div></td></tr><tr><td><div>-ic / -ical</div></td><td><div>history → historic(al), economy → economic(al)</div></td></tr><tr><td><div>-y</div></td><td><div>rain → rainy, health → healthy</div></td></tr><tr><td><div>-ing / -ed <span class=\"vi\">(tính từ từ động từ)</span></div></td><td><div>interest → interesting <span class=\"vi\">(gây hứng thú)</span> / interested <span class=\"vi\">(cảm thấy hứng thú)</span></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt tính từ đuôi -ing và -ed</strong><p>-ing: mô tả tính chất của VẬT/SỰ VIỆC gây ra cảm xúc đó <span class=\"vi\">(The film was boring — bộ phim gây chán)</span>. -ed: mô tả CẢM XÚC của người/vật chịu tác động <span class=\"vi\">(I was bored — tôi cảm thấy chán)</span>. Chủ ngữ là người → thường dùng -ed; chủ ngữ là vật/sự việc → thường dùng -ing.</p></div></aside></section><section class=\"topic\" id=\"t-n4\"><h2>14.5  Hậu tố tạo ĐỘNG TỪ và TRẠNG TỪ</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Hậu tố</th><th>Ví dụ</th><th>Nghĩa</th></tr></thead><tbody><tr><td><div>-ise/-ize</div></td><td><div>modern → modernise</div></td><td><div>hiện đại hóa</div></td></tr><tr><td><div>-en</div></td><td><div>wide → widen</div></td><td><div>làm rộng ra</div></td></tr><tr><td><div>-ify</div></td><td><div>simple → simplify</div></td><td><div>đơn giản hóa</div></td></tr><tr><td><div>-ly <span class=\"vi\">(tính từ → trạng từ)</span></div></td><td><div>quick → quickly, careful → carefully</div></td><td><div>một cách nhanh chóng</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Một số tính từ bất quy tắc khi thêm -ly: good → well; tính từ đã tận cùng -y đổi thành -ily: happy → happily; tính từ tận cùng -le đổi thành -ly <span class=\"vi\">(không thêm e kép)</span>: simple → simply. Một số từ vừa là tính từ vừa là trạng từ không đổi: fast, hard, late, early.</p></div></aside></section><section class=\"topic\" id=\"t-n5\"><h2>14.6  Tiền tố (prefixes) thường gặp — chủ yếu mang nghĩa PHỦ ĐỊNH</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Tiền tố</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>un-</div></td><td><div>happy → unhappy, able → unable</div></td></tr><tr><td><div>in-</div></td><td><div>correct → incorrect, formal → informal</div></td></tr><tr><td><div>im- <span class=\"vi\">(trước b, m, p)</span></div></td><td><div>possible → impossible, mature → immature</div></td></tr><tr><td><div>il- <span class=\"vi\">(trước l)</span></div></td><td><div>legal → illegal, literate → illiterate</div></td></tr><tr><td><div>ir- <span class=\"vi\">(trước r)</span></div></td><td><div>regular → irregular, responsible → irresponsible</div></td></tr><tr><td><div>dis-</div></td><td><div>agree → disagree, honest → dishonest</div></td></tr><tr><td><div>non-</div></td><td><div>sense → nonsense, fiction → non-fiction</div></td></tr><tr><td><div>mis- <span class=\"vi\">(sai, nhầm)</span></div></td><td><div>understand → misunderstand</div></td></tr><tr><td><div>re- <span class=\"vi\">(lại, làm lại)</span></div></td><td><div>write → rewrite, build → rebuild</div></td></tr><tr><td><div>over- <span class=\"vi\">(quá mức)</span></div></td><td><div>eat → overeat, confident → overconfident</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo chọn đúng tiền tố phủ định</strong><p>Không có công thức tuyệt đối 100%, nhưng có quy luật phổ biến theo ÂM ĐẦU của từ gốc: im- trước b/m/p (impossible, immature), il- trước l (illegal), ir- trước r (irregular), còn lại thường là in- hoặc un-. Cách chắc ăn nhất vẫn là học thuộc theo từng từ vựng cụ thể vì tiếng Anh có khá nhiều ngoại lệ.</p></div></aside></section><section class=\"topic\" id=\"t-n6\"><h2>14.7  Bảng họ từ (word family) cho tiếng Anh công việc</h2><div class=\"tblwrap\"><table class=\"cols-5\"><thead><tr><th>Động từ</th><th>Danh từ (việc)</th><th>Danh từ (người)</th><th>Tính từ</th><th>Trạng từ</th></tr></thead><tbody><tr><td><div>decide</div></td><td><div>decision</div></td><td><div>decider</div></td><td><div>decisive</div></td><td><div>decisively</div></td></tr><tr><td><div>agree</div></td><td><div>agreement</div></td><td><div>—</div></td><td><div>agreeable</div></td><td><div>agreeably</div></td></tr><tr><td><div>apply</div></td><td><div>application</div></td><td><div>applicant</div></td><td><div>applicable</div></td><td><div>—</div></td></tr><tr><td><div>assist</div></td><td><div>assistance</div></td><td><div>assistant</div></td><td><div>assistive</div></td><td><div>—</div></td></tr><tr><td><div>analyse</div></td><td><div>analysis</div></td><td><div>analyst</div></td><td><div>analytical</div></td><td><div>analytically</div></td></tr><tr><td><div>advise</div></td><td><div>advice</div></td><td><div>adviser / advisor</div></td><td><div>advisable</div></td><td><div>—</div></td></tr><tr><td><div>communicate</div></td><td><div>communication</div></td><td><div>communicator</div></td><td><div>communicative</div></td><td><div>communicatively</div></td></tr><tr><td><div>compete</div></td><td><div>competition</div></td><td><div>competitor</div></td><td><div>competitive</div></td><td><div>competitively</div></td></tr><tr><td><div>conclude</div></td><td><div>conclusion</div></td><td><div>—</div></td><td><div>conclusive</div></td><td><div>conclusively</div></td></tr><tr><td><div>contribute</div></td><td><div>contribution</div></td><td><div>contributor</div></td><td><div>contributory</div></td><td><div>—</div></td></tr><tr><td><div>create</div></td><td><div>creation</div></td><td><div>creator</div></td><t iệc", "number": "14.7"}], "number": 14}, {"id": "t-o", "title": "Cụm động từ thông dụng (Phrasal verbs)", "html": "<div class=\"panelintro\"><p>Cụm động từ = động từ + giới từ/trạng từ, thường mang nghĩa KHÁC HẲN nghĩa gốc của động từ. Đây là phần cần học thuộc lòng nhiều nên hãy học theo NHÓM chủ đề hoặc theo ĐỘNG TỪ GỐC để dễ liên tưởng.</p></div><section class=\"topic\" id=\"t-o1\"><h2>15.1  Nhóm với get</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cụm từ</th><th>Nghĩa</th></tr></thead><tbody><tr><td><div>get up</div></td><td><div>thức dậy</div></td></tr><tr><td><div>get on</div></td><td><div>lên xe <span class=\"vi\">(tàu, bus)</span>; hòa hợp với ai</div></td></tr><tr><td><div>get off</div></td><td><div>xuống xe</div></td></tr><tr><td><div>get over</div></td><td><div>vượt qua <span class=\"vi\">(khó khăn, ốm đau)</span></div></td></tr><tr><td><div>get along/on with</div></td><td><div>hòa hợp, sống hòa thuận với ai</div></td></tr><tr><td><div>get away</div></td><td><div>trốn thoát, đi nghỉ</div></td></tr><tr><td><div>get by</div></td><td><div>sống tạm ổn, xoay xở đủ sống</div></td></tr><tr><td><div>get through</div></td><td><div>vượt qua, hoàn thành; liên lạc được <span class=\"vi\">(điện thoại)</span></div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-o2\"><h2>15.2  Nhóm với look</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cụm từ</th><th>Nghĩa</th></tr></thead><tbody><tr><td><div>look for</div></td><td><div>tìm kiếm</div></td></tr><tr><td><div>look after</div></td><td><div>chăm sóc</div></td></tr><tr><td><div>look up</div></td><td><div>tra cứu <span class=\"vi\">(từ điển)</span></div></td></tr><tr><td><div>look forward to</div></td><td><div>mong chờ</div></td></tr><tr><td><div>look into</div></td><td><div>điều tra, xem xét kỹ</div></td></tr><tr><td><div>look down on</div></td><td><div>coi thường</div></td></tr><tr><td><div>look up to</div></td><td><div>ngưỡng mộ, coi trọng</div></td></tr><tr><td><div>look out (for)</div></td><td><div>cẩn thận, coi chừng</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-o3\"><h2>15.3  Nhóm với turn, take, put, give</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cụm từ</th><th>Nghĩa</th></tr></thead><tbody><tr><td><div>turn on/off</div></td><td><div>bật/tắt</div></td></tr><tr><td><div>turn up/down</div></td><td><div>vặn to/nhỏ <span class=\"vi\">(âm lượng)</span>; xuất hiện (turn up)</div></td></tr><tr><td><div>take off</div></td><td><div>cất cánh; cởi <span class=\"vi\">(quần áo)</span></div></td></tr><tr><td><div>take up</div></td><td><div>bắt đầu <span class=\"vi\">(sở thích, thói quen mới)</span></div></td></tr><tr><td><div>take after</div></td><td><div>giống ai <span class=\"vi\">(ngoại hình/tính cách, thường trong gia đình)</span></div></td></tr><tr><td><div>take care of</div></td><td><div>chăm sóc</div></td></tr><tr><td><div>put on</div></td><td><div>mặc/đeo vào</div></td></tr><tr><td><div>put off</div></td><td><div>trì hoãn</div></td></tr><tr><td><div>put up with</div></td><td><div>chịu đựng</div></td></tr><tr><td><div>give up</div></td><td><div>từ bỏ</div></td></tr><tr><td><div>give in</div></td><td><div>đầu hàng, nhượng bộ</div></td></tr><tr><td><div>give out</div></td><td><div>phát ra, phân phát</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-o4\"><h2>15.4  Nhóm với break, come, go, run</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cụm từ</th><th>Nghĩa</th></tr></thead><tbody><tr><td><div>break down</div></td><td><div>hỏng <span class=\"vi\">(máy móc, xe cộ)</span>; suy sụp tinh thần</div></td></tr><tr><td><div>break out</div></td><td><div>bùng nổ <span class=\"vi\">(chiến tranh, dịch bệnh, hỏa hoạn)</span></div></td></tr><tr><td><div>come across</div></td><td><div>tình cờ gặp/tìm thấy</div></td></tr><tr><td><div>come up with</div></td><td><div>nghĩ ra <span class=\"vi\">(ý tưởng)</span></div></td></tr><tr><td><div>go on</div></td><td><div>tiếp tục; xảy ra</div></td></tr><tr><td><div>go off</div></td><td><div>phát nổ; reo <span class=\"vi\">(báo thức)</span>; hỏng <span class=\"vi\">(thức ăn)</span></div></td></tr><tr><td><div>run out of</div></td><td><div>hết, cạn kiệt <span class=\"vi\">(một thứ gì đó)</span></div></td></tr><tr><td><div>run into</div></td><td><div>tình cờ gặp; va phải</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo học phrasal verbs hiệu quả</strong><p>Học theo CÂU VÍ DỤ hoàn chỉnh thay vì học từ đơn lẻ, vì nghĩa phụ thuộc rất nhiều vào ngữ cảnh.</p><p>Chú ý cụm nào có thể CHEN TÂN NGỮ vào giữa <span class=\"vi\">(turn the light off / turn off the light — đều đúng)</span> và cụm nào KHÔNG được chen tân ngữ vào giữa vì có giới từ đi kèm cố định <span class=\"vi\">(look after her — không nói look her after)</span>.</p><p>Nếu tân ngữ là ĐẠI TỪ (it, him, her...) thì với cụm động từ tách được, đại từ BẮT BUỘC phải đứng ở giữa: turn it off <span class=\"vi\">(không nói turn off it)</span>.</p></div></aside></section><section class=\"topic\" id=\"t-o5\"><h2>15.5  Cụm động từ theo nhóm tiểu từ</h2><aside class=\"note\"><span class=\"chip\">Tách được hay không</span><div class=\"box\"><p>Cụm tách được (separable): put <strong>it</strong> on / turn the light <strong>off</strong> — đại từ BẮT BUỘC đứng giữa. Cụm không tách (inseparable): look after the child / look after <strong>him</strong>. Kiểm tra từ điển cho từng cụm.</p></div></aside><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cụm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>carry out</div></td><td><div>tiến hành, thực hiện</div></td><td><div>carry out an audit</div></td></tr><tr><td><div>set up</div></td><td><div>thành lập, thiết lập</div></td><td><div>set up a company</div></td></tr><tr><td><div>bring up</div></td><td><div>đưa ra <span class=\"vi\">(vấn đề)</span> / nuôi dưỡng</div></td><td><div>bring up a concern</div></td></tr><tr><td><div>point out</div></td><td><div>chỉ ra</div></td><td><div>point out an error</div></td></tr><tr><td><div>figure out</div></td><td><div>tìm ra, hiểu ra</div></td><td><div>figure out the cause</div></td></tr><tr><td><div>find out</div></td><td><div>tìm ra <span class=\"vi\">(thông tin)</span></div></td><td><div>find out the date</div></td></tr><tr><td><div>work out</div></td><td><div>giải quyết / tính ra / tập thể dục</div></td><td><div>work out a solution</div></td></tr><tr><td><div>follow up (on)</div></td><td><div>theo dõi, bám tiếp</div></td><td><div>follow up on the request</div></td></tr><tr><td><div>look into</div></td><td><div>xem xét, điều tra</div></td><td><div>look into the complaint</div></td></tr><tr><td><div>go over</div></td><td><div>xem lại</div></td><td><div>go over the draft</div></td></tr><tr><td><div>go through</div></td><td><div>xem kỹ / trải qua</div></td><td><div>go through the contract</div></td></tr><tr><td><div>take over</div></td><td><div>tiếp quản</div></td><td><div>take over the project</div></td></tr><tr><td><div>take on</div></td><td><div>nhận <span class=\"vi\">(việc)</span></div></td><td><div>take on more work</div></td></tr><tr><td><div>hand in</div></td><td><div>nộp</div></td><td><div>hand in the report</div></td></tr><tr><td><div>hand over</div></td><td><div>bàn giao</div></td><td><div>hand over the keys</div></td></tr><tr><td><div>draw up</div></td><td><div>soạn <span class=\"vi\">(văn bản)</span></div></td><td><div>draw up a contract</div></td></tr><tr><td><div>fill in / fill out</div></td><td><div>điền <span class=\"vi\">(biểu mẫu)</span></div></td><td><div>fill in the form</div></td></tr><tr><td><div>sign off (on)</div></td><td><div>phê duyệt, ký duyệt</div></td><td><div>sign off on the budget</div></td></tr><tr><td><div>back up</div></td><td><div>sao lưu / ủng hộ</div></td><td><div>back up your files</div></td></tr><tr><td><div>call off</div></td><td><div>huỷ</div></td><td><div>call off the meeting</div></td></tr><tr><td><div>put off</div></td><td><div>hoãn</div></td><td><div>put off the decision</div></td></tr><tr><td><div>bring forward</div></td><td><div>dời sớm lên</div></td><td><div>bring forward the date</div></td></tr><tr><td><div>turn down</div></td><td><div>từ chối</div></td><td><div>turn down an offer</div></td></tr><tr><td><div>come up with</div></td><td><div>nghĩ ra</div></td><td><div>come up with an idea</div></td></tr><tr><td><div>deal with</div></td><td><div>xử lý</div></td><td><div>deal with a client</div></td></tr><tr><td><div>rely on</div></td><td><div>dựa vào</div></td><td><div>rely on evidence</div></td></tr><tr><td><div>run out of</div></td><td><div>hết</div></td><td><div>run out of time</div></td></tr><tr><td><div>cut down on</div></td><td><div>cắt giảm</div></td><td><div>cut down on costs</div></td></tr><tr><td><div>catch up (with)</div></td><td><div>bắt kịp</div></td><td><div>catch up with the team</div></td></tr><tr><td><div>get back to</div></td><td><div>trả lời lại</div></td><td><div>get back to you tomorrow</div></td></tr><tr><td><div>get on with</div></td><td><div>tiếp tục / hoà thuận</div></td><td><div>get on with the work</div></td></tr><tr><td><div>keep up with</div></td><td><div>theo kịp</div></td><td><div>keep up with the changes</div></td></tr><tr><td><div>look forward to</div></td><td><div>mong đợi</div></td><td><div>look forward to your reply</div></td></tr><tr><td><div>make up for</div></td><td><div>bù lại</div></td><td><div>make up for the delay</div></td></tr><tr><td><div>pay off</div></td><td><div>trả hết / có kết quả</div></td><td><div>the strategy paid off</div></td></tr><tr><td><div>phase out</div></td><td><div>loại bỏ dần</div></td><td><div>phase out the old system</div></td></tr><tr><td><div>roll out</div></td><td><div>triển khai</div></td><td><div>roll out a new policy</div></td></tr><tr><td><div>scale up / down</div></td><td><div>tăng / giảm quy mô</div></td><td><div>scale up production</div></td></tr><tr><td><div>step down</div></td><td><div>từ chức</div></td><td><div>step down as CEO</div></td></tr><tr><td><div>wrap up</div></td><td><div>kết thúc</div></td><td><div>wrap up the meeting</div></td></tr><tr><td><div>stand for</div></td><td><div>viết tắt cho / đại diện</div></td><td><div>LLM stands for…</div></td></tr><tr><td><div>stand by</div></td><td><div>ủng hộ / sẵn sàng</div></td><td><div>stand by the decision</div></td></tr><tr><td><div>bear in mind</div></td><td><div>ghi nhớ</div></td><td><div>bear in mind the deadline</div></td></tr><tr><td><div>account for</div></td><td><div>giải thích / chiếm</div></td><td><div>account for 20% of sales</div></td></tr><tr><td><div>result in</div></td><td><div>dẫn đến</div></td><td><div>result in a delay</div></td></tr><tr><td><div>result from</div></td><td><div>do bởi</div></td><td><div>result from an error</div></td></tr><tr><td><div>lead to</div></td><td><div>dẫn tới</div></td><td><div>lead to a dispute</div></td></tr><tr><td><div>refer to</div></td><td><div>đề cập / tham chiếu</div></td><td><div>refer to Annex 2</div></td></tr><tr><td><div>apply for / apply to</div></td><td><div>xin / áp dụng cho</div></td><td><div>apply for a licence</div></td></tr><tr><td><div>object to</div></td><td><div>phản đối (+ V-ing)</div></td><td><div>object to the proposal</div></td></tr><tr><td><div>agree on / to / with</div></td><td><div>đồng ý về / với điều / với người</div></td><td><div>agree to the terms</div></td></tr></tbody></table></div></section>", "topics": [{"id": "t-o1", "title": "Nhóm với get", "number": "15.1"}, {"id": "t-o2", "title": "Nhóm với look", "number": "15.2"}, {"id": "t-o3", "title": "Nhóm với turn, take, put, give", "number": "15.3"}, {"id": "t-o4", "title": "Nhóm với break, come, go, run", "number": "15.4"}, {"id": "t-o5", "title": "Cụm động từ theo nhóm tiểu từ", "number": "15.5"}], "number": 15}, {"id": "t-p", "title": "Ngữ âm: phát âm đuôi s/es, ed và trọng âm", "html": "<section class=\"topic\" id=\"t-p1\"><h2>16.1  Cách phát âm đuôi -s / -es</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cách đọc</th><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>/iz/</div></td><td><div>Khi từ tận cùng bằng âm: s, ss, sh, ch, x, z, ge/dge</div></td><td><div>watches, washes, boxes, changes</div></td></tr><tr><td><div>/s/</div></td><td><div>Khi từ tận cùng bằng âm VÔ THANH: p, k, t, f, gh, th</div></td><td><div>stops, works, laughs, months</div></td></tr><tr><td><div>/z/</div></td><td><div>Khi từ tận cùng bằng NGUYÊN ÂM hoặc âm HỮU THANH còn lại (b, d, g, v, l, m, n, ng...)</div></td><td><div>plays, runs, dreams, loves</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ nhanh /s/ /z/</strong><p>Đặt tay lên cổ họng: nếu rung → âm HỮU THANH → đọc /z/. Nếu không rung → âm VÔ THANH → đọc /s/. Riêng nhóm s/ss/sh/ch/x/z/ge <span class=\"vi\">(tận cùng gần giống âm xì/chờ)</span> thì phải thêm nguyên âm đệm /i/ trước, đọc thành /iz/.</p></div></aside></section><section class=\"topic\" id=\"t-p2\"><h2>16.2  Cách phát âm đuôi -ed</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cách đọc</th><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>/id/</div></td><td><div>Khi động từ tận cùng bằng âm /t/ hoặc /d/</div></td><td><div>wanted, needed, decided</div></td></tr><tr><td><div>/t/</div></td><td><div>Khi động từ tận cùng bằng âm VÔ THANH <span class=\"vi\">(trừ /t/)</span>: p, k, f, s, sh, ch, x</div></td><td><div>stopped, worked, watched, laughed</div></td></tr><tr><td><div>/d/</div></td><td><div>Khi động từ tận cùng bằng NGUYÊN ÂM hoặc âm HỮU THANH còn lại <span class=\"vi\">(trừ /d/)</span></div></td><td><div>played, cleaned, studied, loved</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-p3\"><h2>16.3  Quy tắc đánh trọng âm cơ bản</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Danh từ/tính từ 2 âm tiết</div></td><td><div>trọng âm rơi vào âm tiết THỨ NHẤT</div></td><td><div>'table, 'happy, 'famous</div></td></tr><tr><td><div>Động từ 2 âm tiết</div></td><td><div>trọng âm rơi vào âm tiết THỨ HAI</div></td><td><div>be'gin, de'cide, re'lax</div></td></tr><tr><td><div>Từ có đuôi -tion, -sion, -ic, -ious, -ial, -ial, -ity</div></td><td><div>trọng âm rơi vào âm tiết NGAY TRƯỚC hậu tố đó</div></td><td><div>in'formation, e'motion, sci'entific, cu'riosity</div></td></tr><tr><td><div>Từ có đuôi -ee, -eer, -ese, -ique, -esque</div></td><td><div>trọng âm rơi vào CHÍNH hậu tố đó</div></td><td><div>employ'ee, engi'neer, Japa'nese, tech'nique</div></td></tr><tr><td><div>Danh từ ghép (compound noun)</div></td><td><div>trọng âm rơi vào từ ĐẦU TIÊN</div></td><td><div>'blackboard, 'birthday</div></td></tr><tr><td><div>Tính từ ghép / động từ ghép</div></td><td><div>trọng âm rơi vào từ THỨ HAI</div></td><td><div>well-'known, under'stand</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Đây chỉ là các quy tắc PHỔ BIẾN, tiếng Anh có khá nhiều ngoại lệ <span class=\"vi\">(ví dụ: 'answer là danh từ 2 âm tiết nhưng cũng chính là động từ giữ nguyên trọng âm âm tiết đầu)</span>. Cách chắc chắn nhất vẫn là tra từ điển và luyện nghe nhiều để quen tai.</p></div></aside></section><section class=\"topic\" id=\"t-p4\"><h2>16.4  Bổ sung quy tắc trọng âm</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Danh từ / tính từ 2 âm tiết → nhấn âm 1</div></td><td><div>'table, 'happy, 'legal, 'hotel</div></td></tr><tr><td><div>Động từ 2 âm tiết → nhấn âm 2</div></td><td><div>be'gin, de'cide, a'gree, re'fer</div></td></tr><tr><td><div>Cặp danh từ <span class=\"vi\">(âm 1)</span> ≠ động từ <span class=\"vi\">(âm 2)</span></div></td><td><div>'record (n) / re'cord (v) · 'permit / per'mit · 'present / pre'sent · 'contract / con'tract</div></td></tr><tr><td><div>Danh từ ghép → nhấn thành tố đầu</div></td><td><div>'blackboard, 'airport, 'bookshop</div></td></tr><tr><td><div>Từ có đuôi -tion, -sion, -ic, -ical, -ial, -ity, -ious, -ian → nhấn âm NGAY TRƯỚC đuôi</div></td><td><div>infor'mation, e'motion, eco'nomic, po'litical, cu'riosity</div></td></tr><tr><td><div>Đuôi -ee, -eer, -ese, -ique → nhấn chính đuôi</div></td><td><div>refu'gee, engi'neer, Chi'nese, tech'nique</div></td></tr><tr><td><div>Đuôi -ate, -ize, -ify → nhấn âm thứ 3 từ cuối</div></td><td><div>'educate, 'organize, 'justify</div></td></tr><tr><td><div>Hậu tố -ly, -ness, -ment, -ful, -less, -er, -ing KHÔNG làm đổi trọng âm</div></td><td><div>'happy → 'happily · em'ploy → em'ployment · 'care → 'careless</div></td></tr><tr><td><div>Tiền tố thường không mang trọng âm</div></td><td><div>un'happy, im'possible</div></td></tr><tr><td><div>Từ chức năng (a, the, of, to, and, for) → không nhấn</div></td><td><div>Nhấn từ MANG NGHĨA: nouns, main verbs, adjectives, adverbs.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Dùng trọng âm để nghe &amp; nói</strong><p>Người Việt hay đọc đều từng âm tiết; người bản ngữ NHẤN một âm và nuốt âm còn lại. Học trọng âm cùng với từ mới, ghi dấu ’ trước âm nhấn.</p></div></aside></section><section class=\"topic\" id=\"t-p5\"><h2>16.5  Phát âm đầy đủ: nguyên âm, phụ âm, nhịp câu</h2><p>Phần phát âm đầy đủ <span class=\"vi\">(bảng IPA, các âm người Việt dễ sai, nhịp câu, từ khó trong công việc)</span> nằm ở tab <strong>Thực hành</strong>, mục “Phát âm: biết để dùng đúng”. Ở đây là lý thuyết nền: quy tắc đuôi -s, -ed và trọng âm từ.</p></section>", "topics": [{"id": "t-p1", "title": "Cách phát âm đuôi -s / -es", "number": "16.1"}, {"id": "t-p2", "title": "Cách phát âm đuôi -ed", "number": "16.2"}, {"id": "t-p3", "title": "Quy tắc đánh trọng âm cơ bản", "number": "16.3"}, {"id": "t-p4", "title": "Bổ sung quy tắc trọng âm", "numb function homeView(){return `<section class="hero"><div class="eyebrow">CẨM NANG & LỘ TRÌNH NGỮ PHÁP</div><h1>Hiểu vì sao.<br><span class="blue">Dùng đúng ngữ cảnh.</span></h1><p>Bắt đầu từ điều bạn muốn diễn đạt. Hiểu ý nghĩa, đối chiếu lựa chọn và kiểm tra bằng một tình huống mới.</p><div class="hero-actions"><button class="primary" data-route="lesson">Bắt đầu bài học mẫu <span aria-hidden="true">→</span></button><button class="secondary" data-route="path">Xem lộ trình</button></div></section><section class="feature"><div class="feature-copy"><span class="tag">BÀI HỌC MẪU · ĐỐI CHIẾU</span><h2>Past Simple hay<br>Present Perfect?</h2><p>Cùng nói về việc đã xảy ra. Vì sao có lúc dùng “I signed”, có lúc dùng “I have signed”?</p><p>Đi từ một cuộc hội thoại đến cách lựa chọn thì, rồi tự kiểm tra với 4 tình huống.</p><button class="primary" data-route="lesson">Khám phá bài học</button></div><div class="feature-art" aria-label="Hai cách nhìn một sự việc đã xảy ra"><div class="time-mini"><div class="mini-label"><span>PAST SIMPLE</span><span>Thời gian đã kết thúc</span></div><strong>I signed it yesterday.</strong><div class="time-track past"></div><div class="mini-foot"><span>Hôm qua</span><span>Hiện tại</span></div></div><div class="time-mini"><div class="mini-label"><span>PRESENT PERFECT</span><span>Liên hệ với hiện tại</span></div><strong>I have signed it.</strong><div class="time-track present"></div><div class="mini-foot"><span>Trước đây</span><span>Đến hiện tại</span></div></div></div></section><div class="section-title"><h2>Một hệ thống. Nhiều điểm bắt đầu.</h2><p>Chọn nhóm kiến thức cần tìm hiểu.</p></div><div class="group-grid">${groupCards()}</div>${footer()}`}

function stepNav(){return LESSON_STEPS.map(([id,t],i)=>`<a href="#${id}" data-lesson-jump="${id}">${String(i+1).padStart(2,'0')} &nbsp; ${t}</a>`).join('')}
function lessonView(){return `<button class="back-link" data-route="home">← Tổng quan</button><div class="lesson-layout"><article class="lesson-body"><header class="lesson-head"><span class="tag">BÀI HỌC MẪU · HỆ THỐNG ĐỘNG TỪ</span><h1>Past Simple<br><span class="blue">& Present Perfect</span></h1><p class="lead">Cùng là việc đã xảy ra. Khác nhau ở cách người nói đặt sự việc vào thời gian và liên hệ với hiện tại.</p><div class="lesson-meta"><span>Kiến thức trước: chủ ngữ, V2, V3</span><span>6 bước · 4 câu kiểm tra</span></div><div class="objectives"><strong>Sau bài này, bạn có thể:</strong><ul><li>Giải thích sự khác nhau giữa kể một sự việc quá khứ và cập nhật tình trạng hiện tại.</li><li>Chọn thì theo ngữ cảnh, thay vì chỉ dò “từ nhận biết”.</li><li>Chuyển từ thông báo kết quả sang hỏi thời điểm trong hội thoại.</li></ul></div></header><details class="mobile-section-picker"><summary>Trong bài học này</summary>${stepNav()}</details>
<section class="lesson-card" id="s-context"><div class="lesson-number">01 / TÌNH HUỐNG</div><h2>Hợp đồng đã ký chưa?</h2><p>Hai đồng nghiệp đang chuẩn bị gửi hồ sơ. Linh cần biết tình trạng hiện tại của hợp đồng, sau đó hỏi thêm thời điểm ký.</p><div class="context"><div class="context-label">TẠI VĂN PHÒNG · CUỘC TRAO ĐỔI HIỆN TẠI</div><div class="dialogue"><span class="speaker">L</span><div>Have you signed the agreement?<small>Bạn đã ký hợp đồng chưa?</small></div></div><div class="dialogue"><span class="speaker">M</span><div>Yes, I <b>have signed</b> it. It is ready to send.<small>Rồi, tôi đã ký. Hợp đồng sẵn sàng để gửi.</small></div></div><div class="dialogue"><span class="speaker">L</span><div>When <b>did you sign</b> it?<small>Bạn ký lúc nào?</small></div></div><div class="dialogue"><span class="speaker">M</span><div>I <b>signed</b> it yesterday.<small>Tôi ký hôm qua.</small></div></div></div><div class="reflect">Cùng một việc ký. Vì sao câu trả lời đầu dùng “have signed”, còn câu cuối dùng “signed”?<details><summary>Xem gợi ý</summary><p>Câu đầu cập nhật tình trạng liên quan đến hiện tại. Câu cuối đặt việc ký vào “hôm qua”, một khoảng thời gian đã kết thúc.</p></details></div></section>
<section class="lesson-card" id="s-meaning"><div class="lesson-number">02 / HIỂU Ý NGHĨA</div><h2>Chọn khung nhìn trước khi chọn thì.</h2><div class="comparison"><div class="compare-card past"><h3>Past Simple</h3><p>Đặt sự việc vào một khoảng thời gian quá khứ đã kết thúc. Thời gian có thể được nói rõ hoặc đã được hiểu trong ngữ cảnh.</p><p class="example">I signed it yesterday.</p><p>Trọng tâm: việc ký xảy ra trong hôm qua.</p></div><div class="compare-card"><h3>Present Perfect</h3><p>Nhìn lại từ hiện tại: kết quả hiện tại, trải nghiệm đến nay hoặc sự việc trong khoảng thời gian kéo dài đến hiện tại.</p><p class="example">I have signed it.</p><p>Trong tình huống trên: cập nhật rằng việc ký đã hoàn tất.</p></div></div>${timeline()}<div class="callout">Sơ đồ minh họa quan hệ thời gian trong ví dụ, không có nghĩa “Present Perfect” luôn là hành động kéo dài. Việc ký đã hoàn thành; quan hệ với hiện tại nằm ở cách người nói trình bày sự việc.</div><p><b>Điều cần tránh:</b> hiểu rằng Past Simple là “không còn liên quan hiện tại”. Một việc kể bằng quá khứ đơn vẫn có thể có hậu quả hiện tại. Điểm khác nằm ở khung thời gian và trọng tâm diễn đạt.</p></section>
<section class="lesson-card" id="s-compare"><div class="lesson-number">03 / ĐỐI CHIẾU CÁCH DÙNG</div><h2>Ý định thay đổi. Cách nói thay đổi.</h2><div class="example-list"><div class="example-row"><b>I finished the report at 9 a.m.</b><p>Kể sự việc ở một thời điểm quá khứ cụ thể. Ngữ cảnh xác định 9 giờ là thời điểm đã qua.</p><b>I have finished the report. You can review it now.</b><p>Cập nhật kết quả để người nghe hành động ở hiện tại; không xác định thời điểm hoàn thành.</p></div><div class="example-row"><b>Did you negotiate the contract last year?</b><p>Hỏi một sự việc trong năm ngoái, một giai đoạn đã kết thúc.</p><b>Have you ever negotiated a contract in English?</b><p>Hỏi trải nghiệm từ trước đến nay, không chỉ một thời điểm cụ thể.</p></div><div class="example-row"><b>I reviewed three contracts last week.</b><p>Tổng kết trong tuần trước, một khoảng thời gian đã kết thúc.</p><b>I have reviewed three contracts so far this week.</b><p>Đếm số hợp đồng tính đến hiện tại; tuần này vẫn đang tiếp diễn.</p></div></div><div class="callout warm"><b>Từ chỉ thời gian là dữ kiện, không phải nút chọn thì.</b><br>“Today” và “this week” cần được đọc trong ngữ cảnh. “For” cũng không tự động dẫn đến hiện tại hoàn thành: “I worked there for two years” có thể nói về một giai đoạn làm việc đã kết thúc.</div><details class="model-answer"><summary>Mở rộng: Anh-Anh và Anh-Mỹ</summary><p>Bài này dùng cách đối chiếu phổ biến trong tiếng Anh-Anh chuẩn. Tiếng Anh-Mỹ thường dùng Past Simple trong một số ngữ cảnh có “just”, “already” hoặc “yet” mà tiếng Anh-Anh hay dùng Present Perfect. Không nên đánh giá một câu ngoài ngữ cảnh chỉ dựa trên danh sách từ nhận biết.</p></details></section>
<section class="lesson-card" id="s-form"><div class="lesson-number">04 / CẤU TRÚC CÂU</div><h2>Hình thức phục vụ ý nghĩa.</h2><p>Khi đã xác định khung nhìn, dùng cấu trúc tương ứng. V2 là dạng quá khứ; V3 là dạng phân từ quá khứ.</p><table class="structure-table"><thead><tr><th>Dạng câu</th><th>Past Simple</th><th>Present Perfect</th></tr></thead><tbody><tr><td>Khẳng định</td><td><code>S + V2/ed</code><br>She signed it.</td><td><code>S + have/has + V3</code><br>She has signed it.</td></tr><tr><td>Phủ định</td><td><code>S + did not + V</code><br>She did not sign it.</td><td><code>S + have/has not + V3</code><br>She has not signed it.</td></tr><tr><td>Câu hỏi</td><td><code>Did + S + V?</code><br>Did she sign it?</td><td><code>Have/Has + S + V3?</code><br>Has she signed it?</td></tr></tbody></table><div class="callout">Sau “did”, dùng động từ nguyên mẫu: <b>Did she sign…?</b> Với hiện tại hoàn thành, vẫn giữ V3: <b>Has she signed…?</b> Bảng Past Simple này áp dụng cho động từ thường; “be” dùng was/were.</div><div class="lesson-links"><button data-route="chapter/16">Tra V2 / V3 →</button><button data-route="chapter/1">Đọc hệ thống các thì →</button></div></section>
<section class="lesson-card" id="s-practice"><div class="lesson-number">05 / KIỂM TRA HIỂU</div><h2>Chọn theo tình huống.</h2><p>Chọn cách nói phù hợp với ý định đã nêu. Phản hồi sẽ giải thích cả lựa chọn và giới hạn của quy tắc.</p><form id="quiz-form">${QUIZ.map((q,i)=>`<fieldset class="quiz-item"><legend>CÂU ${i+1} / ${QUIZ.length}</legend><p class="quiz-context">${esc(q.context)}</p><p class="quiz-question">${esc(q.question)}</p><div class="quiz-options">${q.options.map((opt,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}"><span>${esc(opt)}</span></label>`).join('')}</div><div class="feedback" id="feedback-${i}" hidden></div></fieldset>`).join('')}<p class="quiz-status" id="quiz-status" role="status" aria-live="polite">Chưa chọn đáp án · 0/4 câu.</p><div class="quiz-actions"><button class="primary" type="submit">Kiểm tra & xem giải thích</button><button class="secondary" type="button" id="quiz-reset">Làm lại</button></div></form></section>
<section class="lesson-card" id="s-transfer"><div class="lesson-number">06 / TỰ VẬN DỤNG</div><h2>Một sự việc. Hai câu nói.</h2><p>Bạn vừa hoàn thành bản báo cáo. Viết một câu thông báo cho đồng nghiệp rằng bản báo cáo sẵn sàng để đọc. Sau đó viết một câu nói rõ bạn hoàn thành nó hôm qua.</p><label class="transfer-label" for="transfer">Hai câu của bạn</label><textarea class="transfer" id="transfer" placeholder="1. …\n2. …"></textarea><p class="transfer-note">Ô nháp dùng để tự đối chiếu, chưa có chấm tự động. Nội dung chỉ giữ trong phiên trang đang mở.</p><details class="model-answer"><summary>Xem đáp án gợi ý & tự đối chiếu</summary><p><b>1. I have finished the report. It is ready for you to review.</b><br><b>2. I finished it yesterday.</b></p><p>Tự kiểm tra: câu đầu đã thể hiện cập nhật kết quả hiện tại chưa? Câu thứ hai đã dùng quá khứ đơn với “yesterday” chưa? “Finished” trùng dạng V2 và V3, nhưng trợ động từ và ý nghĩa của hai câu khác nhau.</p></details><div class="callout"><b>Điều cần mang theo:</b><br>Đừng bắt đầu bằng “câu này có từ nhận biết nào?”. Hãy hỏi “người nói đang đặt việc này trong khoảng thời gian nào, và muốn người nghe chú ý điều gì?”.</div><div class="lesson-links"><button data-route="chapter/1">Đọc thêm: thì của động từ →</button><button data-route="path">Trở về lộ trình →</button></div></section></article><aside class="lesson-toc"><div class="eyebrow">TRONG BÀI HỌC NÀY</div>${stepNav()}<p class="small-note">Học theo thứ tự ở lần đầu.<br>Quay lại từng phần khi cần ôn.</p></aside></div>${footer()}`}
let SEARCH_INDEX=null;
function fold(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ')}
function searchIndex(){if(SEARCH_INDEX)return SEARCH_INDEX;const items=[{title:'Past Simple & Present Perfect',category:'Bài học mẫu · 6 bước',text:'Phân biệt quá khứ đơn và hiện tại hoàn thành qua tình huống ký hợp đồng. Đối chiếu thời gian đã kết thúc, kết quả hiện tại và trải nghiệm; có bài tập kèm giải thích.',route:'lesson'}];BOOK.forEach((c,i)=>{const doc=new DOMParser().parseFromString(c.html,'text/html');c.topics.forEach(t=>{const el=doc.getElementById(t.id);if(!el)return;const copy=el.cloneNode(true);copy.querySelectorAll('h2,h3,p,li,td,th,div').forEach(node=>node.append(' '));items.push({title:t.title,category:c.title,text:copy.textContent.replace(/\s+/g,' ').trim(),route:'chapter/'+i,jump:t.id})});});SEARCH_INDEX=items;return items}
function searchView(){return `<header class="view-head"><div class="eyebrow">TÌM TRONG NỘI DUNG</div><h1>Bạn đang muốn hiểu điều gì?</h1><p>Tìm theo chủ đề, cấu trúc, từ hoặc câu ví dụ. Kết quả dẫn đến đúng mục trong tài liệu.</p></header><div class="search-box"><input type="search" id="search-input" placeholder="Ví dụ: hiện tại hoàn thành, used to, since…" aria-label="Tìm kiếm nội dung" autocomplete="off"></div><div class="search-hints">Thử tìm: <button data-query="hiện tại hoàn thành">hiện tại hoàn thành</button><button data-query="used to">used to</button><button data-query="mệnh đề quan hệ">mệnh đề quan hệ</button></div><div id="search-results" aria-live="polite"><p class="result-count">Nhập từ khóa để tìm trong 17 chương và bài học mẫu.</p></div>${footer()}`}
function highlight(s,q){const f=fold(s),idx=f.indexOf(fold(q));if(idx<0||fold(s).length!==s.length)return esc(s);return esc(s.slice(0,idx))+'<mark>'+esc(s.slice(idx,idx+q.length))+'</mark>'+esc(s.slice(idx+q.length))}
function runSearch(q){q=q.trim();if(!q){$('search-results').innerHTML='<p class="result-count">Nhập từ khóa để tìm trong 17 chương và bài học mẫu.</p>';return}const tokens=fold(q).split(' ').filter(Boolean);const results=searchIndex().filter(x=>tokens.every(t=>fold(x.title+' '+x.text).includes(t))).sort((a,b)=>Number(fold(b.title).includes(fold(q)))-Number(fold(a.title).includes(fold(q))));$('search-results').innerHTML=`<p class="result-count">${results.length} mục phù hợp${results.length>30?' · Hiển thị 30 mục đầu':''}.</p>`+(results.length?results.slice(0,30).map(x=>{const pos=Math.max(0,fold(x.text).indexOf(fold(q))-65),snippet=(pos?'…':'')+x.text.slice(pos,pos+240)+(x.text.length>pos+240?'…':'');return `<button class="search-result" data-route="${x.route}" ${x.jump?`data-target="${esc(x.jump)}"`:''}><div class="result-category">${esc(x.category)}</div><strong>${highlight(x.title,q)}</strong><p>${highlight(snippet,q)}</p></button>`}).join(''):'<div class="empty">Chưa thấy mục phù hợp. Thử tên cấu trúc hoặc từ khóa ngắn hơn, bằng tiếng Việt hoặc tiếng Anh.</div>')}
function mobileTables(){document.querySelectorAll('.book table, .structure-table').forEach(t=>{const heads=[...t.querySelectorAll('thead th')].map(e=>e.textContent.trim());if(!heads.length||t.querySelector('[rowspan],[colspan]'))return;t.classList.add('mobile-table');t.querySelectorAll('tbody tr').forEach(row=>[...row.children].forEach((td,i)=>td.dataset.label=heads[i]||''))})}
function bindQuiz(){const form=$('quiz-form');if(!form)return;form.onchange=()=>{const n=QUIZ.filter((_,i)=>form.querySelector(`input[name=q${i}]:checked`)).length;$('quiz-status').textContent=`Đã chọn ${n}/4 câu. Nhấn kiểm tra để xem phản hồi.`;form.querySelectorAll('.feedback').forEach(e=>e.hidden=true)};form.onsubmit=e=>{e.preventDefault();let answered=0,correct=0;QUIZ.forEach((q,i)=>{const input=form.querySelector(`input[name=q${i}]:checked`),out=$('feedback-'+i);out.hidden=false;if(!input){out.className='feedback retry';out.textContent='Bạn chưa chọn câu này. Hãy đọc tình huống và thử một phương án.';return}answered++;const yes=Number(input.value)===q.correct;if(yes)correct++;out.className='feedback'+(yes?'':' retry');out.textContent=(yes?'Phù hợp. ':'Hãy đối chiếu lại ý định. ')+q.why});$('quiz-status').textContent=answered<4?`Đã trả lời ${answered}/4 câu; ${correct} lựa chọn phù hợp. Hãy hoàn thành các câu còn lại.`:`${correct}/4 lựa chọn phù hợp với tình huống. Đọc phản hồi rồi thử tự vận dụng.`};$('quiz-reset').onclick=()=>{form.reset();form.querySelectorAll('.feedback').forEach(e=>e.hidden=true);$('quiz-status').textContent='Chưa chọn đáp án · 0/4 câu.'}}
let pendingTarget=null,observer=null;
function go(route,target=null){pendingTarget=target;if(location.hash.slice(1)===route){render(route)}else location.hash=route}
function jump(id){const el=document.getElementById(id);if(!el)return;const details=el.closest('details');if(details)details.open=true;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}
function render(raw){if(observer)observer.disconnect();const route=raw||'home',parts=route.split('/'),view=parts[0];const valid=['home','path','lesson','library','chapter','search'];if(!valid.includes(view)){go('home');return}closeMenu();document.querySelectorAll('.nav-item').forEach(e=>{const on=e.dataset.route===(view==='chapter'?'library':view);e.classList.toggle('active',on);if(on)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')});document.querySelectorAll('.rail-group').forEach(e=>e.classList.toggle('active',e.dataset.route===route||(view==='chapter'&&CURRICULUM.find(g=>g.chapters.includes(Number(parts[1])))?.id===e.dataset.route.split('/')[1])));const name=NAV.find(x=>x[0]===view)?.[1]||'Thư viện / Tài liệu tham khảo';$('crumb').textContent=name;document.title=name+' — English Grammar';$('main').innerHTML=view==='home'?homeView():view==='path'?pathView():view==='lesson'?lessonView():view==='library'?libraryView(parts[1]):view==='chapter'?chapterView(Number(parts[1])):searchView();window.scrollTo(0,0);mobileTables();bindQuiz();if(view==='search'){$('search-input').oninput=e=>runSearch(e.target.value);$('search-input').focus({preventScroll:true})}if(view==='lesson'&&'IntersectionObserver'in window){observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.lesson-toc a').forEach(a=>a.classList.toggle('active',a.dataset.lessonJump===e.target.id))}),{rootMargin:'-10% 0px -65% 0px'});LESSON_STEPS.forEach(([id])=>observer.observe($(id)))}if(pendingTarget){const target=pendingTarget;pendingTarget=null;requestAnimationFrame(()=>jump(target))}}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){go(route.dataset.route,route.dataset.target||null);return}const j=e.target.closest('[data-jump]');if(j){jump(j.dataset.jump);return}const l=e.target.closest('[data-lesson-jump]');if(l){e.preventDefault();jump(l.dataset.lessonJump);return}const q=e.target.closest('[data-query]');if(q&&$('search-input')){$('search-input').value=q.dataset.query;runSearch(q.dataset.query);return}const a=e.target.closest('.tense-jump a');if(a){e.preventDefault();jump(a.getAttribute('href').slice(1))}});
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));nav();render(location.hash.slice(1));

</script></body></html>
