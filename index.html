<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>English Handbook</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--fg:#172438;--mut:#53647c;--line:#d9e1ec;--ac:#175ac6;--tip:#e7f0ff;--note:#fff1dd;--good:#e1f3e9;--bad:#fce7e9;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#18212f;--fg:#e8edf5;--mut:#9fb0c7;--line:#2a3648;--ac:#7fb0ff;--tip:#1b2d4a;--note:#3a2c15;--good:#143324;--bad:#3b1c22}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit}
#top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:calc(8px + var(--sat)) calc(12px + var(--sar)) 8px calc(12px + var(--sal));background:var(--card);border-bottom:1px solid var(--line)}
#top button{min-width:44px;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:10px;font-size:20px;cursor:pointer}
#mb{display:none}
.brand{white-space:nowrap}
#q{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px}
#shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1400px;margin:0 auto}
#nav{position:sticky;top:calc(61px + var(--sat));height:calc(100vh - 61px - var(--sat));overflow:auto;padding:12px 12px calc(20px + var(--sab)) calc(12px + var(--sal));border-right:1px solid var(--line)}
#nav h4{margin:16px 6px 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer}
.tabs .on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.it{display:flex;gap:8px;width:100%;min-height:44px;align-items:center;text-align:left;padding:6px 10px;border:0;background:transparent;border-radius:10px;font-size:15px;line-height:1.35;cursor:pointer}
.it:hover,.it.on{background:var(--tip)}
.ck{width:1.2em;flex:none;color:var(--ac)}
#main{min-width:0;padding-bottom:calc(20px + var(--sab));padding-right:var(--sar)}
.art{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,36px);margin:16px}
.art h1{font-size:clamp(24px,5vw,32px);line-height:1.25;margin:4px 0 12px}
.tag{color:var(--mut);font-size:14px}
.art p{margin:0 0 .9em;overflow-wrap:anywhere}
.callout{border-radius:12px;padding:12px 16px;margin:14px 0;border-left:4px solid var(--ac);background:var(--tip)}
.callout.note{background:var(--note);border-color:#c27a21}
.callout p{margin:.4em 0 0}
.bad,.good{border-radius:8px;padding:8px 12px;margin:8px 0}
.bad{background:var(--bad)}
.good{background:var(--good)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.acts button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}
.acts .p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.res{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.res small{color:var(--mut);display:block}
.msg{padding:20px 16px}
.msg input{width:100%;min-height:44px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0}
.msg button{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--ac);color:var(--bg);cursor:pointer}
.err{color:#c43d4a}
.st{font-size:13px;color:var(--mut);padding:0 20px}
#scrim{display:none;position:fixed;inset:0;background:#0006;z-index:25}
@media(max-width:1023px){
 #shell{display:block}
 #mb{display:block}
 #nav{position:fixed;z-index:30;top:0;left:0;bottom:0;width:min(86vw,320px);height:auto;background:var(--card);padding-top:calc(12px + var(--sat));transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px #0004}
 #nav.open{transform:none}
 #scrim.on{display:block}
 .art{margin:12px}
}
@media(max-width:480px){.brand{display:none}}
@media(prefers-reduced-motion:reduce){#nav{transition:none}}
@media print{#top,#nav,.acts,.st{display:none}#shell{display:block}.art{border:0;margin:0}}
</style>
</head>
<body>
<header id="top">
 <button id="mb" aria-label="Mở menu" aria-expanded="false">☰</button>
 <b class="brand">English Handbook</b>
 <input id="q" type="search" placeholder="Tìm kiến thức…" aria-label="Tìm kiếm" autocomplete="off">
 <button id="cfg" aria-label="Cài đặt nguồn dữ liệu">⚙</button>
</header>
<div id="shell"><nav id="nav" aria-label="Mục lục"></nav><main id="main" tabindex="-1"></main></div>
<div id="scrim"></div>

<script>
// Điền URL web app (/exec) của Apps Script vào đây, hoặc nhập trên màn hình cài đặt khi mở lần đầu.
const CFG = { API_URL: '' };

const CATS = [['theory','Lý thuyết'],['listening','Nghe'],['speaking','Nói'],['reading','Đọc'],['writing','Viết'],['practice','Thực hành']];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const catName = c => (CATS.find(x => x[0]===c) || [c,c])[1];

let ROWS = [], DONE = store.get('hb_done',{}), CAT = 'theory', CUR = null, SRC = '';

function norm(j){
  let a = Array.isArray(j) ? j : (j && (j.data || j.rows || j.items || j.Handbook_Data)) || Object.values(j || {}).find(Array.isArray) || [];
  if (a.length && Array.isArray(a[0])) {
    const h = a[0].map(x => String(x).toLowerCase());
    a = a.slice(1).map(r => Object.fromEntries(h.map((k,i) => [k, r[i]])));
  }
  return a.map(o => {
    const m = {}; for (const k in o) m[k.toLowerCase()] = o[k];
    return { cat:String(m.category||'').trim(), title:String(m.title||''), content:String(m.content||''), tag:String(m.tag||''), id:String(m.section_id||m.id||'') };
  }).filter(r => r.id && r.cat && r.cat !== 'journal');
}

// Nội dung trong Sheet là văn bản phẳng: nhận diện tạm các khung Mẹo/Chú ý và ✗/✓
function fmt(c){
  const t = esc(c).replace(/ (✗|✓) /g,'\n$1 ').replace(/ (Mẹo|Chú ý|Lưu ý|Ngữ điệu) /g,'\n\n@@$1@@');
  const body = l => l.split('\n').filter(Boolean).map(x => x[0]==='✗' ? `<div class="bad">${x}</div>` : x[0]==='✓' ? `<div class="good">${x}</div>` : `<p>${x}</p>`).join('');
  return t.split('\n\n').map(p => {
    const m = /^@@([^@]+)@@([\s\S]*)$/.exec(p);
    return m ? `<div class="callout${m[1]==='Mẹo'?'':' note'}"><b>${m[1]}</b> ${body(m[2].trim())}</div>` : body(p);
  }).join('');
}

function nav(){
  const list = ROWS.filter(r => r.cat===CAT), done = list.filter(r => DONE[r.id]).length;
  let h = '', last = null;
  list.forEach(r => {
    if (CAT==='theory' && r.tag!==last){ h += `<h4>${esc(r.tag)}</h4>`; last = r.tag; }
    h += `<button class="it${r.id===CUR?' on':''}" data-id="${esc(r.id)}"><span class="ck">${DONE[r.id]?'✓':''}</span>${esc(r.title)}</button>`;
  });
  $('#nav').innerHTML = `<div class="tabs">${CATS.filter(c => ROWS.some(r => r.cat===c[0])).map(c => `<button data-cat="${c[0]}" class="${c[0]===CAT?'on':''}">${c[1]}</button>`).join('')}</div><div class="tag" style="margin:0 6px 8px">Đã ôn ${done}/${list.length}</div>${h}`;
}

function status(){ return `<p class="st">${ROWS.length} mục · ${SRC==='cache' ? 'đang dùng dữ liệu đã lưu trên máy' : 'đã cập nhật từ Google Sheet'}</p>`; }

function openTopic(id){
  const r = ROWS.find(x => x.id===id); if (!r) return;
  CUR = id; CAT = r.cat; nav();
  const list = ROWS.filter(x => x.cat===r.cat), i = list.findIndex(x => x.id===id);
  $('#main').innerHTML = `<article class="art"><div class="tag">${esc(catName(r.cat))}${r.cat==='theory' ? ' · '+esc(r.tag) : ''}</div><h1>${esc(r.title)}</h1>${fmt(r.content)}<div class="acts"><button class="p" id="dn">${DONE[id]?'✓ Đã ôn (bấm để bỏ)':'Đánh dấu đã ôn'}</button>${i>0?`<button data-go="${esc(list[i-1].id)}">← Trước</button>`:''}${i<list.length-1?`<button data-go="${esc(list[i+1].id)}">Sau →</button>`:''}</div></article>${status()}`;
  $('#dn').onclick = () => { DONE[id] = !DONE[id]; store.set('hb_done', DONE); openTopic(id); };
  closeNav(); window.scrollTo(0,0);
  if (decodeURIComponent(location.hash.slice(1)) !== id) history.replaceState(null,'','#'+encodeURIComponent(id));
}

function search(v){
  const q = fold(v).trim();
  if (q.length < 2) return CUR ? openTopic(CUR) : null;
  const toks = q.split(/\s+/);
  const res = ROWS.filter(r => { const s = fold(r.title+' '+r.content); return toks.every(t => s.includes(t)); }).slice(0,40);
  $('#main').innerHTML = `<div class="msg"><b>${res.length} kết quả</b>${res.map(r => {
    const i = Math.max(0, fold(r.content).indexOf(toks[0]) - 40);
    return `<button class="res" data-id="${esc(r.id)}"><b>${esc(r.title)}</b><small>${esc(catName(r.cat))}</small>${esc(r.content.slice(i,i+160))}…</button>`;
  }).join('')}</div>`;
}

function setup(msg){
  $('#nav').innerHTML = ''; closeNav();
  $('#main').innerHTML = `<div class="msg"><h2>Nguồn dữ liệu</h2><p>Dán URL web app của Apps Script (kết thúc bằng <code>/exec</code>) đã triển khai từ Google Sheet.</p><input id="api" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(store.get('hb_api','')||CFG.API_URL)}"><button id="sv">Lưu và tải</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`;
  $('#sv').onclick = () => { store.set('hb_api', $('#api').value.trim()); load(); };
}

function init(rows, src, keep){
  ROWS = rows; SRC = src;
  if (keep && CUR) { nav(); return; }
  const id = decodeURIComponent(location.hash.slice(1));
  const first = rows.find(r => r.id===id) || rows.find(r => r.cat==='theory') || rows[0];
  if (first) openTopic(first.id);
}

async function load(){
  const url = store.get('hb_api','') || CFG.API_URL;
  if (!url){ setup(); return; }
  const cached = store.get('hb_cache', null);
  if (cached && cached.length) init(cached, 'cache');
  try{
    const r = await fetch(url);
    const rows = norm(await r.json());
    if (!rows.length) throw new Error('Không đọc được dòng dữ liệu nào');
    store.set('hb_cache', rows);
    init(rows, 'live', !!(cached && cached.length));
  }catch(e){
    if (!cached || !cached.length) setup('Không tải được dữ liệu: ' + e.message + '. Kiểm tra URL, quyền truy cập "Anyone" và định dạng JSON.');
  }
}

function closeNav(){ $('#nav').classList.remove('open'); $('#scrim').classList.remove('on'); $('#mb').setAttribute('aria-expanded','false'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-cat],[data-go]'); if (!t) return;
  if (t.dataset.cat){ CAT = t.dataset.cat; nav(); return; }
  openTopic(t.dataset.id || t.dataset.go);
});
$('#mb').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#scrim').classList.toggle('on', o); $('#mb').setAttribute('aria-expanded', String(o)); };
$('#scrim').onclick = closeNav;
document.addEventListener('keydown', e => { if (e.key==='Escape') closeNav(); });
$('#q').addEventListener('input', e => search(e.target.value));
$('#cfg').onclick = () => setup();
window.addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id!==CUR) openTopic(id); });
load();
</script>
</body>
</html>
