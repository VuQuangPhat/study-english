ng lai hoàn thành tiếp diễn (will + have been + V-ing)</div></td><td><div>Nhấn mạnh khoảng thời gian đã kéo dài tính đến 1 mốc trong tương lai</div></td><td><div>By next June, I will have been working here for 5 years.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt will và be going to</strong><p>will: quyết định NGHĨ RA NGAY lúc nói, không có kế hoạch trước. be going to: đã LÊN KẾ HOẠCH từ trước, hoặc có DẤU HIỆU rõ ràng ngay trước mắt. Ví dụ kinh điển: \"The phone's ringing.\" \"I'll answer it.\" <span class=\"vi\">(quyết định tức thời)</span> &gt;&lt; \"I'm going to call the client back at 3.\" <span class=\"vi\">(đã định sẵn từ trước)</span></p></div></aside><h3>Mệnh đề chỉ thời gian nói về tương lai</h3><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Trong mệnh đề bắt đầu bằng when, as soon as, before, after, until/till, while, by the time... nói về tương lai, ta KHÔNG dùng will/be going to mà dùng hiện tại đơn <span class=\"vi\">(hoặc hiện tại hoàn thành nếu nhấn mạnh việc phải hoàn tất trước)</span>.</p><p>I'll call you when I arrive. <span class=\"vi\">(KHÔNG nói \"when I will arrive\")</span></p><p>I'll text you as soon as I have finished the report.</p></div></aside><h3>Bảng tổng hợp dấu hiệu nhận biết 12 thì</h3><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Thì</th><th>Dấu hiệu</th></tr></thead><tbody><tr><td><div>Hiện tại đơn</div></td><td><div>always, usually, often, every day, sometimes, never</div></td></tr><tr><td><div>Hiện tại tiếp diễn</div></td><td><div>now, right now, at the moment, Look!, Listen!</div></td></tr><tr><td><div>Hiện tại hoàn thành</div></td><td><div>already, just, yet, ever, never, since, for, so far</div></td></tr><tr><td><div>Hiện tại hoàn thành TD</div></td><td><div>for + khoảng thời gian, how long, lately, recently <span class=\"vi\">(nhấn mạnh quá trình)</span></div></td></tr><tr><td><div>Quá khứ đơn</div></td><td><div>yesterday, last..., ...ago, in + năm đã qua</div></td></tr><tr><td><div>Quá khứ tiếp diễn</div></td><td><div>at + giờ + thời điểm quá khứ, while, when + QKĐ xen vào</div></td></tr><tr><td><div>Quá khứ hoàn thành</div></td><td><div>before, after, by the time, already <span class=\"vi\">(trong quá khứ)</span>, when + QKHT</div></td></tr><tr><td><div>Quá khứ hoàn thành TD</div></td><td><div>for + khoảng thời gian trước một mốc quá khứ</div></td></tr><tr><td><div>Tương lai đơn (will)</div></td><td><div>tomorrow, next..., in the future, I think/promise...</div></td></tr><tr><td><div>Be going to</div></td><td><div>kế hoạch đã định, dấu hiệu rõ ràng</div></td></tr><tr><td><div>Tương lai tiếp diễn</div></td><td><div>at this time tomorrow, this time next week</div></td></tr><tr><td><div>Tương lai hoàn thành</div></td><td><div>by + mốc tương lai, by the time + hiện tại đơn</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-b3x\"><h2>2.5  Cây chọn cách nói về tương lai</h2><p>Tiếng Anh có nhiều cách nói về tương lai. Mỗi cách mang một sắc thái khác. Đi từ trên xuống, dừng ở câu hỏi đầu tiên bạn trả lời “Có”.</p><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Cây quyết định chọn cách nói về tương lai\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 460\"><rect class=\"fa\" height=\"40\" rx=\"10\" width=\"220\" x=\"250\" y=\"6\"></rect><text class=\"tw\" text-anchor=\"middle\" x=\"360.0\" y=\"26.0\"><tspan dy=\"0.00em\" x=\"360.0\">Bạn muốn nói về TƯƠNG LAI</tspan></text><line class=\"ln\" x1=\"360\" x2=\"360\" y1=\"46\" y2=\"68\"></line><rect class=\"nq\" height=\"44\" rx=\"10\" width=\"420\" x=\"150\" y=\"70\"></rect><text class=\"tx\" text-anchor=\"middle\" x=\"360.0\" y=\"92.0\"><tspan dy=\"0.00em\" x=\"360.0\">Lịch trình / thời gian biểu cố định?</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"570\" x2=\"610\" y1=\"92\" y2=\"92\"></line><text class=\"tg\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"590\" y=\"84\"><tspan dy=\"0.00em\" x=\"590\">Có</tspan></text><rect class=\"ng\" height=\"44\" rx=\"10\" width=\"150\" x=\"612\" y=\"70\"></rect><text class=\"tb\" text-anchor=\"middle\" x=\"687.0\" y=\"92.0\"><tspan dy=\"0.00em\" x=\"687.0\">Present simple</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"687\" y=\"130\"><tspan dy=\"0.00em\" x=\"687\">The train leaves at 7.</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"360\" x2=\"360\" y1=\"114\" y2=\"158\"></line><text class=\"tr\" style=\"font-size:12px\" text-anchor=\"start\" x=\"382\" y=\"140\"><tspan dy=\"0.00em\" x=\"382\">Không</tspan></text><rect class=\"nq\" height=\"44\" rx=\"10\" width=\"420\" x=\"150\" y=\"170\"></rect><text class=\"tx\" text-anchor=\"middle\" x=\"360.0\" y=\"192.0\"><tspan dy=\"0.00em\" x=\"360.0\">Đã SẮP XẾP cụ thể (giờ, người, nơi)?</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"570\" x2=\"610\" y1=\"192\" y2=\"192\"></line><text class=\"tg\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"590\" y=\"184\"><tspan dy=\"0.00em\" x=\"590\">Có</tspan></text><rect class=\"ng\" height=\"44\" rx=\"10\" width=\"150\" x=\"612\" y=\"170\"></rect><text class=\"tb\" text-anchor=\"middle\" x=\"687.0\" y=\"192.0\"><tspan dy=\"0.00em\" x=\"687.0\">Present continuous</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"687\" y=\"230\"><tspan dy=\"0.00em\" x=\"687\">I'm meeting Lan at 3.</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"360\" x2=\"360\" y1=\"214\" y2=\"258\"></line><text class=\"tr\" style=\"font-size:12px\" text-anchor=\"start\" x=\"382\" y=\"240\"><tspan dy=\"0.00em\" x=\"382\">Không</tspan></text><rect class=\"nq\" height=\"44\" rx=\"10\" width=\"420\" x=\"150\" y=\"270\"></rect><text class=\"tx\" text-anchor=\"middle\" x=\"360.0\" y=\"292.0\"><tspan dy=\"0.00em\" x=\"360.0\">Có KẾ HOẠCH có sẵn, hoặc DẤU HIỆU rõ ràng?</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"570\" x2=\"610\" y1=\"292\" y2=\"292\"></line><text class=\"tg\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"590\" y=\"284\"><tspan dy=\"0.00em\" x=\"590\">Có</tspan></text><rect class=\"ng\" height=\"44\" rx=\"10\" width=\"150\" x=\"612\" y=\"270\"></rect><text class=\"tb\" text-anchor=\"middle\" x=\"687.0\" y=\"292.0\"><tspan dy=\"0.00em\" x=\"687.0\">be going to</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"687\" y=\"330\"><tspan dy=\"0.00em\" x=\"687\">Look! It's going to rain.</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"360\" x2=\"360\" y1=\"314\" y2=\"358\"></line><text class=\"tr\" style=\"font-size:12px\" text-anchor=\"start\" x=\"382\" y=\"340\"><tspan dy=\"0.00em\" x=\"382\">Không</tspan></text><rect class=\"nq\" height=\"44\" rx=\"10\" width=\"420\" x=\"150\" y=\"370\"></rect><text class=\"tx\" text-anchor=\"middle\" x=\"360.0\" y=\"392.0\"><tspan dy=\"0.00em\" x=\"360.0\">Quyết định lúc nói, lời hứa, đề nghị, dự đoán chủ quan?</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"570\" x2=\"610\" y1=\"392\" y2=\"392\"></line><text class=\"tg\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"590\" y=\"384\"><tspan dy=\"0.00em\" x=\"590\">Có</tspan></text><rect class=\"ng\" height=\"44\" rx=\"10\" width=\"150\" x=\"612\" y=\"370\"></rect><text class=\"tb\" text-anchor=\"middle\" x=\"687.0\" y=\"392.0\"><tspan dy=\"0.00em\" x=\"687.0\">will</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"687\" y=\"430\"><tspan dy=\"0.00em\" x=\"687\">I'll help you.</tspan></text></svg></div><figcaption>Cây quyết định: lịch cố định → sắp xếp cụ thể → kế hoạch / dấu hiệu → will.</figcaption></figure><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Cách chọn nhanh trong công việc</strong><p>Hẹn lịch với người khác: present continuous (I'm meeting the client at 3). Đề nghị giúp, hứa, quyết định ngay: will. Lịch chạy của hãng, tàu, họp cố định: present simple. Nói về kế hoạch: be going to.</p></div></aside></section><section class=\"topic\" id=\"t-b4\"><h2>2.6  Động từ trạng thái (stative) và động từ hành động</h2><p>Động từ trạng thái mô tả một TÌNH TRẠNG, không phải một hành động đang diễn ra, nên thường KHÔNG chia tiếp diễn.</p><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Nhóm</th><th>Động từ</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Suy nghĩ</div></td><td><div>believe, know, understand, mean, think <span class=\"vi\">(= có ý kiến)</span>, imagine, doubt, remember</div></td><td><div>I <strong>understand</strong> your position. <span class=\"vi\">(không “am understanding”)</span></div></td></tr><tr><td><div>Cảm xúc, mong muốn</div></td><td><div>like, love, hate, prefer, want, need, wish</div></td><td><div>I <strong>need</strong> the file today.</div></td></tr><tr><td><div>Giác quan</div></td><td><div>see, hear, smell, taste, sound, feel <span class=\"vi\">(trạng thái)</span></div></td><td><div>That <strong>sounds</strong> reasonable.</div></td></tr><tr><td><div>Hình dáng, vẻ ngoài</div></td><td><div>seem, appear, look, resemble</div></td><td><div>It <strong>seems</strong> fair.</div></td></tr><tr><td><div>Sở hữu, quan hệ</div></td><td><div>have <span class=\"vi\">(= sở hữu)</span>, own, belong to, contain, include, consist of, involve</div></td><td><div>The contract <strong>contains</strong> two schedules.</div></td></tr><tr><td><div>Tồn tại</div></td><td><div>be, exist</div></td><td><div>The clause <strong>exists</strong> in the draft.</div></td></tr></tbody></table></div><h3>Động từ có HAI nghĩa: một trạng thái, một hành động</h3><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Động từ</th><th>Nghĩa trạng thái (không tiếp diễn)</th><th>Nghĩa hành động (tiếp diễn được)</th></tr></thead><tbody><tr><td><div>have</div></td><td><div>I <strong>have</strong> a car. <span class=\"vi\">(sở hữu)</span></div></td><td><div>I'm <strong>having</strong> lunch. <span class=\"vi\">(ăn)</span> · We're <strong>having</strong> a meeting. <span class=\"vi\">(tổ chức)</span></div></td></tr><tr><td><div>think</div></td><td><div>I <strong>think</strong> it's fair. <span class=\"vi\">(ý kiến)</span></div></td><td><div>I'm <strong>thinking</strong> about the offer. <span class=\"vi\">(đang cân nhắc)</span></div></td></tr><tr><td><div>see</div></td><td><div>I <strong>see</strong> what you mean. <span class=\"vi\">(hiểu)</span></div></td><td><div>I'm <strong>seeing</strong> my lawyer tomorrow. <span class=\"vi\">(gặp)</span></div></td></tr><tr><td><div>taste / smell</div></td><td><div>It <strong>tastes</strong> good. <span class=\"vi\">(có vị)</span></div></td><td><div>She's <strong>tasting</strong> the soup. <span class=\"vi\">(nếm)</span></div></td></tr><tr><td><div>be</div></td><td><div>He <strong>is</strong> rude. <span class=\"vi\">(bản chất)</span></div></td><td><div>He's <strong>being</strong> rude today. <span class=\"vi\">(đang cư xử)</span></div></td></tr><tr><td><div>look</div></td><td><div>You <strong>look</strong> tired. <span class=\"vi\">(trông có vẻ)</span></div></td><td><div>I'm <strong>looking</strong> at the screen. <span class=\"vi\">(nhìn)</span></div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Ngoại lệ thân mật</span><div class=\"box\"><p>Cách nói “I'm loving it”, “I'm liking this” xuất hiện trong khẩu ngữ, quảng cáo. Trong văn bản và công việc, dùng thì đơn.</p></div></aside></section><section class=\"topic\" id=\"t-b5\"><h2>2.7  used to, would, be used to, get used to</h2><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Cấu trúc</th><th>Nghĩa</th><th>Theo sau</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>used to</div></td><td><div>Thói quen / trạng thái trong QUÁ KHỨ, giờ không còn</div></td><td><div>V nguyên</div></td><td><div>I <strong>used to</strong> work in Hanoi. <span class=\"vi\">(giờ không)</span></div></td></tr><tr><td><div>would</div></td><td><div>Thói quen lặp lại trong quá khứ <span class=\"vi\">(chỉ cho HÀNH ĐỘNG)</span></div></td><td><div>V nguyên</div></td><td><div>Every summer we <strong>would</strong> visit my grandparents.</div></td></tr><tr><td><div>be used to</div></td><td><div>Đã QUEN với <span class=\"vi\">(trạng thái hiện tại / quá khứ)</span></div></td><td><div>V-ing / danh từ</div></td><td><div>I'm <strong>used to working</strong> late.</div></td></tr><tr><td><div>get used to</div></td><td><div>ĐANG DẦN quen <span class=\"vi\">(quá trình)</span></div></td><td><div>V-ing / danh từ</div></td><td><div>I'm <strong>getting used to</strong> the new system.</div></td></tr></tbody></table></div><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>S + used to + V</code><code>S + be used to + V-ing / N</code><code>S + get used to + V-ing / N</code></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo phân biệt used to và be used to</strong><p>Có “be” hoặc “get” → đằng sau là V-ing <span class=\"vi\">(vì to ở đây là GIỚI TỪ)</span>. Không có be/get → V nguyên. Test: thay bằng “be familiar with” hoặc “a thing”. Nếu thay được → V-ing.</p></div></aside><aside class=\"note\"><span class=\"chip\">Trạng thái chỉ dùng used to</span><div class=\"box\"><p>Với TRẠNG THÁI quá khứ <span class=\"vi\">(không phải hành động)</span>, dùng <strong>used to</strong>, KHÔNG dùng would: We used to have a house near the park. (✗ We would have a house…)</p></div></aside><aside class=\"note\"><span class=\"chip\">Phủ định và nghi vấn</span><div class=\"box\"><p>did not use to <span class=\"vi\">(không viết “didn't used to”)</span>. Did you use to play football? Trong văn viết trang trọng: used not to.</p></div></aside></section><section class=\"topic\" id=\"t-b6\"><h2>2.8  Anh-Anh và Anh-Mỹ về thì và ngữ pháp</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Điểm</th><th>Anh-Anh (UK)</th><th>Anh-Mỹ (US)</th></tr></thead><tbody><tr><td><div>Present perfect với already / yet / just</div></td><td><div>We've already seen it.</div></td><td><div>We already saw it. <span class=\"vi\">(quá khứ đơn cũng đúng)</span></div></td></tr><tr><td><div>Quá khứ phân từ của get</div></td><td><div>got</div></td><td><div>gotten</div></td></tr><tr><td><div>Mạo từ với bệnh viện, trường</div></td><td><div>go to hospital / university</div></td><td><div>go to the hospital</div></td></tr><tr><td><div>Danh từ tập hợp</div></td><td><div>The team <strong>are</strong> …  <span class=\"vi\">(hoặc is)</span></div></td><td><div>The team <strong>is</strong> …</div></td></tr><tr><td><div>Thứ trong tuần</div></td><td><div>on Monday</div></td><td><div>(on) Monday · Monday through Friday</div></td></tr><tr><td><div>Have <span class=\"vi\">(sở hữu)</span></div></td><td><div>Have you got a pen?</div></td><td><div>Do you have a pen?</div></td></tr><tr><td><div>Giả định</div></td><td><div>He suggested that I <strong>should</strong> go.</div></td><td><div>He suggested that I go. <span class=\"vi\">(nguyên mẫu)</span></div></td></tr><tr><td><div>Ngày tháng</div></td><td><div>25/12/2026 <span class=\"vi\">(ngày/tháng/năm)</span></div></td><td><div>12/25/2026 <span class=\"vi\">(tháng/ngày/năm)</span></div></td></tr><tr><td><div>Chính tả</div></td><td><div>organise, colour, centre, licence (n)</div></td><td><div>organize, color, center, license</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Chọn một và dùng nhất quán</strong><p>Không có “đúng” tuyệt đối. Trong một văn bản, giữ một hệ thống <span class=\"vi\">(đặc biệt chính tả và ngày tháng)</span>. Hợp đồng quốc tế thường dùng Anh-Anh; công ty Mỹ dùng Anh-Mỹ.</p></div></aside></section><section class=\"topic\" id=\"t-b7\"><h2>2.9  Thì trong mệnh đề thời gian và các mốc “by / until / for / since”</h2><p>Sau when, as soon as, after, before, until, once, while, by the time, as long as: dùng thì HIỆN TẠI <span class=\"vi\">(đơn / tiếp diễn / hoàn thành)</span> để nói về TƯƠNG LAI. Không đặt will sau các từ này.</p><div class=\"pairs\"><div class=\"pair\"><div class=\"bad\"><span>✗</span>I will call you when I will arrive.</div><div class=\"good\"><span>✓</span>I will call you when I <strong>arrive</strong>.</div><div class=\"why\">Mệnh đề thời gian: hiện tại đơn.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>Let me know as soon as it will be ready.</div><div class=\"good\"><span>✓</span>Let me know as soon as it <strong>is</strong> ready.</div><div class=\"why\">Cũng có thể: has arrived.</div></div><div class=\"pair\"><div class=\"bad\"><span>✗</span>I'll wait until you will finish.</div><div class=\"good\"><span>✓</span>I'll wait until you <strong>finish / have finished</strong>.</div><div class=\"why\">Dùng hiện tại hoàn thành nếu nhấn mạnh “xong hẳn”.</div></div></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ</th><th>Nghĩa</th><th>Thì tương lai hợp</th></tr></thead><tbody><tr><td><div>by the time + hiện tại</div></td><td><div>trước khi, vào lúc</div></td><td><div>Future perfect: By the time you come back, I will have finished.</div></td></tr><tr><td><div>by the time + quá khứ</div></td><td><div>vào lúc đó</div></td><td><div>Past perfect: By the time he arrived, the meeting had ended.</div></td></tr><tr><td><div>until / till</div></td><td><div>cho đến khi</div></td><td><div>I won't sign until I have read it.</div></td></tr><tr><td><div>for + khoảng thời gian</div></td><td><div>trong <span class=\"vi\">(bao lâu)</span></div></td><td><div>for two years / for a long time</div></td></tr><tr><td><div>since + mốc</div></td><td><div>từ (khi)</div></td><td><div>since 2020 / since I joined the firm</div></td></tr><tr><td><div>by + mốc</div></td><td><div>trước hoặc vào hạn đó</div></td><td><div>Submit by Friday.</div></td></tr><tr><td><div>in + khoảng</div></td><td><div>sau <span class=\"vi\">(bao lâu nữa)</span> / trong vòng</div></td><td><div>I'll be back in an hour.</div></td></tr><tr><td><div>within + khoảng</div></td><td><div>không quá <span class=\"vi\">(bao lâu)</span></div></td><td><div>Reply within 24 hours.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Lỗi người Việt hay mắc</strong><p>Tiếng Việt nói “khi tôi sẽ đến”, nên dễ dịch thành “when I will arrive”. Chỉ cần nhớ: when / as soon as / before / after / until + HIỆN TẠI.</p></div></aside></section><section class=\"topic\" id=\"t-b8\"><h2>2.10  Thì trong văn bản pháp lý và hợp đồng</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Thì / cách dùng</th><th>Dùng khi</th><th>Ví dụ trong hợp đồng</th></tr></thead><tbody><tr><td><div>Hiện tại đơn</div></td><td><div>Quy định sự thật, trạng thái của hợp đồng, định nghĩa</div></td><td><div>This Agreement <strong>governs</strong> the sale of the Goods. The Seller <strong>is</strong> a company incorporated in…</div></td></tr><tr><td><div>shall + V</div></td><td><div>Nghĩa vụ bắt buộc <span class=\"vi\">(hợp đồng, luật)</span></div></td><td><div>The Buyer <strong>shall pay</strong> within 30 days.</div></td></tr><tr><td><div>may + V</div></td><td><div>Quyền, sự cho phép</div></td><td><div>The Seller <strong>may</strong> terminate this Agreement.</div></td></tr><tr><td><div>shall not / may not</div></td><td><div>Cấm</div></td><td><div>The Tenant <strong>shall not</strong> sublet the premises.</div></td></tr><tr><td><div>will + V</div></td><td><div>Cam kết trong tương lai, ít mạnh hơn shall</div></td><td><div>The Company <strong>will</strong> notify the Buyer promptly.</div></td></tr><tr><td><div>Hiện tại hoàn thành</div></td><td><div>Hành động đã làm, còn hiệu lực</div></td><td><div>The Parties <strong>have agreed</strong> as follows.</div></td></tr><tr><td><div>Quá khứ đơn</div></td><td><div>Sự kiện đã xảy ra trước ngày ký <span class=\"vi\">(phần Recitals)</span></div></td><td><div>The Seller <strong>manufactured</strong> the Goods in 2024.</div></td></tr><tr><td><div>Bị động</div></td><td><div>Nhấn nghĩa vụ, tránh nêu người</div></td><td><div>Payment <strong>is due</strong> … · The notice <strong>shall be deemed</strong> received on…</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo dành cho người đọc luật</strong><p><strong>shall</strong> trong hợp đồng ≈ “phải” <span class=\"vi\">(nghĩa vụ)</span>, không phải “sẽ”. Anh-Mỹ hiện đại và Plain English ưu tiên <strong>must</strong> thay cho shall. Đọc hợp đồng: thấy “shall”, hỏi “ai có nghĩa vụ?”; thấy “may”, hỏi “ai có quyền?”.</p></div></aside><aside class=\"note\"><span class=\"chip\">Cụm cố định trong văn bản pháp lý</span><div class=\"box\"><p>whereas <span class=\"vi\">(xét rằng)</span> · hereby <span class=\"vi\">(bằng văn bản này)</span> · herein <span class=\"vi\">(trong văn bản này)</span> · pursuant to (theo) · notwithstanding <span class=\"vi\">(bất kể)</span> · subject to <span class=\"vi\">(tuỳ thuộc)</span> · in witness whereof <span class=\"vi\">(để làm chứng)</span>. Bạn cần HIỂU chúng; khi tự viết email thường ngày, dùng từ đơn giản hơn.</p></div></aside></section>", "topics": [{"id": "t-b0", "title": "Bản đồ 12 thì và đường thời gian", "number": "2.1"}, {"id": "t-b1", "title": "Nhóm thì hiện tại", "number": "2.2"}, {"id": "t-b2", "title": "Nhóm thì quá khứ", "number": "2.3"}, {"id": "t-b3", "title": "Nhóm thì tương lai", "number": "2.4"}, {"id": "t-b3x", "title": "Cây chọn cách nói về tương lai", "number": "2.5"}, {"id": "t-b4", "title": "Động từ trạng thái (stative) và động từ hành động", "number": "2.6"}, {"id": "t-b5", "title": "used to, would, be used to, get used to", "number": "2.7"}, {"id": "t-b6", "title": "Anh-Anh và Anh-Mỹ về thì và ngữ pháp", "number": "2.8"}, {"id": "t-b7", "title": "Thì trong mệnh đề thời gian và các mốc “by / until / for / since”", "number": "2.9"}, {"id": "t-b8", "title": "Thì trong văn bản pháp lý và hợp đồng", "number": "2.10"}], "number": 2}, {"id": "t-c", "title": "Động từ khuyết thiếu (Modal verbs)", "html": "<div class=\"panelintro\"><p>Động từ khuyết thiếu luôn theo sau bởi ĐỘNG TỪ NGUYÊN THỂ KHÔNG TO <span class=\"vi\">(trừ ought to)</span>. Chúng không thêm -s ở ngôi thứ 3 số ít và không có dạng -ing/-ed thông thường.</p></div><section class=\"topic\" id=\"t-c0\"><h2>3.1  Hai thang đo của động từ khuyết thiếu</h2><p>Modal verb làm hai việc: nói về ĐIỀU CHẮC CHẮN ĐẾN MỨC NÀO <span class=\"vi\">(suy đoán)</span> và nói về ĐIỀU ĐƯỢC PHÉP / PHẢI LÀM <span class=\"vi\">(nghĩa vụ)</span>. Cùng một chữ có thể làm cả hai việc, nên cần nhìn ngữ cảnh.</p><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Hai thang đo của động từ khuyết thiếu\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 760 384\"><text class=\"tb\" text-anchor=\"middle\" x=\"380\" y=\"22\"><tspan dy=\"0.00em\" x=\"380\">Mức độ CHẮC CHẮN khi suy đoán</tspan></text><defs><lineargradient id=\"gs\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"var(--red)\"></stop><stop offset=\".5\" stop-color=\"var(--orange)\"></stop><stop offset=\"1\" stop-color=\"var(--green)\"></stop></lineargradient></defs><rect fill=\"url(#gs)\" height=\"16\" rx=\"8\" width=\"700\" x=\"30\" y=\"40\"></rect><line class=\"ln\" x1=\"30\" x2=\"30\" y1=\"60\" y2=\"74\"></line><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"start\" x=\"30\" y=\"92\"><tspan dy=\"-0.62em\" x=\"30\">0%</tspan><tspan dy=\"1.25em\" x=\"30\">can't be</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"start\" x=\"30\" y=\"128\"><tspan dy=\"0.00em\" x=\"30\">Chắc chắn KHÔNG</tspan></text><line class=\"ln\" x1=\"215\" x2=\"215\" y1=\"60\" y2=\"74\"></line><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"215\" y=\"92\"><tspan dy=\"-0.62em\" x=\"215\">25%</tspan><tspan dy=\"1.25em\" x=\"215\">may not</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"215\" y=\"128\"><tspan dy=\"0.00em\" x=\"215\">Có lẽ không</tspan></text><line class=\"ln\" x1=\"380\" x2=\"380\" y1=\"60\" y2=\"74\"></line><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"380\" y=\"92\"><tspan dy=\"-0.62em\" x=\"380\">50%</tspan><tspan dy=\"1.25em\" x=\"380\">may / might / could</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"380\" y=\"128\"><tspan dy=\"0.00em\" x=\"380\">Có thể</tspan></text><line class=\"ln\" x1=\"560\" x2=\"560\" y1=\"60\" y2=\"74\"></line><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"560\" y=\"92\"><tspan dy=\"-0.62em\" x=\"560\">80%</tspan><tspan dy=\"1.25em\" x=\"560\">should / ought to</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"560\" y=\"128\"><tspan dy=\"0.00em\" x=\"560\">Nhiều khả năng</tspan></text><line class=\"ln\" x1=\"730\" x2=\"730\" y1=\"60\" y2=\"74\"></line><text class=\"tb\" style=\"font-size:12px\" text-anchor=\"end\" x=\"730\" y=\"92\"><tspan dy=\"-0.62em\" x=\"730\">100%</tspan><tspan dy=\"1.25em\" x=\"730\">must be</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"end\" x=\"730\" y=\"128\"><tspan dy=\"0.00em\" x=\"730\">Chắc chắn CÓ</tspan></text><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"380\" y=\"170\"><tspan dy=\"0.00em\" x=\"380\">Quá khứ: must/may/might/can't + HAVE + V3   →   He must have left. / She can't have known.</tspan></text><text class=\"tb\" text-anchor=\"middle\" x=\"380\" y=\"214\"><tspan dy=\"0.00em\" x=\"380\">Bắt buộc / cho phép / cấm</tspan></text><rect class=\"nr\" height=\"64\" rx=\"10\" width=\"128\" x=\"30\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"94.0\" y=\"264.0\"><tspan dy=\"-0.62em\" x=\"94.0\">must</tspan><tspan dy=\"1.25em\" x=\"94.0\">have to</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"94\" y=\"322\"><tspan dy=\"0.00em\" x=\"94\">BẮT BUỘC</tspan></text><rect class=\"no\" height=\"64\" rx=\"10\" width=\"128\" x=\"173\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"237.0\" y=\"264.0\"><tspan dy=\"-0.62em\" x=\"237.0\">should</tspan><tspan dy=\"1.25em\" x=\"237.0\">ought to</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"237\" y=\"322\"><tspan dy=\"0.00em\" x=\"237\">NÊN</tspan></text><rect class=\"ng\" height=\"64\" rx=\"10\" width=\"128\" x=\"316\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"380.0\" y=\"264.0\"><tspan dy=\"-0.62em\" x=\"380.0\">can</tspan><tspan dy=\"1.25em\" x=\"380.0\">may</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"380\" y=\"322\"><tspan dy=\"0.00em\" x=\"380\">ĐƯỢC PHÉP</tspan></text><rect class=\"na\" height=\"64\" rx=\"10\" width=\"128\" x=\"459\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"523.0\" y=\"264.0\"><tspan dy=\"-0.62em\" x=\"523.0\">needn't</tspan><tspan dy=\"1.25em\" x=\"523.0\">don't have to</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"523\" y=\"322\"><tspan dy=\"-0.62em\" x=\"523\">KHÔNG CẦN</tspan><tspan dy=\"1.25em\" x=\"523\">(tuỳ bạn)</tspan></text><rect class=\"nr\" height=\"64\" rx=\"10\" width=\"128\" x=\"602\" y=\"232\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"666.0\" y=\"264.0\"><tspan dy=\"-0.62em\" x=\"666.0\">mustn't</tspan><tspan dy=\"1.25em\" x=\"666.0\">can't</tspan></text><text class=\"tm\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"666\" y=\"322\"><tspan dy=\"0.00em\" x=\"666\">CẤM</tspan></text><text class=\"tr\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"380\" y=\"364\"><tspan dy=\"0.00em\" x=\"380\">⚠ mustn't = CẤM    ≠    don't have to = KHÔNG BẮT BUỘC</tspan></text></svg></div><figcaption>Thang trên: mức chắc chắn từ 0% đến 100%. Thang dưới: bắt buộc / nên / được phép / không cần / cấm.</figcaption></figure></section><section class=\"topic\" id=\"t-c1\"><h2>3.2  Khả năng (ability)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ/cụm từ</th><th>Ý nghĩa/khi dùng</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>can</div></td><td><div>hiện tại/chung chung</div></td><td><div>I can swim.</div></td></tr><tr><td><div>could</div></td><td><div>quá khứ / lịch sự hơn khi xin phép</div></td><td><div>I could swim when I was 5.</div></td></tr><tr><td><div>be able to</div></td><td><div>dùng được ở mọi thì <span class=\"vi\">(can/could chỉ có 2 dạng)</span></div></td><td><div>I haven't been able to sleep well recently.</div></td></tr><tr><td><div>managed to / succeeded in V-ing</div></td><td><div>khả năng trong MỘT tình huống cụ thể <span class=\"vi\">(đã cố gắng và làm được)</span></div></td><td><div>I managed to finish the race despite the rain.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt could và was/were able to</strong><p>\"could\" diễn tả khả năng CHUNG CHUNG trong quá khứ. Khi nói về khả năng làm được MỘT VIỆC CỤ THỂ, MỘT LẦN trong quá khứ, phải dùng \"was/were able to\" hoặc \"managed to\", KHÔNG dùng \"could\". Ví dụ: The fire spread quickly, but everyone was able to escape. <span class=\"vi\">(không nói \"could escape\")</span>.</p></div></aside></section><section class=\"topic\" id=\"t-c2\"><h2>3.3  Xin phép &amp; cho phép (permission)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ</th><th>Mức độ</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>can</div></td><td><div>xin phép/cho phép thân mật</div></td><td><div>Can I open the window?</div></td></tr><tr><td><div>could</div></td><td><div>xin phép lịch sự hơn</div></td><td><div>Could I leave early today?</div></td></tr><tr><td><div>may</div></td><td><div>xin phép trang trọng, lịch sự nhất</div></td><td><div>May I come in?</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-c3\"><h2>3.4  Lời khuyên (advice)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ</th><th>Sắc thái</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>should / shouldn't</div></td><td><div>lời khuyên thông thường</div></td><td><div>You should see a doctor.</div></td></tr><tr><td><div>ought to</div></td><td><div>tương đương should, trang trọng hơn 1 chút</div></td><td><div>You ought to apologise.</div></td></tr><tr><td><div>had better + V-inf</div></td><td><div>lời khuyên MẠNH, có tính cảnh báo hậu quả nếu không làm; chỉ dùng cho tình huống cụ thể trước mắt</div></td><td><div>You'd better hurry, or you'll miss the bus.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt should và had better</strong><p>should mang tính GỢI Ý chung, nhẹ nhàng, dùng được cho mọi thời điểm. had better mang tính CẤP BÁCH, chỉ dùng cho tình huống NGAY TRƯỚC MẮT, ngụ ý hậu quả xấu nếu không nghe theo. Phủ định: had better NOT (You'd better not go).</p></div></aside></section><section class=\"topic\" id=\"t-c4\"><h2>3.5  Sự bắt buộc, cần thiết (obligation/necessity)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>must</div></td><td><div>bắt buộc do người nói tự đặt ra / cảm thấy cần thiết</div></td><td><div>I must finish this today.</div></td></tr><tr><td><div>have to</div></td><td><div>bắt buộc do HOÀN CẢNH, QUY ĐỊNH bên ngoài áp đặt</div></td><td><div>Students have to wear uniforms. <span class=\"vi\">(quy định của trường)</span></div></td></tr><tr><td><div>need to</div></td><td><div>cần thiết, ít nhấn mạnh tính bắt buộc hơn must</div></td><td><div>You need to drink more water.</div></td></tr><tr><td><div>mustn't</div></td><td><div>CẤM, không được phép làm</div></td><td><div>You mustn't smoke here.</div></td></tr><tr><td><div>don't have to / don't need to / needn't</div></td><td><div>KHÔNG BẮT BUỘC <span class=\"vi\">(có thể làm hoặc không, tùy ý)</span></div></td><td><div>You don't have to come if you're busy.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt mustn't và don't have to — LỖI SAI PHỔ BIẾN NHẤT</strong><p>mustn't = CẤM, tuyệt đối không được làm <span class=\"vi\">(You mustn't tell anyone = Cấm nói cho ai biết)</span>.</p><p>don't have to/don't need to = KHÔNG CẦN, việc đó không bắt buộc nhưng làm cũng không sao <span class=\"vi\">(You don't have to tell anyone = Bạn không cần phải nói, tùy bạn)</span>.</p><p>→ Hai cụm này hoàn toàn TRÁI NGHĨA nhau dù đều là dạng phủ định, đây là điểm hay bị ra thi để đánh lừa!</p></div></aside></section><section class=\"topic\" id=\"t-c5\"><h2>3.6  Phê phán hành vi trong quá khứ (criticism)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>should/ought to + have + V3</div></td><td><div>đáng lẽ NÊN làm nhưng đã KHÔNG làm <span class=\"vi\">(tiếc nuối/trách móc)</span></div></td><td><div>You should have called me. <span class=\"vi\">(Bạn đã không gọi — tiếc)</span></div></td></tr><tr><td><div>shouldn't have + V3</div></td><td><div>đáng lẽ KHÔNG NÊN làm nhưng ĐÃ làm</div></td><td><div>You shouldn't have shouted at her.</div></td></tr><tr><td><div>needn't have + V3</div></td><td><div>đã làm một việc mà thực ra KHÔNG CẦN THIẾT phải làm <span class=\"vi\">(nhưng vẫn làm)</span></div></td><td><div>You needn't have bought so much food.</div></td></tr><tr><td><div>didn't need to + V</div></td><td><div>không cần làm và THỰC TẾ đã không làm <span class=\"vi\">(không rõ có làm hay không)</span></div></td><td><div>I didn't need to go to the bank (so I didn't go).</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt needn't have và didn't need to</strong><p>needn't have + V3: hành động ĐÃ XẢY RA rồi mới biết là không cần thiết <span class=\"vi\">(biết kết quả)</span>. didn't need to + V: chỉ đơn thuần nói không có sự cần thiết, không rõ đã làm hay chưa.</p></div></aside></section><section class=\"topic\" id=\"t-c6\"><h2>3.7  Suy đoán, mức độ chắc chắn (deduction)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ</th><th>Mức độ chắc chắn</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>must</div></td><td><div>chắc chắn ĐÚNG <span class=\"vi\">(dựa trên bằng chứng rõ ràng)</span></div></td><td><div>He hasn't eaten all day. He must be hungry.</div></td></tr><tr><td><div>can't / couldn't</div></td><td><div>chắc chắn SAI, không thể nào</div></td><td><div>She can't be at home — I just saw her at school.</div></td></tr><tr><td><div>may / might / could</div></td><td><div>có thể đúng, không chắc chắn (possibility)</div></td><td><div>He might be at the gym now.</div></td></tr><tr><td><div>should / ought to</div></td><td><div>dự đoán có căn cứ hợp lý, kỳ vọng sẽ đúng</div></td><td><div>The meeting should finish by 5.</div></td></tr></tbody></table></div><h3>Suy đoán về quá khứ: modal + have + V3</h3><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>must have + V3</div></td><td><div>Chắc hẳn đã <span class=\"vi\">(suy đoán chắc chắn về quá khứ)</span></div></td><td><div>The ground is wet. It must have rained last night.</div></td></tr><tr><td><div>can't/couldn't have + V3</div></td><td><div>Chắc hẳn đã KHÔNG <span class=\"vi\">(không thể nào đã)</span></div></td><td><div>He can't have finished already — it's only been 5 minutes.</div></td></tr><tr><td><div>may/might/could have + V3</div></td><td><div>Có thể đã <span class=\"vi\">(không chắc chắn về quá khứ)</span></div></td><td><div>She might have missed the bus.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo tổng: modal + have + V3</strong><p>Bất cứ động từ khuyết thiếu nào + have + V3 đều lùi ý nghĩa của modal đó về THỜI QUÁ KHỨ. should have V3 = đáng lẽ nên <span class=\"vi\">(quá khứ)</span>. must have V3 = chắc hẳn đã <span class=\"vi\">(quá khứ)</span>. Chỉ cần học nghĩa hiện tại của modal, rồi cộng thêm \"have V3\" là lùi về quá khứ.</p></div></aside></section><section class=\"topic\" id=\"t-c7\"><h2>3.8  need, dare và các modal ít được chú ý</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ</th><th>Dùng như modal (không to, không s)</th><th>Dùng như động từ thường</th></tr></thead><tbody><tr><td><div>need</div></td><td><div>Chủ yếu phủ định / hỏi: You <strong>needn't</strong> come. · <strong>Need</strong> I sign now?</div></td><td><div>He <strong>needs to</strong> sign. · Do I <strong>need to</strong> sign?</div></td></tr><tr><td><div>dare</div></td><td><div>Chủ yếu phủ định / hỏi: How <strong>dare</strong> you? · I <strong>daren't</strong> ask.</div></td><td><div>She <strong>didn't dare to</strong> refuse. · Do you <strong>dare to</strong> try?</div></td></tr><tr><td><div>ought to</div></td><td><div>Nên: You ought to check. <span class=\"vi\">(phủ định: ought not to)</span></div></td><td><div>—</div></td></tr><tr><td><div>had better</div></td><td><div>Tốt hơn hết là <span class=\"vi\">(cảnh báo)</span>: You'd better hurry. <span class=\"vi\">(phủ định: had better not)</span></div></td><td><div>—</div></td></tr><tr><td><div>shall</div></td><td><div>Gợi ý / đề nghị với I, we: Shall I open it? · Shall we go?</div></td><td><div>Hợp đồng: nghĩa vụ</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>needn't và don't need to</strong><p>Cả hai = “không cần”. needn't có thể hơi thân mật; don't need to dùng rộng hơn. Quá khứ: <strong>needn't have + V3</strong> = đã làm nhưng thật ra không cần (You needn't have waited.) ≠ <strong>didn't need to</strong> = không cần làm <span class=\"vi\">(và có thể bạn đã không làm)</span>.</p></div></aside></section>", "topics": [{"id": "t-c0", "title": "Hai thang đo của động từ khuyết thiếu", "number": "3.1"}, {"id": "t-c1", "title": "Khả năng (ability)", "number": "3.2"}, {"id": "t-c2", "title": "Xin phép & cho phép (permission)", "number": "3.3"}, {"id": "t-c3", "title": "Lời khuyên (advice)", "number": "3.4"}, {"id": "t-c4", "title": "Sự bắt buộc, cần thiết (obligation/necessity)", "number": "3.5"}, {"id": "t-c5", "title": "Phê phán hành vi trong quá khứ (criticism)", "number": "3.6"}, {"id": "t-c6", "title": "Suy đoán, mức độ chắc chắn (deduction)", "number": "3.7"}, {"id": "t-c7", "title": "need, dare và các modal ít được chú ý", "number": "3.8"}], "number": 3}, {"id": "t-d", "title": "Câu bị động (Passive voice)", "html": "<div class=\"panelintro\"><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>Tân ngữ (câu chủ động) + be (chia theo thì gốc) + V3/-ed + (by + chủ thể gây ra hành động)</code></div><p>Nguyên tắc chuyển đổi: (1) Tân ngữ của câu chủ động → làm chủ ngữ câu bị động. (2) Chia \"be\" đúng THÌ của động từ chính ở câu chủ động. (3) Động từ chính → dạng V3/-ed. (4) Chủ ngữ cũ → \"by + O\" <span class=\"vi\">(có thể lược bỏ nếu không quan trọng/không rõ ai làm)</span>.</p></div><section class=\"topic\" id=\"t-d0\"><h2>4.1  Sơ đồ chuyển câu chủ động sang bị động</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Chuyển câu chủ động sang bị động\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 760 292\"><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"380\" y=\"18\"><tspan dy=\"0.00em\" x=\"380\">CHỦ ĐỘNG</tspan></text><rect class=\"fa\" height=\"50\" rx=\"10\" width=\"180\" x=\"40\" y=\"30\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"130.0\" y=\"55.0\"><tspan dy=\"-0.62em\" x=\"130.0\">Chủ ngữ</tspan><tspan dy=\"1.25em\" x=\"130.0\">The manager</tspan></text><rect class=\"fo\" height=\"50\" rx=\"10\" width=\"180\" x=\"250\" y=\"30\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"340.0\" y=\"55.0\"><tspan dy=\"-0.62em\" x=\"340.0\">Động từ</tspan><tspan dy=\"1.25em\" x=\"340.0\">signed</tspan></text><rect class=\"fg\" height=\"50\" rx=\"10\" width=\"220\" x=\"460\" y=\"30\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"570.0\" y=\"55.0\"><tspan dy=\"-0.62em\" x=\"570.0\">Tân ngữ</tspan><tspan dy=\"1.25em\" x=\"570.0\">the contract</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"380\" y=\"150\"><tspan dy=\"0.00em\" x=\"380\">BỊ ĐỘNG</tspan></text><rect class=\"fg\" height=\"60\" rx=\"10\" width=\"200\" x=\"40\" y=\"160\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"140.0\" y=\"190.0\"><tspan dy=\"-0.62em\" x=\"140.0\">Tân ngữ thành chủ ngữ</tspan><tspan dy=\"1.25em\" x=\"140.0\">The contract</tspan></text><rect class=\"fo\" height=\"60\" rx=\"10\" width=\"200\" x=\"260\" y=\"160\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"360.0\" y=\"190.0\"><tspan dy=\"-0.62em\" x=\"360.0\">be + V3</tspan><tspan dy=\"1.25em\" x=\"360.0\">was signed</tspan></text><rect class=\"fa\" height=\"60\" rx=\"10\" width=\"230\" x=\"480\" y=\"160\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"595.0\" y=\"190.0\"><tspan dy=\"-0.62em\" x=\"595.0\">by + chủ ngữ cũ</tspan><tspan dy=\"1.25em\" x=\"595.0\">(by the manager)</tspan></text><polyline class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\" points=\"550,82 550,120 150,120 150,158\"></polyline><polyline class=\"ln\" fill=\"none\" marker-end=\"url(#ah)\" points=\"130,82 130,100 600,100 600,158\"></polyline><text class=\"ta\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"380\" y=\"252\"><tspan dy=\"0.00em\" x=\"380\">be chia theo THÌ của câu chủ động:  signs → is signed   |   signed → was signed   |   will sign → will be signed</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"380\" y=\"276\"><tspan dy=\"0.00em\" x=\"380\">Bỏ “by …” khi không biết / không quan trọng ai làm:  The contract was signed yesterday.</tspan></text></svg></div><figcaption>Tân ngữ của câu chủ động lên làm chủ ngữ. Động từ đổi thành be + V3, be chia theo thì của câu gốc. Chủ ngữ cũ chuyển ra sau “by”, hoặc bỏ đi.</figcaption></figure></section><section class=\"topic\" id=\"t-d1\"><h2>4.2  Bị động theo từng thì</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Thì / dạng</th><th>Công thức \"be\"</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hiện tại đơn</div></td><td><div>am/is/are + V3</div></td><td><div>The house is cleaned every week.</div></td></tr><tr><td><div>Hiện tại tiếp diễn</div></td><td><div>am/is/are + being + V3</div></td><td><div>The house is being cleaned now.</div></td></tr><tr><td><div>Hiện tại hoàn thành</div></td><td><div>have/has + been + V3</div></td><td><div>The house has been cleaned.</div></td></tr><tr><td><div>Quá khứ đơn</div></td><td><div>was/were + V3</div></td><td><div>The house was cleaned yesterday.</div></td></tr><tr><td><div>Quá khứ tiếp diễn</div></td><td><div>was/were + being + V3</div></td><td><div>The house was being cleaned at 9 a.m.</div></td></tr><tr><td><div>Quá khứ hoàn thành</div></td><td><div>had + been + V3</div></td><td><div>The house had been cleaned before I arrived.</div></td></tr><tr><td><div>Tương lai đơn (will)</div></td><td><div>will + be + V3</div></td><td><div>The house will be cleaned tomorrow.</div></td></tr><tr><td><div>Be going to</div></td><td><div>am/is/are + going to be + V3</div></td><td><div>The house is going to be cleaned soon.</div></td></tr><tr><td><div>Động từ khuyết thiếu</div></td><td><div>modal + be + V3</div></td><td><div>The homework must be finished tonight.</div></td></tr><tr><td><div>Động từ khuyết thiếu hoàn thành</div></td><td><div>modal + have been + V3</div></td><td><div>The letter should have been sent yesterday.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-d2\"><h2>4.3  Bị động với động từ tường thuật (nói chung chung/truyền tin đồn)</h2><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>S (người/vật cụ thể) + be + said/thought/believed/reported/known... + to V(-inf/have V3)</code></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Dạng khách quan #1 <span class=\"vi\">(dùng chủ ngữ giả \"It\")</span></div></td><td><div>It + be + said/thought... + that + S + V</div></td><td><div>It is said that he is very rich.</div></td></tr><tr><td><div>Dạng khách quan #2 <span class=\"vi\">(chủ ngữ thật)</span></div></td><td><div>S + be + said/thought... + to V</div></td><td><div>He is said to be very rich.</div></td></tr><tr><td><div>Nếu mệnh đề \"that\" ở thì trước <span class=\"vi\">(đã xảy ra trước)</span></div></td><td><div>S + be + said... + to have + V3</div></td><td><div>He is said to have been very rich in the past.</div></td></tr></tbody></table></div><p>Các động từ hay dùng: say, think, believe, know, report, claim, consider, estimate, suggest...</p></section><section class=\"topic\" id=\"t-d3\"><h2>4.4  Thể sai khiến (Causative form): have/get something done</h2><div class=\"formula\"><span class=\"chip\">Cấu trúc</span><code>S + have/get + tân ngữ (vật) + V3</code><code>—  nhờ/thuê ai đó làm gì cho mình</code></div><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Sắc thái</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>have sth done</div></td><td><div>trang trọng hơn 1 chút, thường dùng khi thuê dịch vụ</div></td><td><div>I had my hair cut yesterday. <span class=\"vi\">(Tôi đi cắt tóc — thợ cắt cho tôi)</span></div></td></tr><tr><td><div>get sth done</div></td><td><div>thân mật hơn, đôi khi mang nghĩa \"hoàn tất/khiến việc gì xảy ra\"</div></td><td><div>I got my car repaired last week.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt câu chủ động và thể sai khiến</strong><p>\"I cut my hair.\" = TỰ tôi cắt tóc cho chính mình. \"I had my hair cut.\" = tôi NHỜ/THUÊ người khác cắt tóc cho tôi. Đây là điểm khác biệt cốt lõi của thể sai khiến — tân ngữ <span class=\"vi\">(vật)</span> không tự làm hành động mà BỊ/ĐƯỢC làm bởi ai đó.</p></div></aside></section><section class=\"topic\" id=\"t-d4\"><h2>4.5  Bị động với 2 tân ngữ (tân ngữ trực tiếp &amp; gián tiếp)</h2><p>Với các động từ có 2 tân ngữ: give, send, show, tell, offer, teach, buy, bring, pass... ta có thể bị động hóa theo 2 cách:</p><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Cách chuyển</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Tân ngữ gián tiếp <span class=\"vi\">(người)</span> làm chủ ngữ — thường dùng hơn, tự nhiên hơn</div></td><td><div>My sister was given this cookery book by a friend.</div></td></tr><tr><td><div>Tân ngữ trực tiếp <span class=\"vi\">(vật)</span> làm chủ ngữ</div></td><td><div>This cookery book was given to my sister by a friend.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-d5\"><h2>4.6  Một số lưu ý khác về bị động</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Lưu ý</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Động từ tri giác + V-ing/V-inf → bị động dùng \"to be + V3\"</div></td><td><div>They saw him steal the bike. → He was seen to steal the bike.</div></td></tr><tr><td><div>Bị động với \"by\" và \"with\" — \"by\" chỉ chủ thể gây ra hành động, \"with\" chỉ công cụ/phương tiện</div></td><td><div>The window was broken by the boy with a stone.</div></td></tr><tr><td><div>Một số động từ không có dạng bị động <span class=\"vi\">(thiếu tân ngữ trực tiếp)</span>: happen, occur, seem, appear, arrive, exist, disappear, sleep, die...</div></td><td><div>—</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-d6\"><h2>4.7  Bị động: các trường hợp đặc biệt</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Cách chuyển</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>make / see / hear / watch + O + V <span class=\"vi\">(không to)</span></div></td><td><div>Bị động có “to”</div></td><td><div>They made him resign → He <strong>was made to resign</strong>.</div></td></tr><tr><td><div>Động từ tường thuật: say, think, believe, report, expect, know, understand</div></td><td><div>It is said that … / S + is said + to V</div></td><td><div><strong>It is believed that</strong> the firm will merge. · The firm <strong>is believed to</strong> merge.</div></td></tr><tr><td><div>Hành động đã xảy ra trước</div></td><td><div>to have + V3</div></td><td><div>He <strong>is said to have left</strong>.</div></td></tr><tr><td><div>be supposed to</div></td><td><div>Được cho là / được kỳ vọng</div></td><td><div>You <strong>are supposed to</strong> attend.</div></td></tr><tr><td><div>Câu mệnh lệnh</div></td><td><div>Let + O + be + V3</div></td><td><div><strong>Let the door be closed</strong>. · Hiện đại: The door must be closed.</div></td></tr><tr><td><div>get + V3</div></td><td><div>Đời thường, bất ngờ</div></td><td><div>He <strong>got fired</strong>.</div></td></tr><tr><td><div>have / get + O + V3</div></td><td><div>Nhờ làm hộ</div></td><td><div>I <strong>had my contract reviewed</strong>.</div></td></tr><tr><td><div>Động từ 2 tân ngữ: give, send, show, offer</div></td><td><div>2 cách bị động</div></td><td><div>She gave <strong>me</strong> the file → <strong>I was given</strong> the file. / <strong>The file was given</strong> to me.</div></td></tr><tr><td><div>Động từ không có tân ngữ <span class=\"vi\">(nội động từ)</span>: happen, arrive, die, sleep</div></td><td><div>KHÔNG có bị động</div></td><td><div>Something happened. (✗ was happened)</div></td></tr><tr><td><div>Cụm V + giới từ</div></td><td><div>Giữ giới từ</div></td><td><div>They dealt with it → It <strong>was dealt with</strong>.</div></td></tr><tr><td><div>Danh động từ</div></td><td><div>being + V3</div></td><td><div>I dislike <strong>being interrupted</strong>.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Khi nào nên dùng bị động trong công việc</strong><p>Dùng khi người làm KHÔNG QUAN TRỌNG hoặc không rõ (The report was delivered), hoặc để lịch sự không đổ lỗi (Mistakes were made). Khi cần rõ ai chịu trách nhiệm, dùng chủ động (We will deliver the report on Friday).</p></div></aside></section>", "topics": [{"id": "t-d0", "title": "Sơ đồ chuyển câu chủ động sang bị động", "number": "4.1"}, {"id": "t-d1", "title": "Bị động theo từng thì", "number": "4.2"}, {"id": "t-d2", "title": "Bị động với động từ tường thuật (nói chung chung/truyền tin đồn)", "number": "4.3"}, {"id": "t-d3", "title": "Thể sai khiến (Causative form): have/get something done", "number": "4.4"}, {"id": "t-d4", "title": "Bị động với 2 tân ngữ (tân ngữ trực tiếp & gián tiếp)", "number": "4.5"}, {"id": "t-d5", "title": "Một số lưu ý khác về bị động", "number": "4.6"}, {"id": "t-d6", "title": "Bị động: các trường hợp đặc biệt", "number": "4.7"}], "number": 4}, {"id": "t-e", "title": "Câu điều kiện & câu giả định", "html": "<section class=\"topic\" id=\"t-e0\"><h2>5.1  Phổ câu điều kiện</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Phổ câu điều kiện từ loại 0 đến hỗn hợp\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 394\"><rect class=\"fa\" height=\"30\" rx=\"10\" width=\"230\" x=\"110\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"225.0\" y=\"19.0\"><tspan dy=\"0.00em\" x=\"225.0\">Mệnh đề IF</tspan></text><rect class=\"fa\" height=\"30\" rx=\"10\" width=\"150\" x=\"370\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"445.0\" y=\"19.0\"><tspan dy=\"0.00em\" x=\"445.0\">Mệnh đề chính</tspan></text><rect class=\"fa\" height=\"30\" rx=\"10\" width=\"230\" x=\"540\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"655.0\" y=\"19.0\"><tspan dy=\"0.00em\" x=\"655.0\">Nghĩa</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"98\" x=\"4\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"53.0\" y=\"75.0\"><tspan dy=\"0.00em\" x=\"53.0\">Loại 0</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"110\" y=\"44\"></rect><text class=\"tx\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"225.0\" y=\"75.0\"><tspan dy=\"0.00em\" x=\"225.0\">If + hiện tại đơn</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"342\" x2=\"368\" y1=\"75\" y2=\"75\"></line><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"150\" x=\"370\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"445.0\" y=\"75.0\"><tspan dy=\"0.00em\" x=\"445.0\">hiện tại đơn</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"540\" y=\"44\"></rect><text class=\"tx\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"655.0\" y=\"75.0\"><tspan dy=\"-0.62em\" x=\"655.0\">Sự thật, quy luật</tspan><tspan dy=\"1.25em\" x=\"655.0\">If you heat ice, it melts.</tspan></text><rect class=\"ng\" height=\"62\" rx=\"10\" width=\"98\" x=\"4\" y=\"114\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"53.0\" y=\"145.0\"><tspan dy=\"0.00em\" x=\"53.0\">Loại 1</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"110\" y=\"114\"></rect><text class=\"tx\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"225.0\" y=\"145.0\"><tspan dy=\"0.00em\" x=\"225.0\">If + hiện tại đơn</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"342\" x2=\"368\" y1=\"145\" y2=\"145\"></line><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"150\" x=\"370\" y=\"114\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"445.0\" y=\"145.0\"><tspan dy=\"0.00em\" x=\"445.0\">will + V</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"540\" y=\"114\"></rect><text class=\"tx\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"655.0\" y=\"145.0\"><tspan dy=\"-0.62em\" x=\"655.0\">Khả năng THẬT ở tương lai</tspan><tspan dy=\"1.25em\" x=\"655.0\">If it rains, I will stay home.</tspan></text><rect class=\"na\" height=\"62\" rx=\"10\" width=\"98\" x=\"4\" y=\"184\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"53.0\" y=\"215.0\"><tspan dy=\"0.00em\" x=\"53.0\">Loại 2</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"110\" y=\"184\"></rect><text class=\"tx\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"225.0\" y=\"215.0\"><tspan dy=\"0.00em\" x=\"225.0\">If + quá khứ đơn</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"342\" x2=\"368\" y1=\"215\" y2=\"215\"></line><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"150\" x=\"370\" y=\"184\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"445.0\" y=\"215.0\"><tspan dy=\"0.00em\" x=\"445.0\">would + V</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"540\" y=\"184\"></rect><text class=\"tx\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"655.0\" y=\"215.0\"><tspan dy=\"-0.62em\" x=\"655.0\">Không có thật ở HIỆN TẠI</tspan><tspan dy=\"1.25em\" x=\"655.0\">If I were rich, I would travel.</tspan></text><rect class=\"no\" height=\"62\" rx=\"10\" width=\"98\" x=\"4\" y=\"254\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"53.0\" y=\"285.0\"><tspan dy=\"0.00em\" x=\"53.0\">Loại 3</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"110\" y=\"254\"></rect><text class=\"tx\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"225.0\" y=\"285.0\"><tspan dy=\"0.00em\" x=\"225.0\">If + quá khứ hoàn thành</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"342\" x2=\"368\" y1=\"285\" y2=\"285\"></line><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"150\" x=\"370\" y=\"254\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"445.0\" y=\"285.0\"><tspan dy=\"0.00em\" x=\"445.0\">would have + V3</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"540\" y=\"254\"></rect><text class=\"tx\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"655.0\" y=\"285.0\"><tspan dy=\"-0.62em\" x=\"655.0\">Không thể thay đổi (QUÁ KHỨ)</tspan><tspan dy=\"1.25em\" x=\"655.0\">If I had left earlier, I would have caught it.</tspan></text><rect class=\"nr\" height=\"62\" rx=\"10\" width=\"98\" x=\"4\" y=\"324\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"53.0\" y=\"355.0\"><tspan dy=\"0.00em\" x=\"53.0\">Hỗn hợp</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"110\" y=\"324\"></rect><text class=\"tx\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"225.0\" y=\"355.0\"><tspan dy=\"0.00em\" x=\"225.0\">If + quá khứ hoàn thành</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"342\" x2=\"368\" y1=\"355\" y2=\"355\"></line><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"150\" x=\"370\" y=\"324\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"445.0\" y=\"355.0\"><tspan dy=\"0.00em\" x=\"445.0\">would + V</tspan></text><rect class=\"nb\" height=\"62\" rx=\"10\" width=\"230\" x=\"540\" y=\"324\"></rect><text class=\"tx\" style=\"font-size:11px\" text-anchor=\"middle\" x=\"655.0\" y=\"355.0\"><tspan dy=\"-0.62em\" x=\"655.0\">Quá khứ → ảnh hưởng HIỆN TẠI</tspan><tspan dy=\"1.25em\" x=\"655.0\">If I had studied law, I would be a judge now.</tspan></text></svg></div><figcaption>Từ loại 0 <span class=\"vi\">(sự thật)</span> đến loại 3 và hỗn hợp <span class=\"vi\">(hối tiếc / giả định về quá khứ)</span>. Mũi tên: nếu điều kiện xảy ra → kết quả.</figcaption></figure></section><section class=\"topic\" id=\"t-e1\"><h2>5.2  Bốn loại câu điều kiện cơ bản</h2><div class=\"tblwrap\"><table class=\"cols-4\"><thead><tr><th>Loại</th><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Loại 0</div></td><td><div>If + hiện tại đơn, hiện tại đơn</div></td><td><div>Sự thật hiển nhiên, quy luật tự nhiên, luôn đúng</div></td><td><div>If you heat ice, it melts.</div></td></tr><tr><td><div>Loại 1</div></td><td><div>If + hiện tại đơn, will + V-inf</div></td><td><div>Điều kiện CÓ THỂ xảy ra ở hiện tại/tương lai</div></td><td><div>If it rains, I will stay home.</div></td></tr><tr><td><div>Loại 2</div></td><td><div>If + quá khứ đơn, would + V-inf</div></td><td><div>Điều kiện KHÔNG có thật/khó xảy ra ở hiện tại <span class=\"vi\">(giả định)</span></div></td><td><div>If I had a million dollars, I would travel the world.</div></td></tr><tr><td><div>Loại 3</div></td><td><div>If + quá khứ hoàn thành, would + have + V3</div></td><td><div>Điều kiện KHÔNG có thật trong QUÁ KHỨ <span class=\"vi\">(đã không xảy ra, tiếc nuối)</span></div></td><td><div>If I had studied harder, I would have passed the exam.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo phân biệt loại 2 và loại 3</strong><p>Loại 2 nói về HIỆN TẠI <span class=\"vi\">(giả sử bây giờ khác đi)</span> — dùng quá khứ đơn. Loại 3 nói về QUÁ KHỨ <span class=\"vi\">(giả sử ngày xưa khác đi, nhưng đã không xảy ra)</span> — dùng quá khứ hoàn thành. Nhìn vào động từ trong mệnh đề chính: would + V <span class=\"vi\">(loại 2, hiện tại)</span> hay would have + V3 <span class=\"vi\">(loại 3, quá khứ)</span>?</p></div></aside><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Trong câu điều kiện loại 2, với động từ \"to be\", ta dùng \"were\" cho mọi ngôi <span class=\"vi\">(kể cả I/he/she/it)</span>: If I were you, I would apologise. Đây là hình thức trang trọng, chuẩn mực; \"was\" vẫn được chấp nhận trong văn nói thân mật.</p></div></aside></section><section class=\"topic\" id=\"t-e2\"><h2>5.3  Câu điều kiện kết hợp (Mixed conditionals)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trường hợp</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Điều kiện ở QUÁ KHỨ, kết quả ở HIỆN TẠI</div></td><td><div>If + quá khứ hoàn thành, would + V-inf</div></td><td><div>If I had listened to my parents, I wouldn't be in so much trouble now.</div></td></tr><tr><td><div>Điều kiện chung ở HIỆN TẠI, kết quả trong QUÁ KHỨ</div></td><td><div>If + quá khứ đơn, would have + V3</div></td><td><div>If she weren't so lazy, she would have finished the report yesterday.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-e3\"><h2>5.4  Đảo ngữ trong câu điều kiện</h2><div class=\"tblwrap\"><table class=\"cols-2\"><thead><tr><th>Loại — cấu trúc đảo ngữ</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Loại 1: Should + S + V-inf</div></td><td><div>Should you need any help, call me. (= If you need...)</div></td></tr><tr><td><div>Loại 2: Were + S + (to V-inf)/adj</div></td><td><div>Were I you, I would think carefully. (= If I were you...)</div></td></tr><tr><td><div>Loại 3: Had + S + V3</div></td><td><div>Had I known about the meeting, I would have come. (= If I had known...)</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo đảo ngữ điều kiện</strong><p>Chỉ cần bỏ chữ \"if\" và đảo trợ động từ (should/were/had) ra trước chủ ngữ — giống hệt cách đảo ngữ trong câu hỏi Yes/No. Cách này giúp câu văn trang trọng, học thuật hơn.</p></div></aside></section><section class=\"topic\" id=\"t-e4\"><h2>5.5  Các liên từ điều kiện khác: unless, in case, as/so long as, provided/providing that</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Từ nối</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>unless</div></td><td><div>= if...not <span class=\"vi\">(trừ khi, nếu không)</span></div></td><td><div>I won't go unless you come with me. (= if you don't come)</div></td></tr><tr><td><div>in case</div></td><td><div>phòng khi, đề phòng trường hợp <span class=\"vi\">(hành động được thực hiện TRƯỚC để phòng ngừa)</span></div></td><td><div>Take an umbrella in case it rains.</div></td></tr><tr><td><div>as long as / so long as</div></td><td><div>miễn là, với điều kiện là</div></td><td><div>You can go out as long as you finish your homework.</div></td></tr><tr><td><div>provided (that) / providing (that)</div></td><td><div>với điều kiện là <span class=\"vi\">(trang trọng hơn, tương đương if)</span></div></td><td><div>I'll lend you the money provided that you pay me back next week.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt unless và if...not</strong><p>unless = if...not, dùng tốt nhất ở câu điều kiện loại 0 và loại 1 (I won't sign unless you add the clause).</p><p>Không dùng unless khi vế chính nói về CẢM XÚC hoặc hậu quả cá nhân: 'I'll be upset if you don't come' <span class=\"vi\">(không nói 'unless you come')</span>.</p><p>Cũng không dùng unless trong câu loại 3 <span class=\"vi\">(đã qua, không thể thay đổi)</span>: 'If you hadn't helped, I would have failed'.</p></div></aside><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Phân biệt in case và if</strong><p>\"if\" diễn tả điều kiện — hành động ở mệnh đề chính chỉ xảy ra KHI điều kiện đó xảy ra. \"in case\" diễn tả sự đề phòng — hành động được làm TRƯỚC, phòng khi điều đó xảy ra <span class=\"vi\">(dù nó có xảy ra hay không)</span>. Take an umbrella if it rains <span class=\"vi\">(mang ô KHI trời mưa)</span> &gt;&lt; Take an umbrella in case it rains <span class=\"vi\">(mang ô SẴN để phòng khi mưa, dù lúc mang trời chưa mưa)</span>.</p></div></aside></section><section class=\"topic\" id=\"t-e5\"><h2>5.6  Câu giả định với WISH / IF ONLY</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại ước</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Ước ở hiện tại <span class=\"vi\">(trái ngược thực tế hiện tại)</span></div></td><td><div>wish/if only + quá khứ đơn</div></td><td><div>I wish I had more free time. <span class=\"vi\">(Thực tế: tôi không có nhiều thời gian rảnh)</span></div></td></tr><tr><td><div>Ước ở quá khứ <span class=\"vi\">(tiếc nuối việc đã xảy ra)</span></div></td><td><div>wish/if only + quá khứ hoàn thành</div></td><td><div>I wish I had studied harder. <span class=\"vi\">(Tiếc là đã không học chăm hơn)</span></div></td></tr><tr><td><div>Ước muốn thay đổi/phàn nàn về hiện tại hoặc tương lai</div></td><td><div>wish/if only + would + V-inf</div></td><td><div>I wish you would stop smoking. <span class=\"vi\">(Mong bạn dừng hút thuốc — thể hiện sự khó chịu)</span></div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo học wish nhanh</strong><p>Nhìn vào wish giống hệt như câu điều kiện nhưng bỏ chữ \"if\" đi lùi một bậc thì: ước hiện tại → lùi về quá khứ đơn <span class=\"vi\">(như đk loại 2)</span>; ước quá khứ → lùi về quá khứ hoàn thành <span class=\"vi\">(như đk loại 3)</span>. \"wish...would\" KHÔNG dùng cho chính chủ ngữ \"I\" <span class=\"vi\">(không nói I wish I would...)</span> mà dùng để phàn nàn về hành vi người khác hoặc sự việc khách quan.</p></div></aside></section><section class=\"topic\" id=\"t-e6\"><h2>5.7  Would rather / It's time</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cấu trúc</th><th>Ý nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>would rather + V-inf <span class=\"vi\">(không to)</span></div></td><td><div>Thích làm gì hơn <span class=\"vi\">(cho chính mình)</span></div></td><td><div>I'd rather stay home tonight.</div></td></tr><tr><td><div>would rather + S + quá khứ đơn</div></td><td><div>Muốn NGƯỜI KHÁC làm gì <span class=\"vi\">(hiện tại/tương lai)</span></div></td><td><div>I'd rather you came with me tomorrow.</div></td></tr><tr><td><div>would rather have + V3</div></td><td><div>Đáng lẽ thích... hơn <span class=\"vi\">(tiếc nuối về quá khứ)</span></div></td><td><div>I'd rather have stayed home last night.</div></td></tr><tr><td><div>it's (high) time + S + quá khứ đơn</div></td><td><div>Đã đến lúc phải làm gì <span class=\"vi\">(mang ý mỉa mai/thúc giục vì đã muộn)</span></div></td><td><div>It's time you went to bed. <span class=\"vi\">(Đã đến lúc bạn đi ngủ rồi đấy — hơi muộn)</span></div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-e7\"><h2>5.8  Những cách khác để nói “nếu”: without, but for, otherwise, supposing…</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Cách nói</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Without + N</div></td><td><div>nếu không có</div></td><td><div>Without your help, we <strong>would have failed</strong>. (= If you hadn't helped…)</div></td></tr><tr><td><div>But for + N</div></td><td><div>nếu không nhờ / nếu không vì</div></td><td><div>But for the rain, we'd have gone.</div></td></tr><tr><td><div>Otherwise</div></td><td><div>nếu không thì</div></td><td><div>Sign it today; <strong>otherwise</strong>, the offer will expire.</div></td></tr><tr><td><div>Or (else)</div></td><td><div>nếu không thì <span class=\"vi\">(thân mật)</span></div></td><td><div>Hurry up, or you'll miss the train.</div></td></tr><tr><td><div>Supposing / suppose</div></td><td><div>giả sử</div></td><td><div><strong>Supposing</strong> he refuses, what then?</div></td></tr><tr><td><div>Even if</div></td><td><div>dù cho <span class=\"vi\">(nhấn mạnh)</span></div></td><td><div>I'll go <strong>even if</strong> it rains.</div></td></tr><tr><td><div>On condition that</div></td><td><div>với điều kiện</div></td><td><div>I'll help <strong>on condition that</strong> you keep it secret.</div></td></tr><tr><td><div>Should + S + V <span class=\"vi\">(đảo ngữ)</span></div></td><td><div>nếu lỡ <span class=\"vi\">(trang trọng, loại 1)</span></div></td><td><div><strong>Should</strong> you need help, call me. = If you need…</div></td></tr><tr><td><div>Were + S + to V / Were I …</div></td><td><div>nếu <span class=\"vi\">(loại 2 trang trọng)</span></div></td><td><div><strong>Were I</strong> you, I would accept.</div></td></tr><tr><td><div>Had + S + V3</div></td><td><div>nếu đã <span class=\"vi\">(loại 3 trang trọng)</span></div></td><td><div><strong>Had</strong> I known, I would have told you.</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Văn bản pháp lý thích đảo ngữ</strong><p>“Should any dispute arise…”, “Had the Buyer notified the Seller…” là cách viết hợp đồng điển hình. Hiểu nó = “If any dispute arises…”.</p></div></aside></section>", "topics": [{"id": "t-e0", "title": "Phổ câu điều kiện", "number": "5.1"}, {"id": "t-e1", "title": "Bốn loại câu điều kiện cơ bản", "number": "5.2"}, {"id": "t-e2", "title": "Câu điều kiện kết hợp (Mixed conditionals)", "number": "5.3"}, {"id": "t-e3", "title": "Đảo ngữ trong câu điều kiện", "number": "5.4"}, {"id": "t-e4", "title": "Các liên từ điều kiện khác: unless, in case, as/so long as, provided/providing that", "number": "5.5"}, {"id": "t-e5", "title": "Câu giả định với WISH / IF ONLY", "number": "5.6"}, {"id": "t-e6", "title": "Would rather / It's time", "number": "5.7"}, {"id": "t-e7", "title": "Những cách khác để nói “nếu”: without, but for, otherwise, supposing…", "number": "5.8"}], "number": 5}, {"id": "t-f", "title": "Câu tường thuật (Reported speech)", "html": "<div class=\"panelintro\"><p>Khi tường thuật lại lời nói của ai đó, nếu động từ tường thuật (said, told...) chia ở QUÁ KHỨ, ta thường phải lùi thì của câu nói trực tiếp về quá khứ một bậc (\"backshift\"). Nếu động từ tường thuật ở hiện tại, hoặc sự việc vẫn còn đúng ở hiện tại/là chân lý, KHÔNG cần lùi thì.</p></div><section class=\"topic\" id=\"t-f0\"><h2>6.1  Bậc thang lùi thì</h2><figure class=\"fig\"><div class=\"figscroll\"><svg aria-label=\"Bậc thang lùi thì trong câu tường thuật\" role=\"img\" style=\"min-width:680px\" viewbox=\"0 0 780 426\"><rect class=\"fa\" height=\"30\" rx=\"10\" width=\"320\" x=\"40\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"200.0\" y=\"19.0\"><tspan dy=\"0.00em\" x=\"200.0\">Lời nói TRỰC TIẾP</tspan></text><rect class=\"fa\" height=\"30\" rx=\"10\" width=\"320\" x=\"420\" y=\"4\"></rect><text class=\"tw\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"19.0\"><tspan dy=\"0.00em\" x=\"580.0\">Lời nói GIÁN TIẾP (lùi một bậc)</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"44\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"62.0\"><tspan dy=\"0.00em\" x=\"200.0\">am / is / are + V-ing  (hiện tại tiếp diễn)</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"62\" y2=\"62\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"44\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"62.0\"><tspan dy=\"0.00em\" x=\"580.0\">was / were + V-ing</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"88\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"106.0\"><tspan dy=\"0.00em\" x=\"200.0\">V / Vs  (hiện tại đơn)</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"106\" y2=\"106\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"88\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"106.0\"><tspan dy=\"0.00em\" x=\"580.0\">V2  (quá khứ đơn)</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"132\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"150.0\"><tspan dy=\"0.00em\" x=\"200.0\">have / has + V3  (hiện tại hoàn thành)</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"150\" y2=\"150\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"132\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"150.0\"><tspan dy=\"0.00em\" x=\"580.0\">had + V3</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"176\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"194.0\"><tspan dy=\"0.00em\" x=\"200.0\">V2  (quá khứ đơn)</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"194\" y2=\"194\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"176\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"194.0\"><tspan dy=\"0.00em\" x=\"580.0\">had + V3</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"220\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"238.0\"><tspan dy=\"0.00em\" x=\"200.0\">will + V</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"238\" y2=\"238\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"220\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"238.0\"><tspan dy=\"0.00em\" x=\"580.0\">would + V</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"264\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"282.0\"><tspan dy=\"0.00em\" x=\"200.0\">can</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"282\" y2=\"282\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"264\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"282.0\"><tspan dy=\"0.00em\" x=\"580.0\">could</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"308\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"326.0\"><tspan dy=\"0.00em\" x=\"200.0\">may</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"326\" y2=\"326\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"308\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"326.0\"><tspan dy=\"0.00em\" x=\"580.0\">might</tspan></text><rect class=\"nb\" height=\"36\" rx=\"10\" width=\"320\" x=\"40\" y=\"352\"></rect><text class=\"tx\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"200.0\" y=\"370.0\"><tspan dy=\"0.00em\" x=\"200.0\">must</tspan></text><line class=\"ln\" marker-end=\"url(#ah)\" x1=\"364\" x2=\"416\" y1=\"370\" y2=\"370\"></line><rect class=\"ng\" height=\"36\" rx=\"10\" width=\"320\" x=\"420\" y=\"352\"></rect><text class=\"tb\" style=\"font-size:13px\" text-anchor=\"middle\" x=\"580.0\" y=\"370.0\"><tspan dy=\"0.00em\" x=\"580.0\">had to</tspan></text><text class=\"tm\" style=\"font-size:12px\" text-anchor=\"middle\" x=\"390\" y=\"410\"><tspan dy=\"0.00em\" x=\"390\">Không lùi khi: động từ tường thuật ở HIỆN TẠI (He says…) hoặc nói về sự thật luôn đúng.</tspan></text></svg></div><figcaption>Tường thuật ở quá khứ (He said…) thì lùi một bậc. Tường thuật ở hiện tại (He says…) thì giữ nguyên.</figcaption></figure></section><section class=\"topic\" id=\"t-f1\"><h2>6.2  Lùi thì (Backshift)</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Trực tiếp</th><th>Gián tiếp</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Hiện tại đơn</div></td><td><div>Quá khứ đơn</div></td><td><div>\"I need a car,\" → He said he needed a car.</div></td></tr><tr><td><div>Hiện tại tiếp diễn</div></td><td><div>Quá khứ tiếp diễn</div></td><td><div>\"I'm taking Tom shopping,\" → She said she was taking Tom shopping.</div></td></tr><tr><td><div>Hiện tại hoàn thành</div></td><td><div>Quá khứ hoàn thành</div></td><td><div>\"I've bought a present,\" → She said she'd bought a present.</div></td></tr><tr><td><div>Quá khứ đơn</div></td><td><div>Quá khứ hoàn thành</div></td><td><div>\"I spent six euros,\" → She said she'd spent six euros.</div></td></tr><tr><td><div>Quá khứ tiếp diễn</div></td><td><div>Quá khứ hoàn thành tiếp diễn</div></td><td><div>\"I was hoping to find a top,\" → She said she'd been hoping to find a top.</div></td></tr><tr><td><div>will</div></td><td><div>would</div></td><td><div>\"I need a credit card,\" said Tim. → Tim said he'd need a credit card.</div></td></tr><tr><td><div>can</div></td><td><div>could</div></td><td><div>\"I can take shopping,\" → He said he could take shopping.</div></td></tr><tr><td><div>must / have to</div></td><td><div>had to</div></td><td><div>\"I must go now,\" → He said he had to go.</div></td></tr><tr><td><div>may</div></td><td><div>might</div></td><td><div>\"I may go later,\" → He said he might go later.</div></td></tr></tbody></table></div><aside class=\"note\"><span class=\"chip\">Chú ý</span><div class=\"box\"><p>Không lùi thì khi: (1) sự việc vẫn còn đúng ở hiện tại/là chân lý (He said the Earth goes around the Sun). (2) động từ tường thuật ở hiện tại (He says he is tired). (3) các thì đã ở dạng \"quá khứ nhất\" rồi <span class=\"vi\">(quá khứ hoàn thành, would, could, should, might, ought to, needn't, used to)</span> thì giữ nguyên không lùi thêm nữa.</p></div></aside></section><section class=\"topic\" id=\"t-f2\"><h2>6.3  Thay đổi đại từ, tính từ chỉ định, trạng từ thời gian &amp; nơi chốn</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Đại từ / TT sở hữu</th><th>Chỉ định / nơi chốn</th><th>Trạng từ thời gian</th></tr></thead><tbody><tr><td><div>I → he/she</div></td><td><div>this → that</div></td><td><div>now → then</div></td></tr><tr><td><div>my → his/her</div></td><td><div>these → those</div></td><td><div>today → that day</div></td></tr><tr><td><div>we → they</div></td><td><div>here → there</div></td><td><div>tomorrow → the next/following day</div></td></tr><tr><td><div>me → him/her</div></td><td><div>come → go</div></td><td><div>yesterday → the day before / the previous day</div></td></tr><tr><td><div></div></td><td><div></div></td><td><div>ago → before  |  last week → the previous week  |  next week → the following week</div></td></tr></tbody></table></div><aside class=\"tip\"><span class=\"chip\">Mẹo</span><div class=\"box\"><strong>Mẹo nhớ nhanh</strong><p>Hãy tưởng tượng bạn đang kể lại chuyện đã xảy ra cho người khác nghe VÀO MỘT LÚC KHÁC, Ở MỘT NƠI KHÁC — mọi mốc thời gian/nơi chốn \"gần\" (this, now, here, tomorrow) đều phải chuyển thành \"xa\" (that, then, there, the next day) cho hợp lý với hoàn cảnh kể chuyện.</p></div></aside></section><section class=\"topic\" id=\"t-f3\"><h2>6.4  Câu tường thuật dạng câu hỏi</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại câu hỏi</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Câu hỏi Yes/No</div></td><td><div>asked/wondered + if/whether + S + V <span class=\"vi\">(trật tự câu kể)</span></div></td><td><div>\"Are you coming?\" → He asked if I was coming.</div></td></tr><tr><td><div>Câu hỏi có từ để hỏi (Wh-)</div></td><td><div>asked + Wh-word + S + V <span class=\"vi\">(trật tự câu kể, không đảo ngữ)</span></div></td><td><div>\"Where do you live?\" → He asked where I lived.</div></td></tr></tbody></table></div></section><section class=\"topic\" id=\"t-f4\"><h2>6.5  Câu tường thuật dạng câu mệnh lệnh, yêu cầu, đề nghị</h2><div class=\"tblwrap\"><table class=\"cols-3\"><thead><tr><th>Loại câu</th><th>Cấu trúc</th><th>Ví dụ</th></tr></thead><tbody><tr><td><div>Câu mệnh lệnh khẳng định</div></td><td><div>told/asked + O + to V-inf</div></td><td><div>\"Close the door,\" → He told me to close
